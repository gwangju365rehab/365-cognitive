function u8(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
async function unlock(){
  var pw=document.getElementById("pw").value.trim(), btn=document.getElementById("ok"), msg=document.getElementById("msg");
  if(!pw) return; btn.disabled=true; msg.textContent="";
  try{
    var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(P.s),iterations:P.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);

}
