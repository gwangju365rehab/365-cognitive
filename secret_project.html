<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:#eef1f6;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color:#1f2433}

.big-btn{padding:16px 26px;border-radius:14px;border:none;font-size:1.15rem;font-weight:800;min-height:60px;cursor:pointer}
.b-sec{background:#eceff1;color:#37474f}.b-pri{background:#546e7a;color:#fff}
.big-btn:disabled{opacity:.6}
</style>
</head>

function u8(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}
async function unlock(){
  var pw=document.getElementById("pw").value.trim(), btn=document.getElementById("ok"), msg=document.getElementById("msg");
  if(!pw) return; btn.disabled=true; msg.textContent="";
  try{
    var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(P.s),iterations:P.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    var html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(P.i)},key,u8(P.c)));
    document.open(); document.write(html); document.close();
  }catch(e){ msg.textContent= window.crypto&&crypto.subtle? "비밀번호가 맞지 않아요" : "이 브라우저에서는 열 수 없어요 (크롬 권장)"; document.getElementById("pw").value=""; btn.disabled=false; }
}
document.getElementById("ok").addEventListener("click",unlock);
document.getElementById("pw").addEventListener("keydown",function(e){ if(e.key==="Enter"||e.keyCode===13) unlock(); });
document.getElementById("pw").focus();
