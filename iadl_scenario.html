<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>IADL 시나리오 훈련 - 광주365재활병원</title>
<style>
:root{
  --ink:#1f2433; --sub:#5b6375; --line:#d5dbe6; --bg:#eef1f6; --card:#fff;
  --pri:#283593; --pri-2:#3f51b5; --pri-soft:#e8eaf6;
  --ok:#2e7d32; --ok-soft:#e8f5e9; --bad:#c62828; --bad-soft:#fdecea;
  --warn:#b54708; --warn-soft:#fff4e5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  background:var(--bg);color:var(--ink);font-size:18px;line-height:1.5;padding:16px 14px 90px}
button{font:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
button:focus-visible{outline:3px solid #ffb300;outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.screen{display:none}
.screen.on{display:flex}

#home-btn,#list-btn{position:fixed;top:12px;left:12px;z-index:50;padding:10px 18px;border-radius:999px;border:none;
  background:#fff;color:#333;font-weight:700;font-size:15px;box-shadow:0 2px 6px rgba(0,0,0,.15);min-height:44px}
#list-btn{left:112px;background:var(--pri);color:#fff;display:none}
h1{margin:30px 0 0;text-align:center;font-size:1.8rem;color:#1a237e;font-weight:800}
.lead{text-align:center;color:var(--sub);font-size:1rem;margin:0}

.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field label{font-weight:700;color:var(--sub);font-size:.95rem}
.field input{font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:10px;min-width:180px}

/* 활동 목록 */
.act-list{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.act-list{grid-template-columns:1fr}}
.act-card{text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px;
  display:flex;flex-direction:column;gap:6px;min-height:150px}
.act-card:hover{border-color:var(--pri-2)}
.act-card.done{border-color:#81c784;background:#f6fbf6}
.act-card .t{font-size:1.15rem;font-weight:800}
.act-card .d{font-size:.95rem;color:var(--sub)}
.act-card .st{margin-top:auto;font-size:.9rem;font-weight:700;color:var(--ok)}
.tag{display:inline-block;align-self:flex-start;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:800;color:#fff}
.tag-seq{background:#e64a19}.tag-plan{background:#1976d2}.tag-conflict{background:#7b1fa2}
.tag-budget{background:#388e3c}.tag-adapt{background:#00838f}

.big-btn{padding:16px 22px;border-radius:14px;border:none;font-size:1.1rem;font-weight:800;min-height:58px}
.b-pri{background:var(--pri);color:#fff}
.b-sec{background:#fff;color:var(--ink);border:2px solid var(--line)}
.b-ok{background:var(--ok);color:#fff}

/* 활동 화면 */
.act-top{margin-top:46px;display:flex;align-items:center;gap:12px;background:var(--pri);color:#fff;border-radius:16px;padding:14px 16px}
.act-top .ttl{flex:1;font-size:1.25rem;font-weight:800}
.act-top .tm{font-variant-numeric:tabular-nums;font-weight:700;background:rgba(0,0,0,.2);padding:6px 12px;border-radius:10px;font-size:1rem}
.steps-bar{display:flex;gap:8px;flex-wrap:wrap}
.step-pill{padding:6px 12px;border-radius:999px;background:#fff;border:2px solid var(--line);font-size:.9rem;font-weight:700;color:var(--sub)}
.step-pill.cur{border-color:var(--pri);color:var(--pri);background:var(--pri-soft)}
.step-pill.past{border-color:#a5d6a7;color:var(--ok)}
.situ{background:#fffdf5;border:2px solid #ead9a6;border-radius:16px;padding:14px 18px}
.situ .h{font-weight:800;color:#8a6d1a;font-size:.95rem;margin-bottom:4px}
.situ p{margin:4px 0}
.situ ul{margin:6px 0;padding-left:22px}
.instr{font-size:1.2rem;font-weight:800;color:var(--pri);margin:0}
.hint{font-size:.95rem;color:var(--sub);margin:0}
.lbl{font-size:.92rem;font-weight:800;color:var(--sub);margin:6px 0 2px}

/* 순서 정하기 */
.pool{display:flex;flex-wrap:wrap;gap:10px;min-height:58px}
.chip{padding:12px 16px;border-radius:12px;border:2px solid var(--pri-2);background:#fff;color:var(--pri);font-weight:700;min-height:54px}
.chip.sel{background:var(--pri-2);color:#fff}
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 14px;border-radius:12px;border:2px dashed var(--line);background:#fafbfd;min-height:54px}
.slot.filled{border-style:solid;border-color:var(--pri-2);background:var(--pri-soft)}
.slot-n{min-width:32px;height:32px;border-radius:50%;background:var(--pri-2);color:#fff;font-weight:800;display:grid;place-items:center;font-size:.95rem}
.slot:not(.filled) .slot-n{background:#c5cbd8}
.slot-t{font-weight:700}
.slot:not(.filled) .slot-t{color:#9aa2b2}
.locked{pointer-events:none;opacity:.8}
.dlist{display:flex;flex-direction:column;gap:8px}
.drow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:2px solid var(--pri-2);
  background:var(--pri-soft);min-height:58px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.drow:active{cursor:grabbing}
.drow .grip{margin-left:auto;color:#7986cb;font-size:1.3rem;line-height:1}
.drow.dsrc{opacity:.3}
.drow.dover{border-color:#ff9800;box-shadow:0 0 0 3px #ffe0b2}
.dclone{position:fixed;left:0;top:0;margin:0;z-index:9999;pointer-events:none;opacity:.95;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.empty-note{color:var(--sub);font-size:.95rem;padding:12px 0}

/* 선택 버튼 묶음 */
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-width:64px;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:700}
.seg button.on{border-color:var(--pri-2);background:var(--pri-2);color:#fff}
.est-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid #eceff4}
.est-row .nm{font-weight:700}
.total{font-size:1.15rem;font-weight:800;text-align:right}

/* 약속별 시각 고르기 카드 */
.tcards{display:flex;flex-direction:column;gap:10px}
.tcard{border:2px solid var(--line);border-radius:14px;padding:10px 14px;background:#fafbfd}
.tcard.done{border-color:#9fa8da}
.tc-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-bottom:6px;border-bottom:1px solid #e3e7ef;margin-bottom:4px}
.tc-h .dy{background:var(--pri);color:#fff;border-radius:8px;padding:2px 10px;font-weight:800;font-size:.95rem}
.tc-h .nm{font-weight:800;font-size:1.08rem}
.tc-h .at{color:var(--sub);font-weight:700}
.tc-row{display:grid;grid-template-columns:92px 1fr;align-items:center;gap:10px;padding:5px 0}
.tc-row .k{font-weight:800;color:var(--sub);font-size:.95rem}
.tc-row .seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tc-row .seg button{min-width:0;padding:9px 4px;font-size:.95rem;white-space:nowrap}
@media(max-width:560px){.tc-row{grid-template-columns:1fr}.tc-row .seg{grid-template-columns:repeat(2,1fr)}}
.conds{margin:6px 0;padding-left:22px}
.conds li{margin:2px 0}

/* 시간 선택 */
.clock{display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px 0}
.clock .disp{font-size:2.4rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--pri);background:var(--pri-soft);padding:8px 28px;border-radius:14px}
.clock .ctrls{display:grid;grid-template-columns:repeat(4,auto);gap:8px}
.clock .ctrls button{padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:800;min-width:96px}

/* 타임라인 */
.tl{display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums}
.tl div{display:flex;gap:12px;padding:8px 12px;border-radius:10px;background:#f6f7fb}
.tl .tt{min-width:170px;font-weight:700;color:var(--sub)}
.tl .fin{background:var(--pri-soft);font-weight:800}

/* 피드백 */
.fb{border-radius:14px;padding:14px 16px;border:2px solid}
.fb.ok{background:var(--ok-soft);border-color:#a5d6a7}
.fb.bad{background:var(--bad-soft);border-color:#ef9a9a}
.fb.warn{background:var(--warn-soft);border-color:#ffcc80}
.fb .r{font-weight:800;font-size:1.1rem;margin-bottom:4px}
.fb ul{margin:6px 0 0;padding-left:20px}
.fb li{margin:3px 0}
.okc{color:var(--ok);font-weight:800}.badc{color:var(--bad);font-weight:800}

/* 달력 */
.cal-wrap{overflow-x:auto}
.cal{display:grid;gap:0;border:2px solid #8e99ad;border-radius:12px;background:#fff;position:relative;overflow:hidden;margin:0 auto}
.cal .dh{display:grid;place-items:center;font-weight:800;font-size:1.05rem;background:#e3e8f1;border-bottom:2px solid #8e99ad;border-left:1px solid #8e99ad}
.cal .th{white-space:nowrap;font-size:.92rem;font-weight:800;color:#3f4757;padding:2px 8px 0;text-align:right;border-right:2px solid #8e99ad}
.cal .cell{border:none;border-top:1px dashed #c3cad6;border-left:1px solid #8e99ad;background:transparent;padding:0}
.cal .cell.hr{border-top:1px solid #8e99ad}
.cal.pickable .cell:hover{background:#e3f2fd}
.cal .blk{margin:2px 4px;border-radius:8px;background:#5c6bc0;color:#fff;font-size:1.05rem;font-weight:800;position:relative;
  padding:4px 8px;overflow:hidden;line-height:1.25;z-index:2;border:2px solid transparent;text-align:left}
.cal .blk.has-x{padding-right:30px}
.cal .blk .x{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:none;background:rgba(255,255,255,.85);
  color:#c62828;font-weight:900;font-size:.72rem;line-height:22px;padding:0;text-align:center;min-height:0}
.cal .blk .x:active{background:#ffcdd2}
.cal .blk small{display:block;font-size:.88rem;font-weight:700;opacity:.95}
.cal .blk.med{background:#7b1fa2}
.cal .blk.new{background:#00838f}
.cal .blk.sel{background:#fff;color:var(--bad);border-color:var(--bad)}
.cal .blk.ghost{background:transparent;border:2px dashed #9aa2b2;color:#9aa2b2;pointer-events:none}
.cal .blk.tap{cursor:pointer}
.cal .blk.fixed{background:#546e7a}
.cal .blk.fixed.med{background:#7b1fa2}
.cal .blk.p2{background:#ef6c00}
.cal .blk.p3{background:#2e7d32}
.cal .blk.rt{background:#8d6e63}
.cal .blk.mv{background:#90a4ae;color:#263238}
/* 하루 시간표: 넣을 일정 목록(왼쪽) + 시간표(오른쪽) */
.plan2{display:flex;align-items:flex-start;gap:14px}
.plan2 .side{flex:0 0 250px;position:sticky;top:64px;display:flex;flex-direction:column;gap:8px}
.plan2 .side .palette{flex-direction:column;flex-wrap:nowrap}
.plan2 .side .chip{text-align:left;width:100%}
.plan2 .main{flex:1;min-width:0}
@media(max-width:720px){.plan2{flex-direction:column}.plan2 .side{position:static;flex:none;width:100%}.plan2 .side .palette{flex-direction:row;flex-wrap:wrap}.plan2 .side .chip{width:auto}}
.npad{display:grid;grid-template-columns:repeat(3,96px);gap:8px}
.npad button{padding:14px 0;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:1.2rem}
.qb{min-width:52px;height:42px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:.9rem}
.amt{min-width:110px;text-align:center;font-variant-numeric:tabular-nums}
.mx{border-collapse:collapse;width:100%;min-width:520px}
.mx th,.mx td{border:1px solid var(--line);padding:4px;text-align:center;font-size:.9rem}
.mx th{background:#f3f5fa}.mx th.rh{text-align:left;padding:6px 10px;white-space:nowrap}
.mxb{width:100%;min-height:44px;border:none;border-radius:8px;background:#fff;font-weight:800;font-size:1.2rem;color:#fff}
.mxb.on{background:var(--ok)}
.mtl{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.mtr{display:flex;align-items:center;flex-wrap:wrap;gap:8px;min-height:42px;padding:4px 10px;border-top:1px solid #eef1f5}
.mtr.meal{background:#fff8e1}
.mtr.pick{cursor:pointer}.mtr.pick:hover{background:#e3f2fd}
.mtr .tm{min-width:110px;color:var(--sub);font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.mtr .ml{min-width:80px;font-weight:800;color:#8a6d1a;font-size:.9rem}
.pill{padding:6px 12px;border-radius:999px;background:var(--pri-2);color:#fff;font-weight:700;font-size:.85rem;border:none}
.pill .px{display:inline-block;margin-left:6px;background:#fff;color:#c62828;border-radius:6px;padding:0 6px;font-weight:900}
/* 난이도 선택 */
.lv-list{display:flex;flex-direction:column;gap:10px}
.lv-btn{display:flex;align-items:center;gap:14px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 16px;min-height:70px}
.lv-btn:hover{border-color:var(--pri-2)}
.lv-btn .lvn{min-width:84px;text-align:center;padding:8px 0;border-radius:10px;font-weight:800;color:#fff}
.lv1 .lvn{background:#43a047}.lv2 .lvn{background:#1e88e5}.lv3 .lvn{background:#e53935}
.lv-btn .lvd{font-size:1rem;color:var(--ink)}
.lvtag{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;font-size:.75rem;font-weight:800;background:#eceff4;color:var(--sub);vertical-align:middle}
/* 되돌아보기 */
.rf-sec{border-top:1px solid #eceff4;padding-top:12px}
.rf-sec .lbl{margin-top:0}
.rf-cmp{margin-top:8px;padding:10px 14px;border-radius:12px;background:#f6f7fb;font-weight:700}
.rf-q{margin:4px 0 0;padding-left:22px;color:var(--ink)}
.rf-q li{margin:3px 0}
.tag-health{background:#c62828}.tag-prior{background:#f57c00}

/* 장보기 */
.shop{display:grid;grid-template-columns:1fr 290px;gap:14px;align-items:start}
@media(max-width:720px){.shop{grid-template-columns:1fr}}
.sec-h{font-weight:800;color:var(--sub);margin:10px 0 6px;font-size:.95rem}
.goods{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.good{text-align:left;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;min-height:74px}
.good .n{font-weight:800}
.good .u{font-size:.85rem;color:var(--sub)}
.good .p{font-weight:700;color:var(--pri)}
.good.in{border-color:var(--pri-2);background:var(--pri-soft)}
.cart{position:sticky;top:10px}
.cart-row{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid #eceff4;font-size:.95rem}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:38px;height:38px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:800}
.toggle{display:flex;align-items:center;gap:8px;font-size:.95rem;font-weight:700;color:var(--sub)}
.toggle input{width:22px;height:22px}

/* 메시지 */
.msgs{display:flex;flex-direction:column;gap:8px}
.msg{background:#e0f2f1;border-radius:14px 14px 14px 4px;padding:12px 16px;max-width:560px}
.msg .from{font-size:.85rem;font-weight:800;color:#00695c}
.palette{display:flex;flex-wrap:wrap;gap:10px}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--bad-soft);border:2px solid #ef9a9a;border-radius:12px;padding:10px 14px}

/* 질문 */
.q{padding:12px 0;border-bottom:1px solid #eceff4}
.q .qt{font-weight:700;margin-bottom:8px}
.q .seg button.on.r0{background:var(--ok);border-color:var(--ok)}
.q .seg button.on.r1{background:#ef6c00;border-color:#ef6c00}
.q .seg button.on.r2{background:var(--bad);border-color:var(--bad)}
textarea{font:inherit;width:100%;min-height:80px;padding:10px;border:2px solid var(--line);border-radius:10px}

.foot{display:flex;justify-content:flex-end;gap:10px}

/* 리포트 */
.rep h2{margin:0 0 4px;font-size:1.4rem}
.rep .meta{color:var(--sub);margin-bottom:10px}
.rep table{width:100%;border-collapse:collapse;font-size:.95rem;margin:6px 0 10px}
.rep th,.rep td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.rep th{background:#f3f5fa}
.rep .act-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:14px;border-bottom:2px solid var(--pri);padding-bottom:4px}
.rep .act-h b{font-size:1.1rem}
.pass{color:var(--ok);font-weight:800}.fail{color:var(--bad);font-weight:800}.na{color:var(--sub)}
#hospital-logo{position:fixed;bottom:10px;right:14px;font-size:.8rem;color:#9aa2b2;font-weight:700}

@media print{
  body{background:#fff;padding:0;font-size:12px}
  #home-btn,#hospital-logo,.no-print{display:none!important}
  .panel{border:none;padding:0}
  .rep table{font-size:11px}
  .act-h{break-after:avoid}
  table{break-inside:auto} tr{break-inside:avoid}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<button id="home-btn" onclick="location.href='index.html'">홈으로</button>
<button id="list-btn" onclick="listBtn()">목록으로</button>

<!-- 홈 -->
<div class="wrap screen on" id="scr-home">
  <h1>IADL 시나리오 훈련</h1>
  <p class="lead">상황을 읽고, 화면에서 직접 계획하고 정리해 보세요.</p>
  <div class="panel field">
    <label for="pname">환자명</label><input id="pname" placeholder="선택 입력"/>
    <label>날짜</label><span id="today"></span>
  </div>
  <div class="act-list" id="act-list"></div>
  <div class="row" style="justify-content:center">
    <button class="big-btn b-pri" id="btn-report" disabled onclick="showReport()">결과 리포트 보기</button>
  </div>
</div>

<!-- 활동 -->
<div class="wrap screen" id="scr-act">
  <div class="act-top">
    <div class="ttl" id="a-title"></div>
    <div class="tm" id="a-timer">0:00</div>
  </div>
  <div class="steps-bar" id="a-steps"></div>
  <div class="situ" id="a-situ"></div>
  <div class="panel" style="display:flex;flex-direction:column;gap:12px">
    <p class="instr" id="a-instr"></p>
    <p class="hint" id="a-hint"></p>
    <div id="a-body" style="display:flex;flex-direction:column;gap:12px"></div>
  </div>
  <div class="foot"><button class="big-btn b-pri" id="a-next" disabled>다음 단계</button></div>
</div>

<!-- 리포트 -->
<div class="wrap screen" id="scr-rep">
  <div class="panel rep" id="rep-body"></div>
  <div class="row no-print" style="justify-content:center">
    <button class="big-btn b-sec" onclick="go('home')">목록으로</button>
    <button class="big-btn b-pri" onclick="window.print()">인쇄하기</button>
  </div>
</div>

<div id="hospital-logo">광주365재활병원_인지연하팀</div>

<script>
// ══ 공통 도구 ══════════════════════════════════════════
function h(tag, props, ...kids){
  const e=document.createElement(tag);
  if(props) for(const k in props){
    const v=props[k];
    if(v==null||v===false) continue;
    if(k==='class') e.className=v;
    else if(k==='html') e.innerHTML=v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2),v);
    else if(k==='style') e.style.cssText=v;
    else if(k==='disabled') e.disabled=!!v;
    else e.setAttribute(k,v);
  }
  kids.flat(Infinity).forEach(c=>{ if(c==null||c===false) return; e.append(c.nodeType?c:document.createTextNode(String(c))); });
  return e;
}
const pick=a=>a[Math.floor(Math.random()*a.length)];
const rnd=(a,b)=>a+Math.random()*(b-a);
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function fmt(m){const hh=Math.floor(m/60),mm=m%60;const ap=hh<12?'오전':'오후';const h12=hh>12?hh-12:hh;return `${ap} ${h12}시${mm?` ${mm}분`:''}`;}
function won(n){return n.toLocaleString('ko-KR')+'원';}
function mmss(ms){const s=Math.floor(ms/1000);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}
const DAYS=['월','화','수','목','금'];
const DAYN=['월요일','화요일','수요일','목요일','금요일'];

// 순서 정하기 위젯: 카드를 끌어서 다른 카드 위에 놓으면 그 자리로 끼워 넣음 (순서화 훈련과 같은 방식)
function orderer(items, onChange){
  let order=items.slice(), locked=false;
  const wrap=h('div',{class:'dlist'});
  let src=null, clone=null, offX=0, offY=0, over=null;
  function draw(){
    wrap.innerHTML='';
    order.forEach((it,i)=>{
      const row=h('div',{class:'drow','data-pos':i},h('span',{class:'slot-n'},i+1),h('span',{class:'slot-t'},it),h('span',{class:'grip','aria-hidden':'true'},'☰'));
      row.addEventListener('pointerdown',e=>start(e,row));
      wrap.append(row);
    });
  }
  function rowAt(x,y){
    if(clone) clone.style.display='none';
    const el=document.elementFromPoint(x,y);
    if(clone) clone.style.display='';
    const r=el&&el.closest('.drow');
    return r&&wrap.contains(r)?r:null;
  }
  function start(e,row){
    if(locked||src||(e.button!==undefined&&e.button!==0)) return;
    e.preventDefault();
    src=row;
    const r=row.getBoundingClientRect();
    offX=e.clientX-r.left; offY=e.clientY-r.top;
    clone=row.cloneNode(true); clone.classList.add('dclone');
    clone.style.width=r.width+'px';
    clone.style.transform=`translate3d(${r.left}px,${r.top}px,0)`;
    document.body.append(clone);
    row.classList.add('dsrc');
    window.addEventListener('pointermove',move,{passive:false});
    window.addEventListener('pointerup',finish);
    window.addEventListener('pointercancel',cancel);
  }
  function move(e){
    if(!src) return;
    e.preventDefault();
    clone.style.transform=`translate3d(${e.clientX-offX}px,${e.clientY-offY}px,0)`;
    const el=rowAt(e.clientX,e.clientY);
    if(el!==over){ if(over) over.classList.remove('dover'); over=(el&&el!==src)?el:null; if(over) over.classList.add('dover'); }
  }
  function cleanup(){
    window.removeEventListener('pointermove',move);
    window.removeEventListener('pointerup',finish);
    window.removeEventListener('pointercancel',cancel);
    if(clone){clone.remove();clone=null;}
    if(over){over.classList.remove('dover');over=null;}
    if(src) src.classList.remove('dsrc');
  }
  function finish(e){
    if(!src) return;
    const target=rowAt(e.clientX,e.clientY);
    const from=+src.dataset.pos;
    cleanup(); src=null;
    if(target){
      const to=+target.dataset.pos;
      if(to!==from){ const [m]=order.splice(from,1); order.splice(to,0,m); draw(); onChange(order.slice()); }
    }
  }
  function cancel(){ cleanup(); src=null; }
  draw();
  return {el:wrap,get:()=>order.slice(),
    lock(){locked=true;wrap.classList.add('locked');},
    unlock(){locked=false;wrap.classList.remove('locked');}};
}

function seg(options, onPick, cur, fmtFn){
  const s=h('div',{class:'seg'});
  options.forEach(o=>s.append(h('button',{class:o===cur?'on':'',onclick:()=>onPick(o)},fmtFn?fmtFn(o):o)));
  return s;
}

function fbBox(kind,title,lines){
  return h('div',{class:'fb '+kind},h('div',{class:'r'},title),lines&&lines.length?h('ul',null,lines.map(l=>h('li',{html:l}))):null);
}

// 달력 위젯 (월~금, 오전 9시~오후 5시, 30분 단위)
const CAL_START=540, CAL_END=1020, SLOT=30;
function calendar(opts){
  // opts: cols(열 이름), colNames, start, end, blocks [{id,day,start,dur,name,cls,tap}], onCell(day,start), onBlock(block), pickable
  const cols=opts.cols||DAYS, names=opts.colNames||DAYN, st=opts.start??CAL_START, en=opts.end??CAL_END;
  const rows=(en-st)/SLOT, one=cols.length===1, cw=one?260:118, rh=one?36:32;
  const g=h('div',{class:'cal'+(opts.pickable?' pickable':''),
    style:`grid-template-columns:92px repeat(${cols.length},minmax(${cw}px,1fr));grid-template-rows:42px repeat(${rows},${rh}px);min-width:${92+cols.length*cw}px;max-width:${one?480:92+cols.length*170}px`});
  g.append(h('div',{style:'grid-row:1;grid-column:1;background:#e3e8f1;border-bottom:2px solid #8e99ad;border-right:2px solid #8e99ad'}));
  cols.forEach((d,i)=>g.append(h('div',{class:'dh',style:`grid-row:1;grid-column:${i+2}`},d)));
  for(let r=0;r<rows;r++){
    const t=st+r*SLOT;
    g.append(h('div',{class:'th',style:`grid-row:${r+2};grid-column:1;${t%60?'':'border-top:1px solid #8e99ad'}`},t%60?'':fmt(t)));
    for(let d=0;d<cols.length;d++){
      g.append(h('button',{class:'cell'+(t%60?'':' hr'),style:`grid-row:${r+2};grid-column:${d+2}`,'aria-label':`${names[d]} ${fmt(t)}`,
        onclick:opts.onCell?()=>opts.onCell(d,t):null,tabindex:opts.pickable?0:-1}));
    }
  }
  (opts.blocks||[]).forEach(b=>{
    const r0=(b.start-st)/SLOT, span=Math.max(1,b.dur/SLOT), tap=opts.onBlock&&b.tap!==false;
    const rm=opts.onRemove&&b.removable;
    g.append(h('div',{class:'blk '+(b.cls||'')+(tap?' tap':'')+(rm?' has-x':''),role:tap?'button':null,
      style:`grid-row:${r0+2} / span ${span};grid-column:${b.day+2}`,onclick:tap?()=>opts.onBlock(b):null},
      b.name,span>1?h('small',null,one?rangeTxt(b.start,b.start+b.dur):shortRange(b.start,b.start+b.dur)):null,
      rm?h('button',{class:'x','aria-label':`${b.name} 빼기`,title:'빼기',onclick:e=>{e.stopPropagation();opts.onRemove(b);}},'✕'):null));
  });
  return h('div',{class:'cal-wrap'},g);
}
// 여러 요일 달력용 짧은 표기 "2:30~3:30"
function shortRange(a,b){const f=m=>{const hh=Math.floor(m/60),mm=m%60,h12=hh>12?hh-12:hh;return h12+':'+(mm<10?'0':'')+mm;};return f(a)+'~'+f(b);}
// "오후 4시 ~ 5시 30분" (오전/오후가 같으면 끝 시각에서 생략)
function rangeTxt(a,b){const ap=m=>Math.floor(m/60)<12;const e=fmt(b);return `${fmt(a)} ~ ${ap(a)===ap(b)?e.replace(/^오[전후] /,''):e}`;}
const overlap=(a,b)=>a.day===b.day&&a.start<b.start+b.dur&&b.start<a.start+a.dur;

const ACTS=[

{

// ── 2. 병원 방문 계획하기 (시간계획) ───────────
{
  id:'hospital', no:2, title:'병원 방문 계획하기', tag:'시간계획', tagClass:'tag-plan',
  desc:'출발 시각을 거꾸로 계산하고, 일어날 시각과 아침 준비 시간표를 정합니다.',
  levels:{1:'차로 이동 · 아침에 할 일 4가지',2:'걷기 + 버스로 이동 · 할 일 5가지',3:'걷기 + 버스 + 걷기 · 할 일 6가지 · 약은 식사 끝나고 30분 뒤'},
  init(level){
    const appt=pick([600,630,660]);
    let legs, wait=20;
    if(level===1) legs=[['차로 이동',30]];
    else if(level===2) legs=[['버스 정류장까지 걷기',10],['버스 타기',pick([20,30])]];
    else { legs=[['버스 정류장까지 걷기',pick([5,15])],['버스 타기',pick([20,30,40])],['내려서 병원까지 걷기',5]]; wait=pick([20,30]); }
    const move=legs.reduce((s,x)=>s+x[1],0);
    const tasks=['개인위생 (세수·옷 입기)','아침 식사','약 복용','서류·보험카드 챙기기'];
    if(level>=2) tasks.push('혈압 재고 기록하기');
    if(level>=3) tasks.push('설거지하기');

    <p>병원에 도착하면 접수와 대기에 <b>${c.wait}분</b>이 필요합니다.</p>
    <p>병원 가기 전에 할 일: ${c.tasks.join(', ')}</p>`+
    (c.level===3?'<p>약은 <b>아침 식사가 끝나고 30분이 지난 뒤</b>에 먹어야 합니다.</p>':''); },

      render(body,c,d,done,api){
        api.setInstr(`${fmt(c.deadline)}에 출발하려면 몇 시에 일어나야 할까요? 일어날 시각과 아침에 할 일을 정하세요.`);

            const finish=cur, slack=c.deadline-finish;
            d.wake=wake; d.order=ord.slice(); d.finish=finish; d.slack=slack;
            const meal='아침 식사', med='약 복용';
            const list=[];
            if(c.level===3) list.push(crit(`약 복용: 식사가 끝나고 30분 뒤 (식사 끝 ${fmt(at[meal]+d.dur[meal])}, 약 ${fmt(at[med])})`,at[med]>=at[meal]+d.dur[meal]+30));
            else list.push(crit('약 복용을 아침 식사 뒤에 함',at[med]>at[meal]));
            list.push(crit(`출발 시각 ${fmt(c.deadline)} 전에 준비를 마침 (준비 끝 ${fmt(finish)})`,finish<=c.deadline));
            list.push(crit(`일어날 시각이 알맞음 — 준비를 마치고 남는 시간 30분 이내 (지금 ${slack>=0?slack+'분':'0분'})`,slack<=30));
            return critResult(list,[`일어나기 ${fmt(wake)} → 준비 끝 ${fmt(finish)} → 출발 ${fmt(c.deadline)}`]);
          }}));
      }},
  ],
  questions:['예상치 못한 교통 체증이 생기면 계획을 어떻게 바꿀 수 있을까요?','어떤 활동이 가장 중요하고 반드시 해야 하나요?','시간을 아낄 수 있는 방법은 무엇일까요?'],
  summarize(d,c){
    return [
      {label:'출발 시각 계산',ok:!!d.departOk,detail:`답 ${d.depart!=null?fmt(d.depart):'-'} / 기준 ${fmt(c.deadline)} (${d.departJudge||'-'}) — 예약 ${c.hosp} ${fmt(c.appt)}`},
    ].concat(sumCheck(d,'plan','아침 시간표'),[
      {label:'아침 계획',ok:null,detail:d.wake!=null?`기상 ${fmt(d.wake)} · 준비 끝 ${fmt(d.finish)} · 남는 시간 ${Math.max(0,d.slack)}분<br>${d.order.map(i=>`${i} ${d.dur[i]}분`).join(' → ')}`:'-'},
    ]);
  }
},
// ── 3. 겹치는 의료 약속 조정하기 (일정충돌) ────
{
  id:'conflict', no:8, title:'겹치는 의료 약속 조정하기', tag:'일정충돌', tagClass:'tag-conflict',
  desc:'약속을 달력에 직접 넣고, 이동 시간 때문에 제시간에 갈 수 없는 날을 찾아 약속을 옮깁니다.',
  levels:{1:'약속 4개 · 문제 있는 날 1곳 · 이동 30분',2:'약속 5개 · 문제 있는 날 2곳 · 이동 30분',3:'약속 7개 · 문제 있는 날 2곳 + 같은 날이지만 괜찮은 날 1곳 · 이동 40분'},
  init(level){ return conflictGen(level); },
  situation(c){ return `<p>다음 주에 의료 약속이 여러 개 잡혀 있습니다.</p><ul>`+
    c.appts.map(a=>`<li>${DAYN[a.day]} ${fmt(a.start)}: ${a.name} (${durTxt(a.dur)})</li>`).join('')+
    `</ul><p>약속 장소가 모두 달라서, 약속과 약속 사이에는 이동 시간 <b>${c.T}분</b>이 필요합니다. 약속은 오전 9시~오후 5시 사이에만 잡을 수 있습니다.</p>`; },
  steps:[
    { name:'달력에 넣기', instr:'약속을 모두 달력에 넣으세요.', hint:'약속을 누른 뒤 달력 칸을 누르면 그 시각에 들어갑니다. 넣은 약속은 오른쪽 위 ✕ 를 누르면 빠집니다.',
      render(body,c,d,done){
        const pl=planner({start:CAL_START,end:CAL_END,items:c.appts.map(a=>({id:a.id,name:a.name,dur:a.dur,cls:'med'})),allowOverlap:true});
        body.append(pl.el,checker('달력 확인',{d,key:'cal',done,lock:pl.lock,unlock:pl.unlock,evaluate(){
          if(!pl.placedAll(c.appts.map(a=>a.id))) return {incomplete:'아직 넣지 않은 약속이 있습니다.'};
          return critResult(c.appts.map(a=>{const p=pl.pos(a.id);return crit(`${a.name}: ${DAYN[a.day]} ${fmt(a.start)}`,p.day===a.day&&p.start===a.start);}));
        }}));
      }},
    { name:'문제 있는 날 찾기', instr:'', hint:'같은 날 약속이 두 개라면, 앞 약속이 끝난 시각에 이동 시간을 더해 다음 약속 시각과 비교해 보세요.',
      render(body,c,d,done,api){
        api.setInstr(`이동 시간 ${c.T}분 때문에 제시간에 갈 수 없는 약속이 있는 요일을 모두 고르세요.`);
        body.append(calendar({blocks:c.appts.map(a=>({...a,cls:'med'}))}));
        const mp=multiPick(DAYN.slice(0,5));
        body.append(h('div',{class:'lbl'},'문제 있는 요일'),mp.el,checker('확인',{d,key:'find',done,lock:mp.lock,evaluate(){
          const s=mp.get(); if(!s.size) return {incomplete:'요일을 하나 이상 골라 주세요. 없다고 생각하면 치료사에게 말해 주세요.'};
          d.findSel=[...s].map(i=>DAYS[i]).join(', ');
          const list=[0,1,2,3,4].filter(i=>c.badDays.includes(i)||s.has(i)).map(i=>crit(`${DAYN[i]}: ${c.badDays.includes(i)?'문제 있음':'문제 없음'}`,s.has(i)===c.badDays.includes(i)));
          return critResult(list,c.pairs.map(([x,y])=>{const A=c.appts.find(a=>a.id===x),B=c.appts.find(a=>a.id===y);
            return `${DAYN[A.day]}: ${A.name} 끝 ${fmt(A.start+A.dur)} + 이동 ${c.T}분 = <b>${fmt(A.start+A.dur+c.T)}</b> 도착 → ${B.name} ${fmt(B.start)} `+
              (A.start+A.dur+c.T>B.start?'<span class="badc">늦습니다</span>':'<span class="okc">괜찮습니다</span>');}));
        }}));
      }},
    { name:'약속 옮기기', instr:'', hint:'옮길 약속의 ✕ 를 눌러 뺀 뒤, 아래에서 그 약속을 누르고 새 시간 칸을 누르세요. 겹치는 두 약속 중 하나만 옮겨도 됩니다.',
      render(body,c,d,done,api){
        api.setInstr('제시간에 갈 수 있도록 약속을 옮겨 새 일정을 만드세요.');
        const pl=planner({start:CAL_START,end:CAL_END,paletteLabel:'다시 넣을 약속',
          items:c.appts.map(a=>({id:a.id,name:a.name,dur:a.dur,cls:'med',at:{day:a.day,start:a.start}}))});
        body.append(pl.el,checker('새 일정 확인',{d,key:'fix',done,lock:pl.lock,unlock:pl.unlock,evaluate(){
          if(!pl.placedAll(c.appts.map(a=>a.id))) return {incomplete:'빼낸 약속을 새 시간에 다시 넣어 주세요.'};
          const P=c.appts.map(a=>({...a,...pl.pos(a.id)}));
          const tight=[]; for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const x=P[i],y=P[j];
            if(x.day===y.day&&x.start<y.start+y.dur+c.T&&y.start<x.start+x.dur+c.T) tight.push(`${DAYS[x.day]} ${x.name}·${y.name}`);}
          const moved=P.filter(p=>{const a=c.appts.find(q=>q.id===p.id);return a.day!==p.day||a.start!==p.start;});
          const pairIds=flat1(c.pairs);
          const extra=moved.filter(m=>!pairIds.includes(m.id));
          const pairsMoved=c.pairs.every(pr=>pr.some(id=>moved.some(m=>m.id===id)));
          d.fixTxt=moved.map(m=>`${m.name} → ${DAYS[m.day]} ${fmt(m.start)}`).join(', ')||'옮긴 약속 없음';
          return critResult([
            crit(`모든 약속 사이에 이동 시간 ${c.T}분 이상`+(tight.length?` (부족: ${tight.join(', ')})`:''),!tight.length),
            crit('문제가 있던 날마다 약속 하나 이상을 옮김',pairsMoved),
            crit('문제가 없던 약속은 그대로 둠'+(extra.length?` (옮김: ${extra.map(m=>m.name).join(', ')})`:''),!extra.length)],
            [`옮긴 약속: ${d.fixTxt}`]);
        }}));
      }},
  ],
  questions:['어떤 약속을 옮기기로 했나요? 그 이유는 무엇인가요?','약속을 바꾸려면 어디에, 어떤 순서로 연락해야 할까요?','약속 변경이 어려우면 어떤 대안이 있을까요?'],
  summarize(d,c){ return [{label:'이번 약속',ok:null,detail:c.appts.map(a=>`${DAYS[a.day]} ${fmt(a.start)} ${a.name}`).join(', ')+` · 이동 ${c.T}분`}]
    .concat(sumCheck(d,'cal','달력에 넣기'),sumCheck(d,'find','문제 있는 날 찾기'),sumCheck(d,'fix','약속 옮기기'),[{label:'옮긴 약속 (최종)',ok:null,detail:d.fixTxt||'-'}]); }
},
// ── 4. 건강한 식사 계획과 장보기 (예산관리) ────
{
  id:'shopping', no:5, title:'건강한 식사 계획과 장보기', tag:'예산관리', tagClass:'tag-budget',
  desc:'저염·저지방 원칙과 예산에 맞게 3일치 식재료를 장바구니에 담습니다.',
  levels:{1:'넉넉한 예산 · 단백질 1, 채소 2, 곡류 1 · 합계 보임',2:'보통 예산 · 단백질 2, 채소 3, 곡류 1 · 합계 보임',3:'빠듯한 예산 · 집에 있는 재료는 사지 않기 · 합계 숨김'},
  init(level){
    const c={mart:pick(MARTS),home:[],showTotal:level!==3};
    if(level===1){ c.budget=pick([80000,100000]); c.need={pro:1,veg:2,grain:1}; }
    else if(level===2){ c.budget=pick([50000,60000,70000]); c.need={pro:2,veg:3,grain:1}; }
    else { c.budget=pick([35000,40000,45000]); c.need={pro:2,veg:3,grain:1};
      c.home=[pick(['egg','tofu']),pick(['carr','cabb','zucc'])]; }
    return c;
  },
  situation(c){ const nm=id=>GOODS.find(g=>g.id===id).name;
    return `<p>의사는 <b>저염식, 저지방 식단</b>을 권장했습니다.</p>
    <p>${c.mart}에서 3일치 식단에 필요한 식재료를 사려고 합니다. 예산은 <b>${won(c.budget)}</b>입니다.</p>
    <p>필요한 재료: <b>단백질 식품 ${c.need.pro}가지 이상, 채소 ${c.need.veg}가지 이상, 밥에 넣을 곡류 ${c.need.grain}가지 이상</b></p>`+
    (c.home.length?`<p>집에 이미 <b>${c.home.map(nm).join(', ')}</b>이(가) 있습니다. 집에 있는 재료도 필요한 재료로 셉니다. <b>이미 있는 것은 사지 마세요.</b></p>`:''); },
  steps:[
    { name:'장바구니 담기', instr:'필요한 식재료를 골라 장바구니에 담으세요.', hint:'상품을 누르면 1개씩 담깁니다. 장바구니에서 개수를 바꿀 수 있습니다. 가격은 연습용 예시입니다.',
      render(body,c,d,done){
        const G=GOODS; const cart={}; d.rounds=[]; let showTotal=c.showTotal;
        const left=h('div'), right=h('div',{class:'panel cart'}), out=h('div');
        const total=()=>Object.entries(cart).reduce((s,[k,q])=>s+G.find(g=>g.id===k).price*q,0);
        function drawGoods(){
          left.innerHTML='';
          SECTIONS.forEach(sec=>{
            left.append(h('div',{class:'sec-h'},sec));
            const box=h('div',{class:'goods'});
            G.filter(g=>g.sec===sec).forEach(g=>box.append(h('button',{class:'good'+(cart[g.id]?' in':''),onclick:()=>{cart[g.id]=(cart[g.id]||0)+1;redraw();}},
              h('div',{class:'n'},g.name),h('div',{class:'u'},g.unit),h('div',{class:'p'},won(g.price)))));
            left.append(box);
          });
        }
        function drawCart(){
          right.innerHTML='';
          right.append(h('div',{class:'lbl',style:'margin-top:0'},`장바구니 (예산 ${won(c.budget)})`));
          const ks=Object.keys(cart);
          if(!ks.length) right.append(h('div',{class:'empty-note'},'아직 담은 상품이 없습니다.'));
          ks.forEach(k=>{ const g=G.find(x=>x.id===k);
            right.append(h('div',{class:'cart-row'},h('span',null,g.name),h('div',{class:'qty'},
              h('button',{onclick:()=>{cart[k]--; if(!cart[k]) delete cart[k]; redraw();},'aria-label':'빼기'},'−'),
              h('b',null,cart[k]),
              h('button',{onclick:()=>{cart[k]++;redraw();},'aria-label':'더하기'},'+'))));
          });
          right.append(h('div',{class:'total',style:'margin-top:8px'},showTotal?`합계 ${won(total())}`:'합계 숨김'));
          right.append(h('label',{class:'toggle',style:'margin-top:8px'},
            h('input',{type:'checkbox',...(showTotal?{checked:''}:{}),onchange:e=>{showTotal=e.target.checked;drawCart();}}),'합계 보이기 (치료사 설정)'));
          right.append(h('button',{class:'big-btn b-pri',style:'width:100%;margin-top:10px',disabled:!ks.length,onclick:checkout},'계산하기'));
        }
        function redraw(){drawGoods();drawCart();}
        function checkout(){
          const sum=total(); const items=Object.keys(cart).map(k=>G.find(g=>g.id===k));
          const bad=items.filter(g=>g.bad);
          const dup=items.filter(g=>c.home.includes(g.id));
          const have=[...new Set(items.concat(c.home.map(id=>G.find(g=>g.id===id))))];
          const cnt=cat=>have.filter(g=>g.cat===cat&&!g.bad).length;
          const r={sum,showTotal,budgetOk:sum<=c.budget,bad:bad.map(g=>g.name),dup:dup.map(g=>g.name),pro:cnt('단백질'),veg:cnt('채소'),grain:cnt('곡류'),
            list:Object.entries(cart).map(([k,q])=>G.find(g=>g.id===k).name+(q>1?`×${q}`:''))};
          r.compOk=r.pro>=c.need.pro&&r.veg>=c.need.veg&&r.grain>=c.need.grain;
          d.rounds.push(r);
          out.innerHTML='';
          const lines=[
            r.budgetOk?`<span class="okc">합계 ${won(sum)} — 예산 안에서 샀습니다.</span>`:`<span class="badc">합계 ${won(sum)} — 예산을 ${won(sum-c.budget)} 넘었습니다.</span>`,
            r.bad.length?`<span class="badc">저염·저지방 식단에 맞지 않는 상품: ${bad.map(g=>`${g.name}(${g.why})`).join(', ')}</span>`:'<span class="okc">모두 식단에 맞는 상품입니다.</span>',
            r.compOk?'<span class="okc">필요한 재료를 모두 갖췄습니다.</span>':`<span class="badc">재료 구성${c.home.length?'(집에 있는 재료 포함)':''}: 단백질 ${r.pro}가지(${c.need.pro} 이상), 채소 ${r.veg}가지(${c.need.veg} 이상), 곡류 ${r.grain}가지(${c.need.grain} 이상)</span>`,
          ];
          if(c.home.length) lines.push(r.dup.length?`<span class="badc">집에 이미 있는 재료를 샀습니다: ${r.dup.join(', ')}</span>`:'<span class="okc">집에 있는 재료는 사지 않았습니다.</span>');
          const allOk=r.budgetOk&&!r.bad.length&&r.compOk&&!r.dup.length;
          out.append(fbBox(allOk?'ok':'bad',allOk?'장보기를 잘 마쳤습니다.':'다시 살펴볼 부분이 있습니다.',lines));
          if(!allOk) out.append(h('button',{class:'big-btn b-sec',style:'margin-top:8px',onclick:()=>{out.innerHTML='';out.scrollIntoView({block:'nearest'});}},'장바구니 다시 고르기'));
          done();
          out.scrollIntoView({behavior:'smooth',block:'center'});
        }
        redraw(); body.append(h('div',{class:'shop'},left,right),out);
      }},
  ],
  questions:['건강에 좋은 식품을 어떤 기준으로 골랐나요?','마트에서 시간을 아끼려면 어떤 순서로 돌면 좋을까요?','예산이 부족하면 무엇을 빼거나 바꾸겠어요?'],
  summarize(d,c){
    const f=d.rounds?.[0], l=d.rounds?.[d.rounds.length-1];
    if(!f) return [{label:'장보기',ok:false,detail:'계산하지 않음'}];
    return [
      {label:'예산 안에서 구매 (첫 계산)',ok:f.budgetOk,detail:`합계 ${won(f.sum)} / 예산 ${won(c.budget)} — 합계 ${f.showTotal?'보임':'숨김'}`},
      {label:'저염·저지방 원칙',ok:!f.bad.length,detail:f.bad.length?'부적합: '+f.bad.join(', '):'부적합 상품 없음'},
      {label:'필요 재료 구성',ok:f.compOk,detail:`단백질 ${f.pro}/${c.need.pro}, 채소 ${f.veg}/${c.need.veg}, 곡류 ${f.grain}/${c.need.grain}`},
    ].concat(c.home.length?[{label:'집에 있는 재료 사지 않기',ok:!f.dup.length,detail:f.dup.length?'산 것: '+f.dup.join(', '):'지킴'}]:[],[
      {label:'다시 고른 횟수',ok:null,detail:`${d.rounds.length-1}회`+(d.rounds.length>1?` (최종: ${l.budgetOk&&!l.bad.length&&l.compOk&&!l.dup.length?'모두 충족':'미충족 남음'})`:'')},
      {label:'구매 목록 (첫 계산)',ok:null,detail:f.list.join(', ')},
    ]);
  }
},
// ── 5. 갑작스러운 일정 변경에 대응하기 (돌발대응) ──
{
  id:'change', no:17, title:'갑작스러운 일정 변경에 대응하기', tag:'돌발대응', tagClass:'tag-adapt',
  desc:'새로 온 연락을 읽고 기억해서 이번 주 달력을 고칩니다. 일정과 연락이 매번 바뀝니다.',
  levels:{1:'연락 2개',2:'연락 3개',3:'연락 4개 · 달력을 고칠 필요가 없는 연락도 섞임'},
  init(level){ return changeGen(level); },
  situation(c){ return `<p>오늘은 <b>월요일</b>입니다. 이번 주 계획은 다음과 같습니다.</p><ul>`+c.base.map(b=>`<li>${DAYN[b.day]} ${fmt(b.start)}: ${b.name}</li>`).join('')+`</ul>`; },
  steps:[
    { name:'연락 확인', instr:'', hint:'다음 단계에서는 연락 내용이 가려집니다.',
      render(body,c,d,done,api){ api.setInstr(`방금 연락 ${c.msgs.length}개가 왔습니다. 잘 읽고 기억하세요.`); body.append(msgList(c)); done(); }},
    { name:'달력 고치기', instr:'연락 내용대로 이번 주 달력을 고치세요.', hint:'일정의 ✕ 를 누르면 지울 수 있습니다. 새 일정을 누른 뒤 달력 빈칸을 누르면 그 시각에 들어갑니다.',
      render(body,c,d,done){

// 하루·주간 시간표에 일정 넣기 (항목을 누르고 칸을 누름, 넣은 항목은 ✕ 로 뺌)
function planner(o){
  const st=o.start,en=o.end,items=o.items,fixed=o.fixed||[];
  const pos={}; items.forEach(it=>{if(it.at) pos[it.id]={day:it.at.day,start:it.at.start};});

  const one=(o.cols||DAYS).length===1;
  function draw(){
    wrap.innerHTML='';
    const side=h('div',{class:one?'side':''});

      const rest=items.filter(it=>!pos[it.id]); const p=h('div',{class:'palette'});

      else p.append(h('div',{class:'empty-note'},'모두 넣었습니다.'));

    }
    side.append(msg);
    const cal=calendar({cols:o.cols,colNames:o.colNames,start:st,end:en,pickable:!!sel&&!locked,
      blocks:all().map(b=>({...b,cls:b.fx?('fixed '+(b.cls||'')):(b.cls||'new'),tap:!locked&&!!sel,removable:!locked&&!b.fx})),
      onBlock:locked?null:b=>{
        if(sel){stats.clashes++;msg.innerHTML='';msg.append(fbBox('warn',`그 시간에는 이미 ‘${b.name}’이(가) 있습니다.`,[]));}},
      onRemove:locked?null:b=>{ delete pos[b.id]; msg.innerHTML=''; draw(); },

const THERAPY=['물리치료','작업치료','언어치료','인지치료'];

// 겹치는 의료 약속: 매번 새로 만듦. 같은 날 두 약속 사이 간격이 이동 시간보다 짧으면 문제
const MED_POOL=['신경과 진료','물리치료','작업치료','심장내과 진료','혈액 검사','안과 진료','치과 진료','정형외과 진료','언어치료','재활의학과 진료','피부과 진료','이비인후과 진료'];
const flat1=a=>[].concat.apply([],a);
function conflictGen(level){
  const T=level===3?40:30, nBad=level===1?1:2, nOk=level===3?1:0, nSingle=level===1?2:level===2?1:1;
  for(let tries=0;tries<300;tries++){
    const names=shuffle(MED_POOL), days=shuffle([0,1,2,3,4]); let k=0; const appts=[], pairs=[], badDays=[];
    const take=()=>names[k++];
    const mkPair=(bad)=>{ const day=days.pop(), d1=pick([30,60]), d2=pick([30,60]);
      const gap=bad?(T===40?pick([0,30]):0):pick([60,90]);
      const s1=pick([540,570,600,630,660,780,810,840]), s2=s1+d1+gap;
      if(s2+d2>CAL_END) return false;
      const A={name:take(),day,start:s1,dur:d1}, B={name:take(),day,start:s2,dur:d2};
      appts.push(A,B); if(bad){ pairs.push([A,B]); badDays.push(day); } return true; };
    let ok=true;
    for(let i=0;i<nBad;i++) ok=ok&&mkPair(true);
    for(let i=0;i<nOk;i++) ok=ok&&mkPair(false);
    for(let i=0;i<nSingle&&ok;i++){ const d=pick([30,60]); appts.push({name:take(),day:days.pop(),start:pick([540,600,660,840,900,930]),dur:d}); }
    if(!ok) continue;
    appts.sort((x,y)=>x.day-y.day||x.start-y.start).forEach((a,i)=>a.id='a'+i);
    return {T,appts,pairs:pairs.map(p=>[p[0].id,p[1].id]),badDays};
  }
}

// 일상 루틴: 일과 시각·약속·이동 시간을 매번 새로 만듦. 약속(앞뒤 이동 포함)과 겹치는 일과가 1개 이상 생기게 함
const ROUTINE_APPTS=[['치과 진료',60],['은행 방문',60],['친구 만남',120],['물리치료',60],['미용실',60],['주민센터 서류 발급',60],['마트 장보기',60],['복지관 노래 교실',90],['안과 진료',60]];
function routineGen(level){
  for(let tries=0;tries<400;tries++){
    const wake=pick([390,420]), ln=pick([690,720]), dn=pick([1050,1080]), nap=pick([810,840,870]), bed=pick([1290,1320]);
    let R=[{k:'wake',name:'기상',start:wake,dur:30},{k:'bf',name:level===3?'아침 식사·약':'아침 식사',start:wake+30,dur:60}];
    if(level>=2) R.push({k:'st',name:'가벼운 스트레칭',start:wake+90,dur:30});
    R.push({k:'ln',name:level===3?'점심 식사·약':'점심 식사',start:ln,dur:60});
    if(level>=2) R.push({k:'nap',name:'낮잠',start:nap,dur:30});
    R.push({k:'dn',name:level===3?'저녁 식사·약':'저녁 식사',start:dn,dur:60},{k:'bed',name:'취침 준비',start:bed,dur:30});
    R=R.map((r,i)=>({...r,id:'r'+i}));
    const n=level===1?2:3, pool=shuffle(ROUTINE_APPTS).slice(0,n);
    const A=[]; let ok=true;
    pool.forEach((p,i)=>{ const T=level===3&&i===0?60:30;
      const cand=[]; for(let t=Math.max(R[1].start+60+T,540);t+p[1]+T<=1110;t+=30) cand.push(t);
      const t=pick(cand); if(t==null){ok=false;return;}
      A.push({id:'a'+i,name:p[0],dur:p[1],start:t,T}); });
    if(!ok) continue;
    A.sort((x,y)=>x.start-y.start);
    // 약속끼리(이동 포함) 겹치지 않게
    let clash=false; for(let i=1;i<A.length;i++) if(A[i-1].start+A[i-1].dur+A[i-1].T>A[i].start-A[i].T) clash=true;
    if(clash) continue;
    // 약속(이동 포함)과 겹치는 일과 수
    const hit=R.filter(r=>A.some(a=>r.start<a.start+a.dur+a.T&&a.start-a.T<r.start+r.dur)).length;
    if(hit<(level===1?1:2)||R.some(r=>(r.k==='wake'||r.k==='bed')&&A.some(a=>r.start<a.start+a.dur+a.T&&a.start-a.T<r.start+r.dur))) continue;
    // 식사는 정해진 시간대 안에 1시간 빈 시간이 있어야 함 (풀 수 없는 문제 방지)
    const busy=(t,d)=>A.some(a=>t<a.start+a.dur+a.T&&a.start-a.T<t+d);
    const win={bf:[R[1].start,600],ln:[660,840],dn:[1020,1200]};
    if(Object.keys(win).some(k=>{for(let t=win[k][0];t<=win[k][1];t+=30) if(!busy(t,60)) return false; return true;})) continue;
    const mv=[]; A.forEach((a,i)=>{mv.push({id:'m'+i+'a',dur:a.T},{id:'m'+i+'b',dur:a.T});});
    return {day:pick(DAYN),R,A,mv};
  }
}
// 가족 행사: 행사 종류·시각·이동 시간·개인 일정을 매번 새로 만듦
function weddingGen(level){
  const T=level===3?90:60;
  for(let tries=0;tries<300;tries++){
    const ev={name:pick(['가족 결혼식','조카 돌잔치','부모님 칠순 잔치']),start:pick(level===3?[780,840]:[660,720,780]),dur:pick([120,180])};
    const fx=[{id:'f0',name:pick(['정기 물리치료','작업치료','교회 예배']),start:pick(level===3?[480,510]:[540,570]),dur:60}];
    if(level===3) fx.push({id:'f1',name:pick(['배우자 병원 동행','손주 어린이집 데려다주기','택배 받기']),start:fx[0].start+90,dur:30});
    // 출발해야 하는 시각보다 앞 일정이 끝나야 함 (준비 1시간 포함)
    const lastEnd=Math.max.apply(null,fx.map(f=>f.start+f.dur));
    if(lastEnd+60>ev.start-T) continue;
    const c={level,ev,fx,T};
    if(level>=2){ c.med=ev.start+pick([60,90]); const home=ev.start+ev.dur+T; c.dinner=home-pick([0,30]); }
    return c;
  }
}

// 가족 약속: 매번 새로 만듦. 내 약속 중 1개 이상은 배우자 일정과 겹쳐서 배우자가 태워 줄 수 없게 함
function familyGen(level){
  const ME=['물리치료','작업치료','언어치료','의사 진료','치과 진료','안과 진료','복지관 수업'], SP=['건강검진','치과 진료','동창 모임','은행 업무','골프 모임'], CH=['회식','운동 모임','친구 결혼식','영어 학원'];
  for(let t=0;t<400;t++){
    const nMe=level===1?2:3, A=[];
    shuffle(ME).slice(0,nMe).forEach((n,i)=>A.push({id:'m'+i,who:'나',name:n,day:pick([0,1,2,3,4]),start:pick([540,600,660,840,900]),dur:60}));
    shuffle(SP).slice(0,2).forEach((n,i)=>A.push({id:'s'+i,who:'배우자',name:n,day:pick([0,1,2,3,4]),start:pick([540,600,660,780,840,900]),dur:pick([60,120])}));
    if(level===3){
      // 내 약속 하나를 저녁으로 (자녀가 태워 줄 수 있는 시간)
      A[0].start=pick([1110,1140]);
      shuffle(CH).slice(0,2).forEach((n,i)=>A.push({id:'c'+i,who:'자녀',name:n,day:pick([0,1,2,3,4]),start:pick([1110,1140,1170]),dur:60}));
    }
    const c={level,A}; const mine=A.filter(a=>a.who==='나');
    if(mine.some(a=>A.some(b=>b!==a&&b.who==='나'&&a.day===b.day))) continue;
    const av=mine.map(a=>familyAvail(c,a));
    if(!av.some(x=>!x.sp)||!av.some(x=>x.sp)) continue;              // 배우자가 되는 날과 안 되는 날이 섞이게
    if(level===3&&!av.some(x=>x.ch)) continue;                        // 자녀가 태워 줄 수 있는 약속 1개 이상
    if(A.some(a=>a.start+a.dur>(level===3?1200:1080))) continue;
    return c;
  }
}
// 그 약속(앞뒤 이동 30분 포함)에 배우자·자녀가 차를 쓸 수 있는지
function familyAvail(c,a){
  const s=a.start-30, e=a.start+a.dur+30;
  const busy=w=>c.A.some(b=>b.who===w&&b.day===a.day&&b.start<e&&s<b.start+b.dur);
  const work=a.day<=4&&s<1080&&e>540;
  return {sp:!busy('배우자'),ch:!work&&!busy('자녀')};
}

// 갑작스러운 일정 변경: 기존 일정과 연락을 매번 새로 만듦
function changeGen(level){
  const BASE=['물리치료','친구와 차 마시기','정기 검진','미용실','은행 업무','작업치료','복지관 수업','치과 진료'];
  for(let t=0;t<400;t++){
    const names=shuffle(BASE).slice(0,4), days=[1,2,3,4];
    const base=names.map((n,i)=>({id:'b'+i,name:n,day:days[i],start:pick([540,600,660,840,900]),dur:60}));
    const busy=(day,s,d,ign)=>base.concat(extra).some(b=>b!==ign&&b.day===day&&b.start<s+d&&s<b.start+b.dur);
    const extra=[], msgs=[], news=[], checks=[], affected=new Set();
    // 1) 취소 후 다른 날로 바꿈 (또는 어려움에서 같은 날 시간만 바뀜)
    const X=pick(base); affected.add(X.id);
    const timeOnly=level===3&&Math.random()<.5;
    let nd=timeOnly?X.day:pick([1,2,3,4].filter(d=>d!==X.day)), ns=pick([540,600,660,780,840,900].filter(s=>s!==X.start));
    if(busy(nd,ns,60,X)) continue;
    const nX={id:'n_x',name:X.name,dur:60}; news.push(nX); extra.push({day:nd,start:ns,dur:60});
    msgs.push([X.name.indexOf('치료')>=0||X.name.indexOf('검진')>=0||X.name.indexOf('진료')>=0?'병원':'담당자',
      timeOnly?`${DAYN[X.day]} ${X.name} 시간이 ${fmt(X.start)}에서 ${fmt(ns)}로 바뀌었습니다.`:`${DAYN[X.day]} ${X.name}이(가) 취소되었습니다. ${DAYN[nd]} ${fmt(ns)}로 바꿔 드렸습니다.`]);
    checks.push({label:`${DAYN[X.day]} ${fmt(X.start)} ${X.name} 지우기`,test:B=>!B.some(b=>b.id===X.id)});
    checks.push({label:`${X.name}을(를) ${DAYN[nd]} ${fmt(ns)}에 넣기`,test:B=>B.some(b=>b.id==='n_x'&&b.day===nd&&b.start===ns)});
    // 2) 새 방문 일정 (정해진 시각)
    const vd=pick([1,2,3,4]), vs=pick([540,600,660,840,900]);
    if(busy(vd,vs,60)) continue;
    const who=pick([['수도 수리공','수리공 방문'],['가스 점검원','가스 점검'],['택배 기사','택배 받기']]);
    news.push({id:'n_v',name:who[1],dur:60}); extra.push({day:vd,start:vs,dur:60});
    msgs.push([who[0],`${DAYN[vd]} ${fmt(vs)}에 방문하겠습니다.`]);
    checks.push({label:`${who[1]}을(를) ${DAYN[vd]} ${fmt(vs)}에 넣기`,test:B=>B.some(b=>b.id==='n_v'&&b.day===vd&&b.start===vs)});
    // 3) 시간이 정해지지 않은 부탁 (오전/오후)
    if(level>=2){
      const hd=pick([1,2,3,4]), am=Math.random()<.5;
      const free=[];for(let s=am?540:780;s+120<=(am?720:1020);s+=30) if(!busy(hd,s,120)) free.push(s);
      if(!free.length) continue;
      news.push({id:'n_h',name:'자녀 도움',dur:120}); extra.push({day:hd,start:free[0],dur:120});
      msgs.push(['자녀',`${DAYN[hd]} ${am?'오전':'오후'}에 2시간 정도 도와주셨으면 해요.`]);
      checks.push({label:`자녀 도움을 ${DAYN[hd]} ${am?'오전':'오후'}에 넣기`,test:B=>{const h2=B.find(b=>b.id==='n_h');return !!h2&&h2.day===hd&&(am?h2.start<720:h2.start>=720);}});
    }
    // 4) 고칠 필요 없는 연락 (어려움)
    if(level===3) msgs.push(pick([['아파트 관리실','다음 달 3일에 반상회가 있습니다. 참고해 주세요.'],['약국','처방받은 약이 준비되었습니다. 편하실 때 오세요.'],['친구','지난주 사진 보내 줄게요. 잘 지내요!']]));
    checks.push({label:'바뀌지 않은 일정은 그대로 둠',test:B=>base.filter(b=>!affected.has(b.id)).every(b=>B.some(x=>x.id===b.id&&x.day===b.day&&x.start===b.start))});
    return {base,msgs:shuffle(msgs),news,checks};
  }
}
function msgList(c){
  return h('div',{class:'msgs'},c.msgs.map(m=>h('div',{class:'msg'},h('div',{class:'from'},m[0]),m[1])));
}

// 한 주의 약속: 매번 새로 만듦
// 쉬움 3개 / 보통 5개 (이동·준비 모두 30분) / 어려움 6개 (장소마다 이동 시간이 다르고, 준비 1시간짜리 약속 1개)
// 같은 요일 두 약속: 여유 있음(fit) 또는 준비·이동까지 넣으면 겹침(clash). 모든 시각은 30분 단위.
const WEEK_POOL=[
  {name:'물리치료',dur:[60],from:540,to:960,th:1,place:'병원'},{name:'작업치료',dur:[60],from:540,to:960,th:1,place:'병원'},
  {name:'언어치료',dur:[60],from:540,to:960,th:1,place:'병원'},{name:'인지치료',dur:[60],from:540,to:960,th:1,place:'병원'},
  {name:'정기 건강검진',dur:[90,120],from:540,to:840,place:'검진센터'},{name:'친구와 점심 약속',dur:[90],from:660,to:720,place:'식당'},
  {name:'은행 업무',dur:[60],from:570,to:900,place:'은행'},{name:'치과 진료',dur:[60],from:570,to:960,place:'치과'},
  {name:'미용실',dur:[60,90],from:600,to:900,place:'미용실'},{name:'주민센터 서류 발급',dur:[60],from:570,to:900,place:'주민센터'},
  {name:'안과 진료',dur:[60],from:570,to:900,place:'안과'},{name:'복지관 노래 교실',dur:[90,120],from:600,to:840,place:'복지관'},
  {name:'자녀와 장보기',dur:[90,120],from:600,to:900,place:'마트'}];
const PREP_LONG={'정기 건강검진':'검진 서류와 복용 약 목록 챙기기','은행 업무':'통장·신분증·서류 챙기기','주민센터 서류 발급':'신분증·신청서 챙기기','치과 진료':'양치하고 진료 기록 챙기기'};
function weekGen(level){
  const n=level===1?3:level===2?5:6;
  for(let tries=0;tries<500;tries++){
    const th=shuffle(WEEK_POOL.filter(x=>x.th)).slice(0,level===1?1:pick([1,2]));
    const items=shuffle(th.concat(shuffle(WEEK_POOL.filter(x=>!x.th)).slice(0,n-th.length)));
    // 이동·준비 시간
    items.forEach(it=>{it._trav=level===3?pick([20,30,40,60]):30; it._prep=30; it._why='';});
    if(level===3){ const L=items.filter(it=>PREP_LONG[it.name]); if(!L.length) continue; const x=pick(L); x._prep=60; x._why=PREP_LONG[x.name]; }
    const type=level===3?pick(['fit','clash']):level===1?pick(['spread','clash']):pick(['spread','fit','clash']);
    if(type==='spread'&&n>5) continue;
    const slot=it=>{const d=pick(it.dur),c=[];
      for(let t=Math.max(it.from,Math.ceil((420+it._trav+it._prep)/30)*30);t<=it.to;t+=30) if(t+d<=1050&&t+d+it._trav<=1140) c.push(t);
      return c.length?{dur:d,start:pick(c)}:null;};
    const mk=(it,day,s)=>({name:it.name,day,...s,trav:it._trav,prep:it._prep,why:it._why});
    let appts=[], ok=true;
    if(type==='spread'){
      const days=shuffle([0,1,2,3,4]);
      items.forEach((it,i)=>{const s=slot(it); if(!s) ok=false; else appts.push(mk(it,days[i],s));});
    }else{
      const days=shuffle([0,1,2,3,4]), dbl=days[0];
      const [i1,i2]=items, s1=slot(i1); if(!s1) continue;
      const home1=s1.start+s1.dur+i1._trav, lead2=i2._trav+i2._prep, d2=pick(i2.dur);
      const st2=type==='clash'?home1-pick([30,60])+lead2:home1+pick([0,30,60])+lead2;
      if(st2%30||st2<s1.start+s1.dur+30||st2+d2>1050||st2<i2.from||st2>i2.to+60) continue;
      appts.push(mk(i1,dbl,s1),mk(i2,dbl,{dur:d2,start:st2}));
      items.slice(2).forEach((it,i)=>{const s=slot(it); if(!s) ok=false; else appts.push(mk(it,days[i+1],s));});
    }
    if(!ok||appts.length!==n) continue;
    appts.sort((x,y)=>x.day-y.day||x.start-y.start).forEach((a,i)=>a.id='abcdef'[i]);
    return {appts,conflict:type==='clash'};
  }
  return {appts:[{id:'a',day:0,start:600,dur:60,name:'물리치료',trav:30,prep:30,why:''},{id:'b',day:1,start:840,dur:120,name:'정기 건강검진',trav:30,prep:30,why:''},{id:'c',day:2,start:660,dur:90,name:'친구와 점심 약속',trav:30,prep:30,why:''}],conflict:false};
}
const prepAt=a=>a.start-a.trav-a.prep, homeAt=a=>a.start+a.dur+a.trav;
function weekConflictLines(c){
  const byDay={}; c.appts.forEach(a=>(byDay[a.day]=byDay[a.day]||[]).push(a));
  const dbl=Object.values(byDay).filter(x=>x.length>1);
  if(!dbl.length) return ['약속이 모두 다른 요일에 있어 겹치지 않습니다.'];
  return dbl.map(([x,y])=>{const home=homeAt(x), prep=prepAt(y);
    return `${DAYN[x.day]}: ${x.name}에서 집 도착 <b>${fmt(home)}</b>, ${y.name} 준비 시작 <b>${fmt(prep)}</b> → `+
      (prep<home?`<span class="badc">겹칩니다.</span> 시간을 바꾸거나 다른 날로 옮겨야 합니다.`:`<span class="okc">겹치지 않습니다.</span>`+(prep===home?' (여유 시간은 없습니다.)':` (${durTxt(prep-home)} 여유)`));});
}

// ── 4. 한 주의 약속 관리하기 ─────────────────
{

    if(c.level===3) return `<p>다음 주에 여러 중요한 약속이 있습니다.</p><ul>`+c.appts.map(a=>`<li>${DAYN[a.day]} ${fmt(a.start)}: <b>${a.name}</b> (${durTxt(a.dur)}) — 가는 데 <b>${a.trav}분</b>`+(a.prep>30?`, 준비 <b>${durTxt(a.prep)}</b> (${a.why})`:'')+`</li>`).join('')+
      `</ul><p>준비 시간은 따로 적힌 것이 없으면 <b>30분</b>입니다. 집에 돌아오는 시간은 가는 시간과 같습니다.</p>`;
    return `<p>다음 주에 여러 중요한 약속이 있습니다.</p><ul>`+c.appts.map(a=>`<li>${DAYN[a.day]} ${fmt(a.start)}: ${a.name} (${durTxt(a.dur)})</li>`).join('')+
    `</ul><p>각 장소까지는 평균 <b>30분</b>이 걸리며, 집에 돌아오는 시간도 같습니다. 약속 준비에는 <b>30분</b>이 필요합니다.</p>`; },
  steps:[
    { name:'달력에 옮기기', instr:'모든 약속을 요일별로 달력에 정리하세요.', hint:'약속을 누른 뒤 달력 칸을 누르면 그 시각에 들어갑니다. 넣은 약속은 오른쪽 위 ✕ 를 누르면 빠집니다.',
      render(body,c,d,done){
        const pl=planner({start:480,end:1080,items:c.appts.map(a=>({id:a.id,name:a.name,dur:a.dur}))});
        body.append(pl.el,checker('달력 확인',{d,key:'cal',done,lock:pl.lock,unlock:pl.unlock,evaluate(){
          if(!pl.placedAll(c.appts.map(a=>a.id))) return {incomplete:'아직 넣지 않은 약속이 있습니다.'};
          return critResult(c.appts.map(a=>{const p=pl.pos(a.id);return crit(`${a.name}: ${DAYN[a.day]} ${fmt(a.start)}`,p.day===a.day&&p.start===a.start);}));
        }}));
      }},
    { name:'시각 계산하기', instr:'준비와 이동 시간을 포함해서 각 약속의 시각을 고르세요.', hint:'',
      render(body,c,d,done,api){
        document.getElementById('a-hint').textContent=c.level===3
          ?'준비 시작 = 약속 시각 − (준비 시간 + 가는 시간) / 집 도착 = 끝나는 시각 + 오는 시간 — 약속마다 다릅니다.'
          :'준비 시작 = 약속 시각에서 (준비 30분 + 가는 길 30분) 전 / 집 도착 = 약속이 끝나고 오는 길 30분 뒤';
        d.tm={}; let locked=false; const box=h('div',{class:'tcards'});
        const opt={};
        c.appts.forEach(a=>{const e=a.start+a.dur, p=prepAt(a), r=homeAt(a);
          opt['p'+a.id]=shufOpts(p,[a.start-60,a.start-a.trav,a.start-a.prep,p-30,p+30,a.start]);
          opt['r'+a.id]=shufOpts(r,[e,e+30,r+30,r-10,e+60]);});
        function draw(){ box.innerHTML='';
          c.appts.forEach(a=>{
            const row=(k,label)=>h('div',{class:'tc-row'},h('span',{class:'k'},label),
              seg(opt[k],v=>{if(locked)return;d.tm[k]=v;draw();},d.tm[k],fmt));
            box.append(h('div',{class:'tcard'+(d.tm['p'+a.id]!=null&&d.tm['r'+a.id]!=null?' done':'')},
              h('div',{class:'tc-h'},h('span',{class:'dy'},DAYN[a.day]),h('span',{class:'nm'},a.name),
                h('span',{class:'at'},rangeTxt(a.start,a.start+a.dur)+(c.level===3?` · 이동 ${a.trav}분 · 준비 ${a.prep}분`:''))),
              row('p'+a.id,'준비 시작'),row('r'+a.id,'집 도착')));
          });
        }
        draw();
        const all=()=>c.appts.every(a=>d.tm['p'+a.id]!=null&&d.tm['r'+a.id]!=null);
        body.append(box,checker('계산 확인',{d,key:'calc',done,lock(){locked=true;box.classList.add('locked');},unlock(){locked=false;box.classList.remove('locked');},evaluate(){
          if(!all()) return {incomplete:'아직 고르지 않은 칸이 있습니다.'};
          return critResult(c.appts.flatMap(a=>[crit(`${a.name} 준비 시작 ${fmt(prepAt(a))}`,d.tm['p'+a.id]===prepAt(a)),crit(`${a.name} 집 도착 ${fmt(homeAt(a))}`,d.tm['r'+a.id]===homeAt(a))]));
        }}));
      }},
    { name:'충돌 확인', instr:'준비·이동 시간까지 포함하면 겹치는 약속이 있나요?', hint:'같은 날 약속이 있다면, 앞 약속에서 집에 도착하는 시각과 다음 약속 준비를 시작하는 시각을 비교해 보세요.',
      render(body,c,d,done){ d.cf={}; const r=rowsAsk([{key:'q',label:'겹치는 약속이 있나요?',options:['있다','없다']}],d.cf);
        body.append(r.el,checker('확인',{d,key:'conf',done,lock:r.lock,evaluate(){
          if(!r.all()) return {incomplete:'답을 골라 주세요.'};
          const ok=(d.cf.q==='있다')===!!c.conflict;
          return {ok,title:ok?(c.conflict?'맞습니다. 겹치는 약속이 있습니다.':'맞습니다. 겹치는 약속이 없습니다.'):'다시 살펴보세요.',lines:weekConflictLines(c)};
        }})); }},
  ],
  questions:['가장 바쁜 날은 언제이며, 에너지 관리를 어떻게 할 계획인가요?','약속 전후로 휴식 시간을 어떻게 배치했나요?','갑작스러운 컨디션 저하에 대비한 계획은 무엇인가요?'],
  summarize(d,c){ return [{label:'이번 약속',ok:null,detail:c.appts.map(a=>`${DAYS[a.day]} ${fmt(a.start)} ${a.name}`+(c.level===3?` (이동 ${a.trav}·준비 ${a.prep}분)`:'')).join(', ')}]
    .concat(sumCheck(d,'cal','달력 옮기기'),sumCheck(d,'calc','시각 계산'),
      [{label:'겹침 여부 판단 (첫 답)',ok:!!d.confFirst?.ok,detail:`답 ${d.cf?.q||'-'} / 정답 ${c.conflict?'있다':'없다'}`}]); }
},
// ── 6. 복잡한 투약 일정 관리하기 ──────────────
{
  id:'meds', no:6, title:'복잡한 투약 일정 관리하기', tag:'건강관리', tagClass:'tag-health',
  desc:'처방된 약의 복용 규칙에 맞게 하루 투약표를 만들고 복약 관리 방법을 고릅니다. 식사 시각과 약이 매번 바뀝니다.',
  levels:{1:'약 2가지',2:'약 4가지 (식전·식후·식사와 함께)',3:'약 5가지 (공복 약 포함) · 진통제 간격 6시간'},
  init(level){
    const bf=pick([450,480,510]), ln=pick([720,750]), dn=pick([1050,1080]), bed=1320;
    const ALL={
      bp:{name:'혈압약',rule:level===1?'하루 1회 (아침 식사 30분 전)':'하루 2회 (아침·저녁 식사 30분 전)',times:level===1?[bf-30]:[bf-30,dn-30],txt:'식사 30분 전'},
      gl:{name:'혈당 조절제',rule:'하루 3회 (매 식사 직후)',times:[bf+30,ln+30,dn+30],txt:'식사 직후'},
      ac:{name:'항응고제',rule:'하루 1회 (저녁 식사 후, 잠들기 전까지)',range:[dn+30,bed-30],txt:'저녁 식사 후'},
      vt:{name:'비타민',rule:'하루 1회 (아침 식사와 함께)',times:[bf],txt:'아침 식사와 함께'},
      th:{name:'갑상선약',rule:'하루 1회 (아침 공복, 식사 1시간 전)',times:[bf-60],txt:'아침 식사 1시간 전'},
    };
    const ids=level===1?['bp','vt']:level===2?['bp','gl','ac','vt']:['th','bp','gl','ac','vt'];
    const MEDS=ids.map(id=>({id,...ALL[id],n:ALL[id].times?ALL[id].times.length:1}));
    const painAt=pick([540,600,660]), gap=level===3?6:4;
    return {bf,ln,dn,bed,MEDS,painAt,gap};
  },
  situation(c){ return `<p>의사가 다음과 같은 약을 처방했습니다.</p><ul>`+c.MEDS.map(m=>`<li>${m.name}: ${m.rule}</li>`).join('')+
    `<li>진통제: 필요할 때만 (통증 있을 때, 최소 ${c.gap}시간 간격)</li></ul>
    <p>식사 시간: 아침 <b>${fmt(c.bf)}</b>, 점심 <b>${fmt(c.ln)}</b>, 저녁 <b>${fmt(c.dn)}</b> (각 30분) / 취침: <b>${fmt(c.bed)}</b></p>`; },
  steps:[
    { name:'투약표 만들기', instr:'오전 6시부터 취침 전까지 하루 투약표를 만드세요.', hint:'약을 누른 뒤 시간 줄을 누르면 그 시각에 들어갑니다. 넣은 약의 ✕ 를 누르면 빠집니다. 진통제는 필요할 때만 먹으므로 넣지 않습니다.',
      render(body,c,d,done){
        const MEDS=c.MEDS;
        const MEAL={}; MEAL[c.bf]='아침 식사'; MEAL[c.ln]='점심 식사'; MEAL[c.dn]='저녁 식사'; MEAL[c.bed]='취침';
        let placed=[],sel=null,locked=false; const box=h('div');
        const left=id=>MEDS.find(m=>m.id===id).n-placed.filter(p=>p.id===id).length;
        function draw(){
          box.innerHTML='';
          if(!locked){const p=h('div',{class:'palette'});
            MEDS.forEach(m=>{const n=left(m.id); if(n>0) p.append(h('button',{class:'chip'+(sel===m.id?' sel':''),onclick:()=>{sel=sel===m.id?null:m.id;draw();}},`${m.name} (${n}번 남음)`));});
            if(!p.childNodes.length) p.append(h('div',{class:'empty-note'},'모두 넣었습니다.'));
            box.append(h('div',{class:'lbl'},'넣을 약'),p);}
          const tl=h('div',{class:'mtl'});
          for(let t=360;t<=c.bed;t+=30){
            const row=h('div',{class:'mtr'+(MEAL[t]?' meal':'')+(sel&&!locked?' pick':''),onclick:()=>{if(locked||!sel||t>=c.bed)return;placed.push({id:sel,t});if(left(sel)<=0)sel=null;draw();}},
              h('span',{class:'tm'},fmt(t)),h('span',{class:'ml'},MEAL[t]||''));
            placed.filter(p=>p.t===t).forEach(p=>row.append(h('button',{class:'pill',onclick:e=>{e.stopPropagation();if(locked)return;placed=placed.filter(x=>x!==p);draw();}},MEDS.find(m=>m.id===p.id).name,locked?null:h('span',{class:'px','aria-hidden':'true'},'✕'))));
            tl.append(row);
          }
          box.append(tl);
        }
        draw();
        body.append(box,checker('투약표 확인',{d,key:'mt',done,lock(){locked=true;sel=null;draw();},unlock(){locked=false;draw();},evaluate(){
          if(MEDS.some(m=>left(m.id)>0)) return {incomplete:'아직 넣지 않은 약이 있습니다.'};
          const T=id=>placed.filter(p=>p.id===id).map(p=>p.t).sort((a,b)=>a-b);
          d.mtTxt=MEDS.map(m=>`${m.name} ${T(m.id).map(fmt).join('·')}`).join(', ');
          return critResult(MEDS.map(m=>{
            if(m.range){const t=T(m.id)[0];return crit(`${m.name}: ${m.txt} (${fmt(m.range[0])} ~ ${fmt(m.range[1])})`,t>=m.range[0]&&t<=m.range[1]);}
            return crit(`${m.name}: ${m.times.map(fmt).join(', ')} (${m.txt})`,T(m.id).join()===m.times.slice().sort((a,b)=>a-b).join());}));
        }}));
      }},
    { name:'진통제 간격', instr:'', hint:'버튼으로 시각을 맞춘 뒤 확인을 누르세요.',
      render(body,c,d,done,api){ api.setInstr(`${fmt(c.painAt)}에 진통제를 먹었습니다. 다음 진통제는 몇 시부터 먹을 수 있나요?`);
        const cp=clockPicker(c.painAt), ans=c.painAt+c.gap*60;
        body.append(cp.el,checker('확인',{d,key:'pain',done,lock:cp.lock,unlock:cp.unlock,evaluate(){
          const t=cp.get(); d.painAns=t; const ok=t===ans;
          return {ok,title:ok?'맞습니다.':`${fmt(t)}는 맞지 않습니다.`,lines:[`최소 ${c.gap}시간 간격이므로 ${fmt(c.painAt)} + ${c.gap}시간 = <b>${fmt(ans)}</b>부터 먹을 수 있습니다.`]};
        }})); }},
    { name:'잊지 않는 방법', instr:'약을 잊지 않고 먹기 위한 방법을 3가지 고르세요.', hint:'',
      render(body,c,d,done){
        const OPT=['휴대폰 알람 맞추기','요일별·시간별 약통 쓰기','복약 달력에 표시하기','가족에게 알려 달라고 부탁하기','생각날 때 먹기','따로 준비하지 않고 기억하기'], BAD=[4,5];
        const mp=multiPick(OPT);
        body.append(mp.el,checker('확인',{d,key:'remind',done,lock:mp.lock,unlock:mp.unlock,evaluate(){
          const s=[...mp.get()]; if(s.length!==3) return {incomplete:`3가지를 골라 주세요. (지금 ${s.length}가지)`};
          d.remindTxt=s.map(i=>OPT[i]).join(', '); const bad=s.filter(i=>BAD.includes(i));
          return {ok:!bad.length,title:bad.length?'다시 생각해 볼 방법이 있습니다.':'좋은 방법들입니다.',lines:bad.map(i=>`<span class="badc">${OPT[i]}</span>: 잊기 쉬워 믿을 만한 방법이 아닙니다.`)};
        }})); }},
    { name:'외출할 때', instr:'외출할 때 약 관리 방법으로 알맞은 것을 모두 고르세요.', hint:'',
      render(body,c,d,done){
        const OPT=['외출 시간 동안 먹을 약만 작은 약통에 챙긴다','처방전이나 약 목록을 가지고 다닌다','외출 중에도 휴대폰 알람을 켜 둔다','외출하는 날은 약을 건너뛴다','집에 와서 한꺼번에 먹는다'], GOOD=[0,1,2];
        const mp=multiPick(OPT);
        body.append(mp.el,checker('확인',{d,key:'out',done,lock:mp.lock,unlock:mp.unlock,evaluate(){
          const s=mp.get(); if(!s.size) return {incomplete:'하나 이상 골라 주세요.'};
          return critResult(OPT.map((o,i)=>crit(`${o} → ${GOOD.includes(i)?'알맞음':'알맞지 않음'}`,s.has(i)===GOOD.includes(i))));
        }})); }},
  ],
  questions:['여러 약을 동시에 복용해야 할 때 어떻게 구분할 계획인가요?','약 복용을 잊었을 때 어떻게 대처할 계획인가요?','약 복용 일정을 가족에게 어떻게 설명할 수 있을까요?'],
  summarize(d,c){ return sumCheck(d,'mt','투약표').concat([{label:'투약표 내용',ok:null,detail:d.mtTxt||'-'},
    {label:'진통제 다음 복용 시각 (첫 답)',ok:!!d.painFirst?.ok,detail:d.painAns!=null?`${fmt(d.painAns)} / 정답 ${fmt(c.painAt+c.gap*60)}`:'-'},
    {label:'잊지 않는 방법 (첫 시도)',ok:!!d.remindFirst?.ok,detail:d.remindTxt||'-'},
    {label:'외출 시 약 관리 (첫 시도)',ok:!!d.outFirst?.ok,detail:''}]); }
},
// ── 7. 월간 생활비 계획하기 ──────────────────
{
  id:'money', no:7, title:'월간 생활비 계획하기', tag:'예산관리', tagClass:'tag-budget',
  desc:'남은 생활비를 계산하고, 조건에 맞게 항목별로 나눈 뒤 한 주 식비를 계산합니다.',
  levels:{1:'나눌 항목 3개 · 남은 돈 실시간 표시',2:'나눌 항목 5개 · 남은 돈 실시간 표시',3:'고정 지출 3가지를 직접 더해서 계산 · 항목 5개 · 남은 돈 표시 끔'},
  init(level){
    if(level===1){ const m=pick([1000000,1200000]),f=pick([500000,600000]); return {m,f,rem:m-f,cats:['식비','의료비','비상금'],showRem:true}; }
    if(level===2){ const m=pick([1200000,1500000,1800000]),f=pick([600000,700000,800000]); return {m,f,rem:m-f,cats:['식비','의료비','교통비','여가 활동비','비상금'],showRem:true}; }

    const m=pick([1500000,1800000]), f=fx.reduce((s,x)=>s+x[1],0);

  },
  situation(c){ return `<p>이번 달 생활비로 <b>${won(c.m)}</b>이 있습니다. `+
    (c.fx?`고정 지출은 ${c.fx.map(([k,v])=>`${k} <b>${won(v)}</b>`).join(', ')}입니다.</p>`:`고정 지출(월세, 공과금, 통신비 등)은 <b>${won(c.f)}</b>입니다.</p>`)+`
    <p>나머지 금액을 나눌 때 지켜야 할 조건:</p><ul class="conds">
    <li>식비와 의료비(병원비·약값)는 꼭 넣습니다.</li>
    <li>예상치 못한 지출에 대비해 <b>비상금</b>도 정해 둡니다.</li>
    <li>나눈 금액을 모두 더하면 남은 금액과 <b>정확히 같아야</b> 합니다.</li></ul>`; },
  steps:[
    { name:'남은 금액 계산', instr:'고정 지출을 빼고 남은 금액은 얼마인가요?', hint:'숫자를 눌러 입력하세요.',
      render(body,c,d,done){ const np=numPad('원');
        body.append(np.el,checker('확인',{d,key:'rem',done,lock:np.lock,unlock:np.unlock,evaluate(){
          const v=np.get(); if(!v) return {incomplete:'금액을 입력해 주세요.'}; d.remAns=v; const ok=v===c.rem;
          return {ok,title:ok?'맞습니다.':`${won(v)}은(는) 맞지 않습니다.`,lines:(c.fx?[`고정 지출 ${c.fx.map(x=>won(x[1])).join(' + ')} = ${won(c.f)}`]:[]).concat([`${won(c.m)} − ${won(c.f)} = <b>${won(c.rem)}</b>`])};
        }})); }},
    { name:'항목별 배분', instr:'', hint:'위의 조건을 모두 지키도록 버튼으로 금액을 조절하세요.',
      render(body,c,d,done,api){

          h('input',{type:'checkbox',...(d.showRem?{checked:''}:{}),onchange:e=>{d.showRem=e.target.checked;drawTot();}}),'남은 돈 실시간 보이기 (치료사 설정)');
        function drawTot(){ const t=v.reduce((a,b)=>a+b,0);
          tot.textContent=d.showRem?`나눈 금액 합계 ${won(t)} / 남은 돈 ${won(c.rem-t)}`:'합계는 [배분 확인]을 누르면 볼 수 있습니다.';
          tot.style.color=d.showRem&&c.rem-t<0?'var(--bad)':''; }
        function draw(){ box.innerHTML='';
          CAT.forEach((k,i)=>box.append(h('div',{class:'est-row'},h('span',{class:'nm'},k),h('div',{class:'qty'},
            ...[-50000,-10000].map(s=>h('button',{class:'qb',onclick:()=>{if(locked)return;v[i]=Math.max(0,v[i]+s);draw();}},s===-50000?'−5만':'−1만')),
            h('b',{class:'amt'},won(v[i])),
            ...[10000,50000].map(s=>h('button',{class:'qb',onclick:()=>{if(locked)return;v[i]+=s;draw();}},s===50000?'+5만':'+1만'))))));
          drawTot(); }
        draw();
        body.append(box,tot,sw,checker('배분 확인',{d,key:'alloc',done,lock(){locked=true;box.classList.add('locked');},unlock(){locked=false;box.classList.remove('locked');},evaluate(){
          const t=v.reduce((a,b)=>a+b,0); d.allocV=v.slice(); d.allocTxt=CAT.map((k,i)=>`${k} ${won(v[i])}`).join(', ');
          return critResult([
            crit(`합계 ${won(t)} = 남은 금액 ${won(c.rem)}`+(t===c.rem?'':` (${t>c.rem?won(t-c.rem)+' 초과':won(c.rem-t)+' 부족'})`),t===c.rem),
            crit(`식비와 의료비를 넣음 (식비 ${won(v[0])}, 의료비 ${won(v[1])})`,v[0]>0&&v[1]>0),
            crit(`비상금을 정해 둠 (${won(v[EMG])})`,v[EMG]>0)]);
        }}));
      }},
    { name:'주별 식비', instr:'', hint:'숫자를 눌러 입력하세요.',
      render(body,c,d,done,api){
        const food=(d.allocV||[0])[0]; api.setInstr(`식비 ${won(food)}을 4주 동안 똑같이 나누면 한 주에 얼마씩 쓸 수 있나요?`);
        const np=numPad('원');
        body.append(np.el,checker('확인',{d,key:'week',done,lock:np.lock,unlock:np.unlock,evaluate(){
          const x=np.get(); d.weekAns=x; const ok=x===food/4;
          return {ok,title:ok?'맞습니다.':`${won(x)}은(는) 맞지 않습니다.`,lines:[`${won(food)} ÷ 4 = <b>${won(food/4)}</b>`]};
        }})); }},
  ],
  questions:['어떤 항목에 우선순위를 두었나요? 그 이유는 무엇인가요?','예산을 초과하게 된다면 어떤 항목을 조정할 계획인가요?','남은 금액이 생긴다면 어떻게 활용할 계획인가요?'],
  summarize(d,c){ return [{label:'남은 금액 계산 (첫 답)',ok:!!d.remFirst?.ok,detail:`답 ${d.remAns!=null?won(d.remAns):'-'} / 정답 ${won(c.rem)}`}]
    .concat(sumCheck(d,'alloc','항목별 배분'),[{label:'배분 내용',ok:null,detail:(d.allocTxt||'-')+` — 남은 돈 실시간 표시 ${d.showRem===false?'끔':'켬'}`},{label:'한 주 식비 계산 (첫 답)',ok:!!d.weekFirst?.ok,detail:d.weekAns!=null?won(d.weekAns):'-'}]); }
},
// ── 9. 일상 루틴에 약속 통합하기 ──────────────
{
  id:'routine', no:9, title:'일상 루틴에 약속 통합하기', tag:'일정관리', tagClass:'tag-plan',
  desc:'빈 하루 일정표에 평소 일과와 약속, 이동 시간을 직접 넣고, 약속과 겹치는 일과는 시간을 옮깁니다.',
  levels:{1:'일과 5가지 · 약속 2개 · 이동 30분',2:'일과 7가지 · 약속 3개 · 이동 30분',3:'일과 7가지 · 약속 3개 · 먼 곳은 이동 1시간 · 약은 식사와 함께'},
  init(level){ return routineGen(level); },
  situation(c){ return `<p><b>${c.day}</b> 하루 일정을 짜야 합니다. 평소 일과:</p><ul>`+c.R.map(r=>`<li>${fmt(r.start)} ${r.name} (${durTxt(r.dur)})</li>`).join('')+
    `</ul><p>이날 약속 (시간을 바꿀 수 없음):</p><ul>`+c.A.map(a=>`<li>${fmt(a.start)} ${a.name} (${durTxt(a.dur)}) — 가는 데 <b>${a.T}분</b>, 오는 데 <b>${a.T}분</b></li>`).join('')+
    `</ul><p>약속과 겹치는 일과는 다른 시간으로 옮겨도 되지만 빼먹으면 안 됩니다.</p>`; },
  steps:[
    { name:'하루 일정표', instr:'', hint:'왼쪽에서 일정을 누르고 시간표 칸을 누르면 들어갑니다. 넣은 일정은 ✕ 로 뺄 수 있습니다. 이동은 약속 바로 앞과 바로 뒤에 넣으세요.',
      render(body,c,d,done,api){
        api.setInstr(`${c.day} 일정표를 처음부터 직접 만드세요.`);
        const items=c.R.map(r=>({id:r.id,name:r.name,dur:r.dur,cls:'rt'})).concat(c.A.map(a=>({id:a.id,name:a.name,dur:a.dur,cls:'med'})),
          c.mv.map(m=>({id:m.id,name:'이동',dur:m.dur,cls:'mv'})));
        const pl=planner({cols:[c.day.slice(0,1)],colNames:[c.day],start:360,end:1380,items});
        body.append(pl.el,checker('일정표 확인',{d,key:'rt',done,lock:pl.lock,unlock:pl.unlock,evaluate(){
          const need=items.filter(it=>!pl.pos(it.id));
          if(need.length) return {incomplete:`아직 넣지 않은 일정이 ${need.length}개 있습니다.`};
          const P=id=>pl.pos(id).start, mvs=c.mv.map(m=>({dur:m.dur,start:P(m.id)}));
          const list=c.A.map(a=>crit(`${a.name}: ${fmt(a.start)}에 넣음`,P(a.id)===a.start));
          list.push(crit('약속마다 바로 앞뒤에 이동 시간',c.A.every(a=>mvs.some(m=>m.dur===a.T&&m.start+m.dur===a.start)&&mvs.some(m=>m.dur===a.T&&m.start===a.start+a.dur))));
          const bf=c.R.find(r=>r.k==='bf'), ln=c.R.find(r=>r.k==='ln'), dn=c.R.find(r=>r.k==='dn');
          list.push(crit('식사 시간대 지킴 (아침 10시 전, 점심 11시~오후 2시, 저녁 오후 5시~8시에 시작)',P(bf.id)<=600&&P(ln.id)>=660&&P(ln.id)<=840&&P(dn.id)>=1020&&P(dn.id)<=1200));
          const bl=pl.all().sort((x,y)=>x.start-y.start);
          list.push(crit('기상이 맨 처음, 취침 준비가 맨 마지막',bl[0].id===c.R[0].id&&bl[bl.length-1].id===c.R[c.R.length-1].id));
          const moved=c.R.filter(r=>P(r.id)!==r.start);
          d.rtTxt=bl.map(x=>`${fmt(x.start)} ${x.name}`).join(', ');
          d.movedTxt=moved.map(r=>`${r.name} ${fmt(r.start)}→${fmt(P(r.id))}`).join(', ')||'없음';
          return critResult(list,[`시간을 옮긴 일과: ${d.movedTxt}`]);
        }}));
      }},
  ],
  questions:['일상 루틴 중 어떤 부분을 조정했나요? 그 이유는 무엇인가요?','약속 사이에 충분한 휴식 시간을 확보했나요?','이런 바쁜 날 컨디션 관리를 위한 전략은 무엇인가요?'],
  summarize(d,c){ return [{label:'이날 약속',ok:null,detail:c.A.map(a=>`${fmt(a.start)} ${a.name} (이동 ${a.T}분)`).join(', ')}]
    .concat(sumCheck(d,'rt','하루 일정표'),[{label:'시간을 옮긴 일과',ok:null,detail:d.movedTxt||'-'},{label:'완성한 일정표',ok:null,detail:d.rtTxt||'-'}]); }
},
// ── 10. 가족 행사와 개인 일정 조율하기 ────────
{
  id:'wedding', no:10, title:'가족 행사와 개인 일정 조율하기', tag:'일정충돌', tagClass:'tag-conflict',
  desc:'가족 행사 날 일정을 빈 시간표에 직접 짜고, 행사와 겹치는 약 복용·약속을 어떻게 할지 정합니다.',
  levels:{1:'행사 + 개인 일정 1개 · 이동 1시간',2:'행사 + 개인 일정 1개 + 약 복용·저녁 약속 조정',3:'행사 + 가족 일정이 더 많음 · 이동 1시간 30분 · 약 복용·저녁 약속 조정'},
  init(level){ return weddingGen(level); },
  situation(c){ return `<p>이번 주 토요일에 <b>${c.ev.name}</b>이(가) 있습니다 (<b>${rangeTxt(c.ev.start,c.ev.start+c.ev.dur)}</b>).</p>
    <p>행사장까지는 차로 <b>${durTxt(c.T)}</b>이 걸립니다. 행사 시작 <b>1시간 전부터 시작 시각 사이</b>에 도착하면 됩니다.</p>

    (c.med?`<p>오후 <b>${fmt(c.med).replace('오후 ','')}</b>에 꼭 먹어야 하는 약이 있고, <b>${fmt(c.dinner)}</b>에 이웃과 저녁 식사 약속이 있습니다.</p>`:'')+
    `<p>행사에 가기 전에 준비(옷 갈아입기·선물 챙기기) <b>1시간</b>이 필요합니다.</p>`; },
  steps:[
    { name:'토요일 일정표', instr:'', hint:'왼쪽에서 일정을 누르고 시간표 칸을 누르세요. 다른 일정도 직접 넣어야 합니다. 휴식은 1번 이상 넣으세요.',
      render(body,c,d,done,api){
        api.setInstr('토요일 일정표를 처음부터 직접 만드세요.');
        const items=c.fx.map(f=>({id:f.id,name:f.name,dur:f.dur,cls:'p2'})).concat([{id:'ev',name:c.ev.name,dur:c.ev.dur,cls:'med'},
          {id:'prep',name:'행사 준비(옷·선물)',dur:60,cls:'rt'},{id:'go',name:'행사장 가는 길',dur:c.T,cls:'mv'},{id:'back',name:'집으로 오는 길',dur:c.T,cls:'mv'},
          {id:'r1',name:'휴식',dur:30,cls:'new'},{id:'r2',name:'휴식',dur:30,cls:'new'}]);
        const pl=planner({cols:['토'],colNames:['토요일'],start:420,end:1320,items});
        body.append(pl.el,checker('일정표 확인',{d,key:'sat',done,lock:pl.lock,unlock:pl.unlock,evaluate(){
          const need=items.filter(it=>!['r1','r2'].includes(it.id)&&!pl.pos(it.id));
          if(need.length) return {incomplete:'아직 넣지 않은 일정이 있습니다. (휴식은 1번 이상)'};

          const arrive=P('go')+c.T, evS=c.ev.start, evE=c.ev.start+c.ev.dur;
          const list=c.fx.map(f=>crit(`${f.name}: ${fmt(f.start)}에 넣음`,P(f.id)===f.start)).concat([
            crit(`${c.ev.name}: ${fmt(evS)}에 넣음`,P('ev')===evS),
            crit(`행사장 도착 ${fmt(arrive)} — ${fmt(evS-60)}~${fmt(evS)} 사이`,arrive<=evS&&arrive>=evS-60),
            crit(`집으로 오는 길: 행사가 끝난 뒤 1시간 안에 출발 (${fmt(P('back'))})`,P('back')>=evE&&P('back')<=evE+60),
            crit('행사 준비를 출발 전에 마침',P('prep')+60<=P('go')),
            crit('휴식 시간 1번 이상',P('r1')!=null||P('r2')!=null)]);
          d.home=P('back')+c.T;
          d.satTxt=pl.all().sort((a,b)=>a.start-b.start).map(x=>`${fmt(x.start)} ${x.name}`).join(', ');
          return critResult(list,[`집 도착 예정: ${fmt(d.home)}`]);

    { name:'약 복용', when:c=>!!c.med, instr:'', hint:'',
      render(body,c,d,done,api){

        const OPT=[`약을 챙겨 가서 ${fmt(c.med)}에 행사장에서 먹는다`,'행사가 끝나고 집에 와서 먹는다','오늘 한 번은 건너뛴다','아침에 미리 같이 먹는다'];
        d.med={}; const r=rowsAsk([{key:'q',label:'',options:shuffle(OPT)}],d.med);
        body.append(r.el,checker('확인',{d,key:'medc',done,lock:r.lock,unlock:r.unlock,evaluate(){

    { name:'저녁 약속', when:c=>!!c.med, instr:'', hint:'',

        d.nb={}; const r=rowsAsk([{key:'q',label:'',options:OPT}],d.nb);
        body.append(r.el,checker('확인',{d,key:'nbc',done,lock:r.lock,unlock:r.unlock,evaluate(){
          if(!r.all()) return {incomplete:'하나를 골라 주세요.'}; const q=d.nb.q;

        }})); }},
  ],
  questions:['이 계획에서 가장 어려운 부분은 무엇이었나요?','예상치 못한 교통 체증이 발생한다면 어떻게 조정할 수 있을까요?','행사에서 피로감을 느낀다면 어떻게 대처할 계획인가요?'],
  summarize(d,c){ const r=[{label:'이번 행사',ok:null,detail:`${c.ev.name} ${rangeTxt(c.ev.start,c.ev.start+c.ev.dur)} · 이동 ${durTxt(c.T)}`}]
    .concat(sumCheck(d,'sat','토요일 일정표'),[{label:'일정표',ok:null,detail:d.satTxt||'-'}]);
    if(c.med) r.push({label:'약 복용 방법 (첫 답)',ok:!!d.medcFirst?.ok,detail:d.med?.q||'-'},{label:'저녁 약속 결정 (첫 답)',ok:!!d.nbcFirst?.ok,detail:d.nb?.q||'-'});

// ── 11. 계절 변화에 따른 일정 조정 ────────────
{
  id:'snow', no:11, title:'계절 변화에 따른 일정 조정', tag:'돌발대응', tagClass:'tag-adapt',
  desc:'궂은 날씨 예보에 맞춰 약속을 유지·변경으로 나누고, 늘어난 이동 시간을 계산합니다. 날씨와 약속이 매번 바뀝니다.',
  levels:{1:'약속 3개 · 이동 시간 2배',2:'약속 5개 · 이동 시간 2배',3:'약속 5개 · 이동 시간 1.5배 (계산이 더 어려움)'},
  init(level){
    const W=pick([{n:'눈',why:'눈길'},{n:'폭우',why:'빗길'},{n:'태풍',why:'강풍'}]);
    const H=shuffle([['재활센터 방문',120],['병원 정기 검진',90],['투석 치료',240],['물리치료',60],['약 처방 받기',30]]);
    const S=shuffle([['친구와 카페 만남',60],['지역 센터 모임',120],['미용실 예약',60],['동창 모임',120],['마트 장보기',60]]);
    const n=level===1?3:5, nh=level===1?1:2;
    const list=shuffle(H.slice(0,nh).map(x=>[x[0],x[1],1]).concat(S.slice(0,n-nh).map(x=>[x[0],x[1],0])));
    const days=shuffle([0,1,2,3,4]).slice(0,n).sort();
    const ap=list.map((x,i)=>({id:'p'+i,day:days[i],start:pick([540,600,660,840,900]),name:x[0],dur:x[1],h:x[2]}));
    const base=pick([20,30,40]), mult=level===3?1.5:2;
    const tgt=ap.find(a=>a.h);
    return {W,ap,base,mult,tgt};
  },
  situation(c){ return `<p>다음 주에는 <b>${c.W.n}</b> 예보가 있습니다.</p><ul>${c.ap.map(a=>`<li>${DAYN[a.day]} ${fmt(a.start)}: ${a.name} (${durTxt(a.dur)})</li>`).join('')}</ul>
    <p>대중교통을 이용 중이며, ${c.W.n}이(가) 오면 이동 시간이 평소보다 <b>${c.mult}배</b> 길어질 수 있습니다.</p>`; },
  steps:[
    { name:'약속 나누기', instr:'꼭 유지해야 할 약속과 변경·취소할 수 있는 약속으로 나누세요.', hint:'건강과 관련된 약속인지 생각해 보세요.',
      render(body,c,d,done){ d.keep={}; const lab=a=>`${DAYN[a.day]} ${fmt(a.start)} ${a.name}`;
        const r=rowsAsk(c.ap.map(a=>({key:a.id,label:lab(a),options:['꼭 유지','변경 가능']})),d.keep);

          if(!r.all()) return {incomplete:'모든 약속을 나눠 주세요.'};
          return critResult(c.ap.map(a=>crit(`${a.name} → ${a.h?'꼭 유지 (건강 관련)':'변경 가능'}`,(d.keep[a.id]==='꼭 유지')===!!a.h)));
        }})); }},
    { name:'대안 정하기', instr:'변경 가능한 약속을 각각 어떻게 할지 고르세요.', hint:'',
      render(body,c,d,done){
        const OPT=['날씨 좋은 날로 미룬다','전화·영상 통화로 대신한다','미리 연락해 취소한다','연락 없이 가지 않는다'];
        const list=c.ap.filter(a=>d.keep[a.id]==='변경 가능'); d.alt={};
        if(!list.length){ body.append(h('p',{class:'hint'},'변경 가능으로 고른 약속이 없습니다. 다음 단계로 넘어가세요.')); done(); return; }
        const r=rowsAsk(list.map(a=>({key:a.id,label:a.name,options:OPT})),d.alt);
        body.append(r.el,checker('확인',{d,key:'altc',done,lock:r.lock,unlock:r.unlock,evaluate(){
          if(!r.all()) return {incomplete:'모든 약속의 대안을 골라 주세요.'};
          return critResult(list.map(a=>crit(`${a.name}: ${d.alt[a.id]}`,d.alt[a.id]!==OPT[3])),['약속을 바꿀 때는 상대에게 미리 연락합니다.']);
        }})); }},
    { name:'이동 시간 계산', instr:'', hint:'버튼으로 시각을 맞춘 뒤 확인을 누르세요.',
      render(body,c,d,done,api){ const a=c.tgt, tr=c.base*c.mult, ans=a.start-tr;
        api.setInstr(`${a.name}까지 평소 ${c.base}분 걸립니다. ${c.W.n} 때문에 ${c.mult}배가 걸린다면, ${DAYN[a.day]} ${fmt(a.start)}에 늦지 않으려면 늦어도 몇 시에 출발해야 하나요?`);

          const t=cp.get(); d.goAns=t; const ok=t<=ans&&t>=ans-30;
          return {ok,title:ok?'맞습니다.':`${fmt(t)}에 출발하면 ${t>ans?'늦습니다.':'너무 이릅니다.'}`,lines:[`${c.base}분 × ${c.mult} = ${tr}분이므로 늦어도 <b>${fmt(ans)}</b>에 출발합니다. (30분 더 일찍까지는 알맞음)`]};
        }})); }},
    { name:'궂은 날 대비', instr:'', hint:'',
      render(body,c,d,done,api){ api.setInstr(`${c.W.n}이(가) 올 때 이동을 위한 준비로 알맞은 것을 모두 고르세요.`);
        const OPT=['미끄럼 방지 신발을 신는다','평소보다 일찍 출발한다','택시나 가족 차량을 미리 알아 둔다','일기예보를 미리 확인한다','평소와 같은 시간에 출발한다',`늦을까 봐 ${c.W.why}을 서둘러 걷는다`], GOOD=[0,1,2,3];

          const s=mp.get(); if(!s.size) return {incomplete:'하나 이상 골라 주세요.'};
          return critResult(OPT.map((o,i)=>crit(`${o} → ${GOOD.includes(i)?'알맞음':'알맞지 않음'}`,s.has(i)===GOOD.includes(i))));
