<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>IADL 시나리오 훈련 - 광주365재활병원</title>
<style>
:root{
  --ink:#1f2433; --sub:#5b6375; --line:#d5dbe6; --bg:#eef1f6; --card:#fff;
  --pri:#283593; --pri-2:#3f51b5; --pri-soft:#e8eaf6;
  --ok:#2e7d32; --ok-soft:#e8f5e9; --bad:#c62828; --bad-soft:#fdecea;
  --warn:#b54708; --warn-soft:#fff4e5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  background:var(--bg);color:var(--ink);font-size:18px;line-height:1.5;padding:16px 14px 90px}
button{font:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
button:focus-visible{outline:3px solid #ffb300;outline-offset:2px}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.screen{display:none}
.screen.on{display:flex}

#home-btn{position:fixed;top:12px;left:12px;z-index:50;padding:10px 18px;border-radius:999px;border:none;
  background:#fff;color:#333;font-weight:700;font-size:15px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
h1{margin:30px 0 0;text-align:center;font-size:1.8rem;color:#1a237e;font-weight:800}
.lead{text-align:center;color:var(--sub);font-size:1rem;margin:0}

.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field label{font-weight:700;color:var(--sub);font-size:.95rem}
.field input{font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:10px;min-width:180px}

/* 활동 목록 */
.act-list{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.act-list{grid-template-columns:1fr}}
.act-card{text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px;
  display:flex;flex-direction:column;gap:6px;min-height:150px}
.act-card:hover{border-color:var(--pri-2)}
.act-card.done{border-color:#81c784;background:#f6fbf6}
.act-card .t{font-size:1.15rem;font-weight:800}
.act-card .d{font-size:.95rem;color:var(--sub)}
.act-card .st{margin-top:auto;font-size:.9rem;font-weight:700;color:var(--ok)}
.tag{display:inline-block;align-self:flex-start;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:800;color:#fff}
.tag-seq{background:#e64a19}.tag-plan{background:#1976d2}.tag-conflict{background:#7b1fa2}
.tag-budget{background:#388e3c}.tag-adapt{background:#00838f}

.big-btn{padding:16px 22px;border-radius:14px;border:none;font-size:1.1rem;font-weight:800;min-height:58px}
.b-pri{background:var(--pri);color:#fff}
.b-sec{background:#fff;color:var(--ink);border:2px solid var(--line)}
.b-ok{background:var(--ok);color:#fff}

/* 활동 화면 */
.act-top{margin-top:46px;display:flex;align-items:center;gap:12px;background:var(--pri);color:#fff;border-radius:16px;padding:14px 16px}
.act-top .back{background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:10px;padding:10px 14px;font-weight:700;font-size:.95rem}
.act-top .ttl{flex:1;font-size:1.25rem;font-weight:800}
.act-top .tm{font-variant-numeric:tabular-nums;font-weight:700;background:rgba(0,0,0,.2);padding:6px 12px;border-radius:10px;font-size:1rem}
.steps-bar{display:flex;gap:8px;flex-wrap:wrap}
.step-pill{padding:6px 12px;border-radius:999px;background:#fff;border:2px solid var(--line);font-size:.9rem;font-weight:700;color:var(--sub)}
.step-pill.cur{border-color:var(--pri);color:var(--pri);background:var(--pri-soft)}
.step-pill.past{border-color:#a5d6a7;color:var(--ok)}
.situ{background:#fffdf5;border:2px solid #ead9a6;border-radius:16px;padding:14px 18px}
.situ .h{font-weight:800;color:#8a6d1a;font-size:.95rem;margin-bottom:4px}
.situ p{margin:4px 0}
.situ ul{margin:6px 0;padding-left:22px}
.instr{font-size:1.2rem;font-weight:800;color:var(--pri);margin:0}
.hint{font-size:.95rem;color:var(--sub);margin:0}
.lbl{font-size:.92rem;font-weight:800;color:var(--sub);margin:6px 0 2px}

/* 순서 정하기 */
.pool{display:flex;flex-wrap:wrap;gap:10px;min-height:58px}
.chip{padding:12px 16px;border-radius:12px;border:2px solid var(--pri-2);background:#fff;color:var(--pri);font-weight:700;min-height:54px}
.chip.sel{background:var(--pri-2);color:#fff}
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 14px;border-radius:12px;border:2px dashed var(--line);background:#fafbfd;min-height:54px}
.slot.filled{border-style:solid;border-color:var(--pri-2);background:var(--pri-soft)}
.slot-n{min-width:32px;height:32px;border-radius:50%;background:var(--pri-2);color:#fff;font-weight:800;display:grid;place-items:center;font-size:.95rem}
.slot:not(.filled) .slot-n{background:#c5cbd8}
.slot-t{font-weight:700}
.slot:not(.filled) .slot-t{color:#9aa2b2}
.locked{pointer-events:none;opacity:.8}
.dlist{display:flex;flex-direction:column;gap:8px}
.drow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:2px solid var(--pri-2);
  background:var(--pri-soft);min-height:58px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.drow:active{cursor:grabbing}
.drow .grip{margin-left:auto;color:#7986cb;font-size:1.3rem;line-height:1}
.drow.dsrc{opacity:.3}
.drow.dover{border-color:#ff9800;box-shadow:0 0 0 3px #ffe0b2}
.dclone{position:fixed;left:0;top:0;margin:0;z-index:9999;pointer-events:none;opacity:.95;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.empty-note{color:var(--sub);font-size:.95rem;padding:12px 0}

/* 선택 버튼 묶음 */
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-width:64px;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:700}
.seg button.on{border-color:var(--pri-2);background:var(--pri-2);color:#fff}
.est-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid #eceff4}
.est-row .nm{font-weight:700}
.total{font-size:1.15rem;font-weight:800;text-align:right}

/* 시간 선택 */
.clock{display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px 0}
.clock .disp{font-size:2.4rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--pri);background:var(--pri-soft);padding:8px 28px;border-radius:14px}
.clock .ctrls{display:grid;grid-template-columns:repeat(4,auto);gap:8px}
.clock .ctrls button{padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:800;min-width:96px}

/* 타임라인 */
.tl{display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums}
.tl div{display:flex;gap:12px;padding:8px 12px;border-radius:10px;background:#f6f7fb}
.tl .tt{min-width:170px;font-weight:700;color:var(--sub)}
.tl .fin{background:var(--pri-soft);font-weight:800}

/* 피드백 */
.fb{border-radius:14px;padding:14px 16px;border:2px solid}
.fb.ok{background:var(--ok-soft);border-color:#a5d6a7}
.fb.bad{background:var(--bad-soft);border-color:#ef9a9a}
.fb.warn{background:var(--warn-soft);border-color:#ffcc80}
.fb .r{font-weight:800;font-size:1.1rem;margin-bottom:4px}
.fb ul{margin:6px 0 0;padding-left:20px}
.fb li{margin:3px 0}
.okc{color:var(--ok);font-weight:800}.badc{color:var(--bad);font-weight:800}

/* 달력 */
.cal-wrap{overflow-x:auto}
.cal{display:grid;gap:0;border:1px solid var(--line);border-radius:12px;background:#fff;position:relative}
.cal .dh{display:grid;place-items:center;font-weight:800;background:#f3f5fa;border-bottom:1px solid var(--line)}
.cal .th{white-space:nowrap;font-size:.78rem;color:var(--sub);padding:0 6px;text-align:right;border-right:1px solid var(--line)}
.cal .cell{border:none;border-top:1px solid #f0f2f6;border-left:1px solid #f0f2f6;background:transparent;padding:0}
.cal .cell.hr{border-top:1px solid #dfe3eb}
.cal.pickable .cell:hover{background:#e3f2fd}
.cal .blk{margin:2px 4px;border-radius:8px;background:#5c6bc0;color:#fff;font-size:.82rem;font-weight:700;
  padding:3px 6px;overflow:hidden;line-height:1.25;z-index:2;border:2px solid transparent;text-align:left}
.cal .blk small{display:block;font-weight:500;opacity:.9}
.cal .blk.med{background:#7b1fa2}
.cal .blk.new{background:#00838f}
.cal .blk.sel{background:#fff;color:var(--bad);border-color:var(--bad)}
.cal .blk.ghost{background:transparent;border:2px dashed #9aa2b2;color:#9aa2b2;pointer-events:none}
.cal .blk.tap{cursor:pointer}
.cal .blk.fixed{background:#546e7a}
.cal .blk.fixed.med{background:#7b1fa2}
.cal .blk.p2{background:#ef6c00}
.cal .blk.rt{background:#8d6e63}
.npad{display:grid;grid-template-columns:repeat(3,96px);gap:8px}
.npad button{padding:14px 0;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:1.2rem}
.qb{min-width:52px;height:42px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:.9rem}
.amt{min-width:110px;text-align:center;font-variant-numeric:tabular-nums}
.mx{border-collapse:collapse;width:100%;min-width:520px}
.mx th,.mx td{border:1px solid var(--line);padding:4px;text-align:center;font-size:.9rem}
.mx th{background:#f3f5fa}.mx th.rh{text-align:left;padding:6px 10px;white-space:nowrap}
.mxb{width:100%;min-height:44px;border:none;border-radius:8px;background:#fff;font-weight:800;font-size:1.2rem;color:#fff}
.mxb.on{background:var(--ok)}
.mtl{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.mtr{display:flex;align-items:center;flex-wrap:wrap;gap:8px;min-height:42px;padding:4px 10px;border-top:1px solid #eef1f5}
.mtr.meal{background:#fff8e1}
.mtr.pick{cursor:pointer}.mtr.pick:hover{background:#e3f2fd}
.mtr .tm{min-width:110px;color:var(--sub);font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.mtr .ml{min-width:80px;font-weight:800;color:#8a6d1a;font-size:.9rem}
.pill{padding:6px 12px;border-radius:999px;background:var(--pri-2);color:#fff;font-weight:700;font-size:.85rem;border:none}
.tag-health{background:#c62828}.tag-prior{background:#f57c00}

/* 장보기 */
.shop{display:grid;grid-template-columns:1fr 290px;gap:14px;align-items:start}
@media(max-width:720px){.shop{grid-template-columns:1fr}}
.sec-h{font-weight:800;color:var(--sub);margin:10px 0 6px;font-size:.95rem}
.goods{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.good{text-align:left;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;min-height:74px}
.good .n{font-weight:800}
.good .u{font-size:.85rem;color:var(--sub)}
.good .p{font-weight:700;color:var(--pri)}
.good.in{border-color:var(--pri-2);background:var(--pri-soft)}
.cart{position:sticky;top:10px}
.cart-row{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid #eceff4;font-size:.95rem}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:38px;height:38px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:800}
.toggle{display:flex;align-items:center;gap:8px;font-size:.95rem;font-weight:700;color:var(--sub)}
.toggle input{width:22px;height:22px}

/* 메시지 */
.msgs{display:flex;flex-direction:column;gap:8px}
.msg{background:#e0f2f1;border-radius:14px 14px 14px 4px;padding:12px 16px;max-width:560px}
.msg .from{font-size:.85rem;font-weight:800;color:#00695c}
.palette{display:flex;flex-wrap:wrap;gap:10px}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--bad-soft);border:2px solid #ef9a9a;border-radius:12px;padding:10px 14px}

/* 질문 */
.q{padding:12px 0;border-bottom:1px solid #eceff4}
.q .qt{font-weight:700;margin-bottom:8px}
.q .seg button.on.r0{background:var(--ok);border-color:var(--ok)}
.q .seg button.on.r1{background:#ef6c00;border-color:#ef6c00}
.q .seg button.on.r2{background:var(--bad);border-color:var(--bad)}
textarea{font:inherit;width:100%;min-height:80px;padding:10px;border:2px solid var(--line);border-radius:10px}

.foot{display:flex;justify-content:flex-end;gap:10px}

/* 리포트 */
.rep h2{margin:0 0 4px;font-size:1.4rem}
.rep .meta{color:var(--sub);margin-bottom:10px}
.rep table{width:100%;border-collapse:collapse;font-size:.95rem;margin:6px 0 10px}
.rep th,.rep td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.rep th{background:#f3f5fa}
.rep .act-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:14px;border-bottom:2px solid var(--pri);padding-bottom:4px}
.rep .act-h b{font-size:1.1rem}
.pass{color:var(--ok);font-weight:800}.fail{color:var(--bad);font-weight:800}.na{color:var(--sub)}
#hospital-logo{position:fixed;bottom:10px;right:14px;font-size:.8rem;color:#9aa2b2;font-weight:700}

@media print{
  body{background:#fff;padding:0;font-size:12px}
  #home-btn,#hospital-logo,.no-print{display:none!important}
  .panel{border:none;padding:0}
  .rep table{font-size:11px}
  .act-h{break-after:avoid}
  table{break-inside:auto} tr{break-inside:avoid}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<button id="home-btn" onclick="location.href='index.html'">홈으로</button>

<!-- 홈 -->
<div class="wrap screen on" id="scr-home">
  <h1>IADL 시나리오 훈련</h1>
  <p class="lead">상황을 읽고, 화면에서 직접 계획하고 정리해 보세요.</p>
  <div class="panel field">
    <label for="pname">환자명</label><input id="pname" placeholder="선택 입력"/>
    <label>날짜</label><span id="today"></span>
  </div>
  <div class="act-list" id="act-list"></div>
  <div class="row" style="justify-content:center">
    <button class="big-btn b-pri" id="btn-report" disabled onclick="showReport()">결과 리포트 보기</button>
  </div>
</div>

<!-- 활동 -->
<div class="wrap screen" id="scr-act">
  <div class="act-top">
    <button class="back" onclick="leaveActivity()">목록으로</button>
    <div class="ttl" id="a-title"></div>
    <div class="tm" id="a-timer">0:00</div>
  </div>
  <div class="steps-bar" id="a-steps"></div>
  <div class="situ" id="a-situ"></div>
  <div class="panel" style="display:flex;flex-direction:column;gap:12px">
    <p class="instr" id="a-instr"></p>
    <p class="hint" id="a-hint"></p>
    <div id="a-body" style="display:flex;flex-direction:column;gap:12px"></div>
  </div>
  <div class="foot"><button class="big-btn b-pri" id="a-next" disabled>다음 단계</button></div>
</div>

<!-- 리포트 -->
<div class="wrap screen" id="scr-rep">
  <div class="panel rep" id="rep-body"></div>
  <div class="row no-print" style="justify-content:center">
    <button class="big-btn b-sec" onclick="go('home')">목록으로</button>
    <button class="big-btn b-pri" onclick="window.print()">인쇄하기</button>
  </div>
</div>

<div id="hospital-logo">광주365재활병원_인지연하팀</div>

<script>
// ══ 공통 도구 ══════════════════════════════════════════
function h(tag, props, ...kids){
  const e=document.createElement(tag);
  if(props) for(const k in props){
    const v=props[k];
    if(v==null||v===false) continue;
    if(k==='class') e.className=v;
    else if(k==='html') e.innerHTML=v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2),v);
    else if(k==='style') e.style.cssText=v;
    else if(k==='disabled') e.disabled=!!v;
    else e.setAttribute(k,v);
  }
  kids.flat(Infinity).forEach(c=>{ if(c==null||c===false) return; e.append(c.nodeType?c:document.createTextNode(String(c))); });
  return e;
}
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function fmt(m){const hh=Math.floor(m/60),mm=m%60;const ap=hh<12?'오전':'오후';const h12=hh>12?hh-12:hh;return `${ap} ${h12}시${mm?` ${mm}분`:''}`;}
function won(n){return n.toLocaleString('ko-KR')+'원';}
function mmss(ms){const s=Math.floor(ms/1000);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}
const DAYS=['월','화','수','목','금'];
const DAYN=['월요일','화요일','수요일','목요일','금요일'];

// 순서 정하기 위젯: 카드를 끌어서 다른 카드 위에 놓으면 그 자리로 끼워 넣음 (순서화 훈련과 같은 방식)
function orderer(items, onChange){
  let order=items.slice(), locked=false;
  const wrap=h('div',{class:'dlist'});
  let src=null, clone=null, offX=0, offY=0, over=null;
  function draw(){
    wrap.innerHTML='';
    order.forEach((it,i)=>{
      const row=h('div',{class:'drow','data-pos':i},h('span',{class:'slot-n'},i+1),h('span',{class:'slot-t'},it),h('span',{class:'grip','aria-hidden':'true'},'☰'));
      row.addEventListener('pointerdown',e=>start(e,row));
      wrap.append(row);
    });
  }
  function rowAt(x,y){
    if(clone) clone.style.display='none';
    const el=document.elementFromPoint(x,y);
    if(clone) clone.style.display='';
    const r=el&&el.closest('.drow');
    return r&&wrap.contains(r)?r:null;
  }
  function start(e,row){
    if(locked||src||(e.button!==undefined&&e.button!==0)) return;
    e.preventDefault();
    src=row;
    const r=row.getBoundingClientRect();
    offX=e.clientX-r.left; offY=e.clientY-r.top;
    clone=row.cloneNode(true); clone.classList.add('dclone');
    clone.style.width=r.width+'px';
    clone.style.transform=`translate3d(${r.left}px,${r.top}px,0)`;
    document.body.append(clone);
    row.classList.add('dsrc');
    window.addEventListener('pointermove',move,{passive:false});
    window.addEventListener('pointerup',finish);
    window.addEventListener('pointercancel',cancel);
  }
  function move(e){
    if(!src) return;
    e.preventDefault();
    clone.style.transform=`translate3d(${e.clientX-offX}px,${e.clientY-offY}px,0)`;
    const el=rowAt(e.clientX,e.clientY);
    if(el!==over){ if(over) over.classList.remove('dover'); over=(el&&el!==src)?el:null; if(over) over.classList.add('dover'); }
  }
  function cleanup(){
    window.removeEventListener('pointermove',move);
    window.removeEventListener('pointerup',finish);
    window.removeEventListener('pointercancel',cancel);
    if(clone){clone.remove();clone=null;}
    if(over){over.classList.remove('dover');over=null;}
    if(src) src.classList.remove('dsrc');
  }
  function finish(e){
    if(!src) return;
    const target=rowAt(e.clientX,e.clientY);
    const from=+src.dataset.pos;
    cleanup(); src=null;
    if(target){
      const to=+target.dataset.pos;
      if(to!==from){ const [m]=order.splice(from,1); order.splice(to,0,m); draw(); onChange(order.slice()); }
    }
  }
  function cancel(){ cleanup(); src=null; }
  draw();
  return {el:wrap,get:()=>order.slice(),
    lock(){locked=true;wrap.classList.add('locked');},
    unlock(){locked=false;wrap.classList.remove('locked');}};
}

function seg(options, onPick, cur, fmtFn){
  const s=h('div',{class:'seg'});
  options.forEach(o=>s.append(h('button',{class:o===cur?'on':'',onclick:()=>onPick(o)},fmtFn?fmtFn(o):o)));
  return s;
}

function fbBox(kind,title,lines){
  return h('div',{class:'fb '+kind},h('div',{class:'r'},title),lines&&lines.length?h('ul',null,lines.map(l=>h('li',{html:l}))):null);
}

// 달력 위젯 (월~금, 오전 9시~오후 5시, 30분 단위)
const CAL_START=540, CAL_END=1020, SLOT=30;
function calendar(opts){
  // opts: cols(열 이름), colNames, start, end, blocks [{id,day,start,dur,name,cls,tap}], onCell(day,start), onBlock(block), pickable
  const cols=opts.cols||DAYS, names=opts.colNames||DAYN, st=opts.start??CAL_START, en=opts.end??CAL_END;
  const rows=(en-st)/SLOT, cw=cols.length>1?96:220;
  const g=h('div',{class:'cal'+(opts.pickable?' pickable':''),
    style:`grid-template-columns:78px repeat(${cols.length},minmax(${cw}px,1fr));grid-template-rows:38px repeat(${rows},30px);min-width:${78+cols.length*cw}px`});
  g.append(h('div',{style:'grid-row:1;grid-column:1;background:#f3f5fa;border-bottom:1px solid var(--line)'}));
  cols.forEach((d,i)=>g.append(h('div',{class:'dh',style:`grid-row:1;grid-column:${i+2}`},d)));
  for(let r=0;r<rows;r++){
    const t=st+r*SLOT;
    g.append(h('div',{class:'th',style:`grid-row:${r+2};grid-column:1;${t%60?'':'border-top:1px solid #dfe3eb'}`},t%60?'':fmt(t)));
    for(let d=0;d<cols.length;d++){
      g.append(h('button',{class:'cell'+(t%60?'':' hr'),style:`grid-row:${r+2};grid-column:${d+2}`,'aria-label':`${names[d]} ${fmt(t)}`,
        onclick:opts.onCell?()=>opts.onCell(d,t):null,tabindex:opts.pickable?0:-1}));
    }
  }
  (opts.blocks||[]).forEach(b=>{
    const r0=(b.start-st)/SLOT, span=Math.max(1,b.dur/SLOT), tap=opts.onBlock&&b.tap!==false;
    g.append(h(tap?'button':'div',{class:'blk '+(b.cls||'')+(tap?' tap':''),
      style:`grid-row:${r0+2} / span ${span};grid-column:${b.day+2}`,onclick:tap?()=>opts.onBlock(b):null},
      b.name,span>1?h('small',null,fmt(b.start)):null));
  });
  return h('div',{class:'cal-wrap'},g);
}
const overlap=(a,b)=>a.day===b.day&&a.start<b.start+b.dur&&b.start<a.start+a.dur;

// ══ 추가 도구 ══════════════════════════════════════════
function durTxt(m){const hh=Math.floor(m/60),mm=m%60;return ((hh?hh+'시간':'')+(mm?(hh?' ':'')+mm+'분':''))||'0분';}
function rowsAsk(defs,store,onChange){
  let locked=false; const box=h('div');
  const draw=()=>{box.innerHTML='';
    defs.forEach(df=>box.append(h('div',{class:'est-row'},h('span',{class:'nm'},df.label),
      seg(df.options,v=>{if(locked)return;store[df.key]=v;draw();onChange&&onChange();},store[df.key],df.fmt))));};
  draw();
  return {el:box,all:()=>defs.every(df=>store[df.key]!==undefined),lock(){locked=true;box.classList.add('locked');},unlock(){locked=false;box.classList.remove('locked');}};
}
function multiPick(options,onChange){
  const sel=new Set(); let locked=false; const box=h('div',{class:'palette'});
  const draw=()=>{box.innerHTML='';options.forEach((o,i)=>box.append(h('button',{class:'chip'+(sel.has(i)?' sel':''),onclick:()=>{if(locked)return;sel.has(i)?sel.delete(i):sel.add(i);draw();onChange&&onChange(sel);}},o)));};
  draw();
  return {el:box,get:()=>new Set(sel),lock(){locked=true;box.classList.add('locked');},unlock(){locked=false;box.classList.remove('locked');}};
}
function clockPicker(init){
  let t=init; const disp=h('div',{class:'disp'});
  const set=v=>{t=Math.max(300,Math.min(1380,v));disp.textContent=fmt(t);}; set(t);
  const ctr=h('div',{class:'ctrls'},
    h('button',{onclick:()=>set(t-60)},'1시간 빼기'),h('button',{onclick:()=>set(t-10)},'10분 빼기'),
    h('button',{onclick:()=>set(t+10)},'10분 더하기'),h('button',{onclick:()=>set(t+60)},'1시간 더하기'));
  return {el:h('div',{class:'clock'},disp,ctr),get:()=>t,lock(){ctr.classList.add('locked');},unlock(){ctr.classList.remove('locked');}};
}
function numPad(unit){
  let v=''; const disp=h('div',{class:'disp'}); const keys=h('div',{class:'npad'});
  const draw=()=>{disp.textContent=(v?Number(v).toLocaleString('ko-KR'):'0')+(unit||'');};
  ['1','2','3','4','5','6','7','8','9','00','0','지우기'].forEach(k=>keys.append(h('button',{onclick:()=>{
    if(k==='지우기') v=v.slice(0,-1); else if(v.length<10) v=(v+k).replace(/^0+/,''); draw();}},k)));
  draw();
  return {el:h('div',{class:'clock'},disp,keys),get:()=>Number(v||0),lock(){keys.classList.add('locked');},unlock(){keys.classList.remove('locked');}};
}
function matrix(rows,cols){
  const on=rows.map(()=>cols.map(()=>false)); let locked=false; const t=h('table',{class:'mx'});
  const draw=()=>{t.innerHTML='';
    t.append(h('tr',null,h('th',null,''),cols.map(c=>h('th',null,c))));
    rows.forEach((r,i)=>t.append(h('tr',null,h('th',{class:'rh'},r),cols.map((c,j)=>h('td',null,
      h('button',{class:'mxb'+(on[i][j]?' on':''),'aria-label':`${c} ${r}`,onclick:()=>{if(locked)return;on[i][j]=!on[i][j];draw();}},on[i][j]?'✓':''))))));};
  draw();
  return {el:h('div',{class:'cal-wrap'},t),get:()=>on.map(r=>r.slice()),lock(){locked=true;t.classList.add('locked');},unlock(){locked=false;t.classList.remove('locked');}};
}
// 확인 버튼: 첫 시도와 최종 결과를 기록하고, 틀리면 '고치기'로 이어서 수정
function checker(label,o){
  const out=h('div'); let tries=0;
  const btn=h('button',{class:'big-btn b-pri',onclick:()=>{
    out.innerHTML='';
    const r=o.evaluate();
    if(r.incomplete){out.append(fbBox('warn',r.incomplete,[]));return;}
    tries++; if(tries===1) o.d[o.key+'First']=r; o.d[o.key]=r; o.d[o.key+'Tries']=tries;
    o.lock(); btn.style.display='none';
    out.append(fbBox(r.ok?'ok':'bad',r.title,r.lines));
    if(!r.ok&&o.unlock) out.append(h('button',{class:'big-btn b-sec',style:'margin-top:8px',onclick:()=>{o.unlock();out.innerHTML='';btn.style.display='';}},'고치기'));
    o.done();
  }},label);

const crit=(label,ok)=>({label,ok});
const critLines=list=>list.map(x=>`<span class="${x.ok?'okc':'badc'}">${x.ok?'맞음':'다시 확인'}</span> ${x.label}`);
function critResult(list,extra){
  const n=list.filter(x=>x.ok).length;
  return {ok:n===list.length,title:`${list.length}가지 중 ${n}가지를 맞게 했습니다.`,lines:critLines(list).concat(extra||[]),crit:list};
}
// 첫 시도 기준 요약 + 고친 횟수
function sumCheck(d,key,label){
  const f=d[key+'First'], l=d[key];
  if(!f) return [{label,ok:false,detail:'확인하지 않음'}];
  const rows=(f.crit||[{label,ok:f.ok}]).map(x=>({label:x.label,ok:x.ok,detail:x.detail||''}));
  if(d[key+'Tries']>1) rows.push({label:`${label}: 고친 횟수`,ok:null,detail:`${d[key+'Tries']-1}회 (최종 ${l.ok?'모두 맞음':'틀린 곳 남음'})`});
  return rows;
}
// 하루·주간 시간표에 일정 넣기 (항목을 누르고 칸을 누름, 넣은 항목을 누르면 빠짐)
function planner(o){
  const st=o.start,en=o.end,items=o.items,fixed=o.fixed||[];
  const pos={}; items.forEach(it=>{if(it.at) pos[it.id]={day:it.at.day,start:it.at.start};});
  let sel=null,locked=false; const stats={clashes:0};
  const wrap=h('div',{style:'display:flex;flex-direction:column;gap:10px'}); const msg=h('div');
  const all=()=>fixed.map(f=>({...f,fx:true})).concat(items.filter(it=>pos[it.id]).map(it=>({id:it.id,name:it.name,dur:it.dur,cls:it.cls,...pos[it.id]})));
  function draw(){
    wrap.innerHTML='';
    if(!locked){
      const rest=items.filter(it=>!pos[it.id]); const p=h('div',{class:'palette'});
      if(rest.length) rest.forEach(it=>p.append(h('button',{class:'chip'+(sel===it?' sel':''),onclick:()=>{sel=sel===it?null:it;msg.innerHTML='';draw();}},`${it.name} (${durTxt(it.dur)})`)));
      else p.append(h('div',{class:'empty-note'},'모두 넣었습니다.'));
      wrap.append(h('div',{class:'lbl'},o.paletteLabel||'넣을 일정'),p);
      if(sel) wrap.append(h('p',{class:'hint'},`‘${sel.name}’을(를) 넣을 칸을 누르세요.`));
    }
    wrap.append(calendar({cols:o.cols,colNames:o.colNames,start:st,end:en,pickable:!!sel&&!locked,
      blocks:all().map(b=>({...b,cls:b.fx?('fixed '+(b.cls||'')):(b.cls||'new'),tap:!locked&&(!b.fx||!!sel)})),
      onBlock:locked?null:b=>{
        if(sel){stats.clashes++;msg.innerHTML='';msg.append(fbBox('warn',`그 시간에는 이미 ‘${b.name}’이(가) 있습니다.`,[]));return;}
        if(b.fx)return; delete pos[b.id]; msg.innerHTML=''; draw();},
      onCell:locked?null:(day,start)=>place(day,start)}));
    wrap.append(msg);
  }
  function place(day,start){
    if(!sel) return;
    const cand={day,start,dur:sel.dur};
    if(start+sel.dur>en){msg.innerHTML='';msg.append(fbBox('warn',`${fmt(en)} 안에 끝나지 않습니다.`,[]));return;}
    if(!o.allowOverlap){const hit=all().find(b=>overlap(b,cand));
      if(hit){stats.clashes++;msg.innerHTML='';msg.append(fbBox('warn',`그 시간에는 이미 ‘${hit.name}’이(가) 있습니다.`,[]));return;}}
    pos[sel.id]={day,start}; sel=null; msg.innerHTML=''; draw();
  }
  draw();
  return {el:wrap,pos:id=>pos[id]||null,all,stats,placedAll:ids=>ids.every(id=>pos[id]),
    lock(){locked=true;sel=null;draw();},unlock(){locked=false;draw();}};
}

    { name:'외출할 때', instr:'외출할 때 약 관리 방법으로 알맞은 것을 모두 고르세요.', hint:'',
      render(body,c,d,done){

  summarize(d){ return sumCheck(d,'mt','투약표').concat([{label:'투약표 내용',ok:null,detail:d.mtTxt||'-'},
    {label:'진통제 다음 복용 시각 (첫 답)',ok:!!d.painFirst?.ok,detail:d.painAns!=null?fmt(d.painAns):'-'},

{
  id:'money', no:7, title:'월간 생활비 계획하기', tag:'예산관리', tagClass:'tag-budget',
  desc:'남은 생활비를 계산하고 항목별로 나눈 뒤 한 주 식비를 계산합니다.',
  init(){ const m=pick([1200000,1500000,1800000]),f=pick([600000,700000,800000]); return {m,f,rem:m-f}; },

  steps:[
    { name:'남은 금액 계산', instr:'고정 지출을 빼고 남은 금액은 얼마인가요?', hint:'숫자를 눌러 입력하세요.',
      render(body,c,d,done){ const np=numPad('원');
        body.append(np.el,checker('확인',{d,key:'rem',done,lock:np.lock,unlock:np.unlock,evaluate(){
          const v=np.get(); if(!v) return {incomplete:'금액을 입력해 주세요.'}; d.remAns=v; const ok=v===c.rem;
          return {ok,title:ok?'맞습니다.':`${won(v)}은(는) 맞지 않습니다.`,lines:[`${won(c.m)} − ${won(c.f)} = <b>${won(c.rem)}</b>`]};
        }})); }},
    { name:'항목별 배분', instr:'', hint:'버튼으로 금액을 조절하세요. 예상치 못한 지출에 대비한 비상금도 정해 두세요.',
      render(body,c,d,done,api){
        api.setInstr(`남은 ${won(c.rem)}을 항목별로 나누세요.`);
        const CAT=['식비','의료비','교통비','여가 활동비','비상금']; const v=CAT.map(()=>0); let locked=false;
        const box=h('div'), tot=h('div',{class:'total'});
        function draw(){ box.innerHTML='';
          CAT.forEach((k,i)=>box.append(h('div',{class:'est-row'},h('span',{class:'nm'},k),h('div',{class:'qty'},
            ...[-50000,-10000].map(s=>h('button',{class:'qb',onclick:()=>{if(locked)return;v[i]=Math.max(0,v[i]+s);draw();}},s===-50000?'−5만':'−1만')),
            h('b',{class:'amt'},won(v[i])),
            ...[10000,50000].map(s=>h('button',{class:'qb',onclick:()=>{if(locked)return;v[i]+=s;draw();}},s===50000?'+5만':'+1만'))))));
          const t=v.reduce((a,b)=>a+b,0); tot.textContent=`나눈 금액 합계 ${won(t)} / 남은 돈 ${won(c.rem-t)}`; }

        body.append(box,tot,checker('배분 확인',{d,key:'alloc',done,lock(){locked=true;box.classList.add('locked');},unlock(){locked=false;box.classList.remove('locked');},evaluate(){
          const t=v.reduce((a,b)=>a+b,0); d.allocV=v.slice(); d.allocTxt=CAT.map((k,i)=>`${k} ${won(v[i])}`).join(', ');
          return critResult([crit(`나눈 합계가 남은 금액(${won(c.rem)})과 같음`,t===c.rem),crit('비상금을 정해 둠',v[4]>0),crit('식비와 의료비를 포함함',v[0]>0&&v[1]>0)]);
        }}));

    { name:'주별 식비', instr:'', hint:'숫자를 눌러 입력하세요.',
      render(body,c,d,done,api){

        const np=numPad('원');
        body.append(np.el,checker('확인',{d,key:'week',done,lock:np.lock,unlock:np.unlock,evaluate(){
          const x=np.get(); d.weekAns=x; const ok=x===food/4;
          return {ok,title:ok?'맞습니다.':`${won(x)}은(는) 맞지 않습니다.`,lines:[`${won(food)} ÷ 4 = <b>${won(food/4)}</b>`]};
        }})); }},
  ],
  questions:['어떤 항목에 우선순위를 두었나요? 그 이유는 무엇인가요?','예산을 초과하게 된다면 어떤 항목을 조정할 계획인가요?','남은 금액이 생긴다면 어떻게 활용할 계획인가요?'],
  summarize(d,c){ return [{label:'남은 금액 계산 (첫 답)',ok:!!d.remFirst?.ok,detail:`답 ${d.remAns!=null?won(d.remAns):'-'} / 정답 ${won(c.rem)}`}]

  desc:'평소 하루 일과에 약속 3개와 이동 시간을 넣고, 겹치는 일과를 옮깁니다.',
  init(){ return {day:pick(DAYN)}; },

    <p>이번 주 <b>${c.day}</b>에 추가 약속:</p><ul><li>오전 10시: 치과 진료 (1시간)</li><li>오후 1시: 은행 방문 (1시간)</li><li>오후 4시: 친구 만남 (2시간)</li></ul><p>각 장소까지는 약 <b>30분</b>이 걸립니다.</p>`; },
  steps:[
    { name:'하루 일정표', instr:'', hint:'이동 시간을 약속 앞뒤에 넣으세요. 약속과 겹치는 일과는 눌러서 빼낸 뒤 다른 시간에 다시 넣으세요. 약속은 옮길 수 없습니다.',
      render(body,c,d,done,api){
        api.setInstr(`이동 시간을 포함해 ${c.day} 전체 일정표를 완성하세요.`);
        const R=[['wake','기상',420,30],['bf','아침 식사·약',450,60],['st','스트레칭',510,30],['ln','점심 식사·약',690,60],['nap','낮잠',840,30],['dn','저녁 식사·약',1050,60],['sl','취침',1320,30]];
        const items=R.map(([id,name,s,dur])=>({id,name,dur,cls:'rt',at:{day:0,start:s}})).concat([1,2,3,4,5,6].map(i=>({id:'mv'+i,name:'이동',dur:30})));
        const fixed=[{id:'dt',name:'치과 진료',day:0,start:600,dur:60,cls:'med'},{id:'bk',name:'은행 방문',day:0,start:780,dur:60,cls:'med'},{id:'fr',name:'친구 만남',day:0,start:960,dur:120,cls:'med'}];
        const pl=planner({cols:[c.day.slice(0,1)],colNames:[c.day],start:420,end:1350,items,fixed});
        body.append(pl.el,checker('일정표 확인',{d,key:'rt',done,lock:pl.lock,unlock:pl.unlock,evaluate(){
          const mv=[1,2,3,4,5,6].map(i=>pl.pos('mv'+i)).filter(Boolean);
          if(mv.length<6) return {incomplete:`이동 시간을 6번 모두 넣어 주세요. (지금 ${mv.length}번)`};
          const bl=pl.all(); let clash=false; for(let i=0;i<bl.length;i++)for(let j=i+1;j<bl.length;j++) if(overlap(bl[i],bl[j])) clash=true;
          const travelOk=fixed.every(f=>mv.some(m=>m.start===f.start-30)&&mv.some(m=>m.start===f.start+f.dur));
          const dn=pl.pos('dn');
          d.rtTxt=bl.sort((a,b)=>a.start-b.start).map(x=>`${fmt(x.start)} ${x.name}`).join(', ');
          return critResult([crit('약속마다 앞뒤로 이동 시간 30분',travelOk),crit('겹치는 일정 없음',!clash),
            crit('일과(식사·약·낮잠 등)를 빼먹지 않고 모두 유지',R.every(r=>pl.pos(r[0]))),
            crit('저녁 식사·약을 오후 5시~8시 사이에 시작',!!dn&&dn.start>=1020&&dn.start<=1200)]);
        }}));
      }},
  ],
  questions:['일상 루틴 중 어떤 부분을 조정했나요? 그 이유는 무엇인가요?','약속 사이에 충분한 휴식 시간을 확보했나요?','이런 바쁜 날 컨디션 관리를 위한 전략은 무엇인가요?'],
  summarize(d){ return sumCheck(d,'rt','하루 일정표').concat([{label:'완성한 일정표',ok:null,detail:d.rtTxt||'-'}]); }

      render(body,c,d,done){ d.keep={}; const r=rowsAsk(c.ap.map(a=>({key:a[0],label:a[1],options:['꼭 유지','변경 가능']})),d.keep);
        body.append(r.el,checker('확인',{d,key:'keepc',done,lock:r.lock,unlock:r.unlock,evaluate(){
          if(!r.all()) return {incomplete:'모든 약속을 나눠 주세요.'};
          return critResult(c.ap.map(a=>crit(`${a[1].split(':')[1].trim()} → ${a[2]?'꼭 유지 (건강 관련)':'변경 가능'}`,(d.keep[a[0]]==='꼭 유지')===!!a[2])));
        }})); }},
    { name:'대안 정하기', instr:'변경 가능한 약속을 각각 어떻게 할지 고르세요.', hint:'',
      render(body,c,d,done){
        const OPT=['날씨 좋은 날로 미룬다','전화·영상 통화로 대신한다','미리 연락해 취소한다','연락 없이 가지 않는다'];
        const list=c.ap.filter(a=>d.keep[a[0]]==='변경 가능'); d.alt={};
        if(!list.length){ body.append(h('p',{class:'hint'},'변경 가능으로 고른 약속이 없습니다. 다음 단계로 넘어가세요.')); done(); return; }
        const r=rowsAsk(list.map(a=>({key:a[0],label:a[1].split(':')[1].trim(),options:OPT})),d.alt);
        body.append(r.el,checker('확인',{d,key:'altc',done,lock:r.lock,unlock:r.unlock,evaluate(){
          if(!r.all()) return {incomplete:'모든 약속의 대안을 골라 주세요.'};
          return critResult(list.map(a=>crit(`${a[1].split(':')[1].trim()}: ${d.alt[a[0]]}`,d.alt[a[0]]!==OPT[3])),['약속을 바꿀 때는 상대에게 미리 연락합니다.']);
        }})); }},
    { name:'이동 시간 계산', instr:'평소 재활센터까지 30분 걸립니다. 눈이 와서 2배가 걸린다면, 월요일 오전 9시에 늦지 않으려면 몇 시에 출발해야 하나요?', hint:'버튼으로 시각을 맞춘 뒤 확인을 누르세요.',
      render(body,c,d,done){ const cp=clockPicker(540);
        body.append(cp.el,checker('확인',{d,key:'go',done,lock:cp.lock,unlock:cp.unlock,evaluate(){
          const t=cp.get(); d.goAns=t; const ok=t<=480&&t>=450;
          return {ok,title:ok?'맞습니다.':`${fmt(t)}에 출발하면 ${t>480?'늦습니다.':'너무 이릅니다.'}`,lines:['30분 × 2 = 1시간이므로 늦어도 <b>오전 8시</b>에 출발합니다.']};
        }})); }},
    { name:'눈길 대비', instr:'눈이 올 때 이동을 위한 준비로 알맞은 것을 모두 고르세요.', hint:'',
      render(body,c,d,done){
        const OPT=['미끄럼 방지 신발을 신는다','평소보다 일찍 출발한다','택시나 가족 차량을 미리 알아 둔다','일기예보를 미리 확인한다','평소와 같은 시간에 출발한다','늦을까 봐 눈길을 서둘러 걷는다'], GOOD=[0,1,2,3];
        const mp=multiPick(OPT);
        body.append(mp.el,checker('확인',{d,key:'prep',done,lock:mp.lock,unlock:mp.unlock,evaluate(){
          const s=mp.get(); if(!s.size) return {incomplete:'하나 이상 골라 주세요.'};
          return critResult(OPT.map((o,i)=>crit(`${o} → ${GOOD.includes(i)?'알맞음':'알맞지 않음'}`,s.has(i)===GOOD.includes(i))));
        }})); }},
  ],
  questions:['어떤 약속을 필수적으로 유지해야 한다고 판단했나요? 이유는?','날씨로 인한 불확실성에 대비하기 위해 어떤 전략을 사용했나요?','갑작스러운 기상 악화로 외출이 불가능해질 경우의 대비책은 무엇인가요?'],
  summarize(d,c){ return sumCheck(d,'keepc','약속 나누기').concat(d.altc?sumCheck(d,'altc','대안 정하기'):[],
    [{label:'눈 오는 날 출발 시각 (첫 답)',ok:!!d.goFirst?.ok,detail:d.goAns!=null?fmt(d.goAns):'-'}],sumCheck(d,'prep','눈길 대비')); }
},
// ── 12. 가족 생일 모임 계획하기 ───────────────
{
  id:'party', no:12, title:'가족 생일 모임 계획하기', tag:'시간계획', tagClass:'tag-plan',
  desc:'5일 준비 계획, 식이 제한을 고려한 메뉴, 당일 진행 순서를 정합니다.',
  init(){ return {}; },
  situation(){ return `<p>다음 주 토요일은 배우자의 생일입니다.</p><p>15명의 가족과 친구들을 초대하여 집에서 특별한 생일 모임을 열기로 했습니다.</p>
    <p>손님 중:</p><ul><li>2명은 음식 알레르기 (견과류, 해산물)</li><li>3명은 당뇨가 있어 설탕 섭취 제한 필요</li></ul>`; },
  steps:[
    { name:'5일 준비 계획', instr:'준비할 일을 생일 며칠 전에 할지 정하세요.', hint:'',
      render(body,c,d,done){
        const DAYS5=['5일 전','4일 전','3일 전','2일 전','1일 전'];
        const T=[['inv','손님에게 초대 연락하기'],['menu','메뉴 정하기'],['list','장보기 목록 만들기'],['shop','장보기'],['clean','집 청소하기'],['cook','음식 미리 만들기'],['deco','장식 준비하기']];
        d.p5={}; const r=rowsAsk(T.map(([k,l])=>({key:k,label:l,options:DAYS5})),d.p5);
        body.append(r.el,checker('계획 확인',{d,key:'p5c',done,lock:r.lock,unlock:r.unlock,evaluate(){
          if(!r.all()) return {incomplete:'모든 일의 날짜를 정해 주세요.'};
          const I=k=>DAYS5.indexOf(d.p5[k]);
          return critResult([crit('초대 연락은 4일 전까지',I('inv')<=1),crit('메뉴 → 장보기 목록 → 장보기 순서',I('menu')<=I('list')&&I('list')<=I('shop')),
            crit('장보기를 한 뒤에 음식 만들기',I('shop')<=I('cook')),crit('음식은 2일 전 이후에 만들기 (신선도)',I('cook')>=3)]);
        }}));
      }},
    { name:'메뉴 고르기', instr:'모든 손님을 배려해서 메뉴 5가지를 고르세요.', hint:'',
      render(body,c,d,done){
        const M=[['불고기',''],['잡채',''],['갈비찜',''],['나물 비빔밥',''],['새우튀김','sea'],['해물파전','sea'],['견과류 샐러드','nut'],['호두파이','nut sug'],['생크림 케이크','sug'],['과일 화채',''],['무설탕 떡','dia'],['과일 모둠','dia']];
        const mp=multiPick(M.map(m=>m[0]));
        body.append(mp.el,checker('메뉴 확인',{d,key:'menuc',done,lock:mp.lock,unlock:mp.unlock,evaluate(){
          const s=[...mp.get()]; if(s.length!==5) return {incomplete:`5가지를 골라 주세요. (지금 ${s.length}가지)`};
          d.menuTxt=s.map(i=>M[i][0]).join(', ');
          const allergy=s.filter(i=>/sea|nut/.test(M[i][1]));
          const lines=allergy.map(i=>`<span class="badc">${M[i][0]}</span>: ${/sea/.test(M[i][1])?'해산물':'견과류'} 알레르기 손님이 먹을 수 없습니다.`);
          return {...critResult([crit('알레르기(견과류·해산물) 메뉴 없음',!allergy.length),crit('당뇨 손님이 먹을 수 있는 디저트 포함 (무설탕 떡·과일 모둠)',s.some(i=>M[i][1]==='dia'))],lines)};
        }}));
      }},
    { name:'당일 진행 순서', instr:'생일 모임 당일 진행 순서를 정하세요.', hint:'카드를 끌어서 다른 카드 위에 놓으면 그 자리로 옮겨집니다.',
      render(body,c,d,done){
        const o=orderer(shuffle(['손님 맞이','함께 식사','생일 케이크와 축하','함께하는 게임·활동','손님 배웅']),()=>{});
        body.append(o.el,checker('순서 확인',{d,key:'ord',done,lock:o.lock,unlock:o.unlock,evaluate(){
          const a=o.get(); d.ordTxt=a.join(' → ');
          return critResult([crit('손님 맞이가 처음',a[0]==='손님 맞이'),crit('손님 배웅이 마지막',a[4]==='손님 배웅'),crit('식사를 한 뒤 케이크와 축하',a.indexOf('함께 식사')<a.indexOf('생일 케이크와 축하'))]);
        }}));
      }},
  ],
  questions:['필요한 물품은 무엇이며 언제 사겠습니까?','모임 중 어떤 간단한 활동이나 게임을 하겠습니까?','다양한 식이 제한을 가진 손님들을 어떻게 배려했나요?','모임 중 피로해질 경우를 대비한 계획은 무엇인가요?','준비 과정에서 도움이 필요한 부분은 어떻게 해결할 계획인가요?'],
  summarize(d){ return sumCheck(d,'p5c','5일 준비 계획').concat(sumCheck(d,'menuc','메뉴'),[{label:'고른 메뉴 (최종)',ok:null,detail:d.menuTxt||'-'}],sumCheck(d,'ord','당일 진행 순서'),[{label:'진행 순서 (최종)',ok:null,detail:d.ordTxt||'-'}]); }
},
// ── 13. 주택 수리 계획 및 예산 관리 ───────────
{
  id:'repair', no:13, title:'주택 수리 계획 및 예산 관리', tag:'예산관리', tagClass:'tag-budget',
  desc:'수리 우선순위를 정하고 예산 안에서 고른 뒤 기간과 추가 비용을 계산합니다.',
  init(){ return {R:[{id:'k',name:'부엌 싱크대',cost:1500000,days:3},{id:'s',name:'화장실 샤워 부스',cost:1200000,days:2},{id:'e',name:'현관 계단',cost:800000,days:1}],budget:3000000}; },
  situation(c){ return `<p>집의 여러 부분에 수리가 필요합니다.</p><p>수리 예산으로 <b>${won(c.budget)}</b>이 있으며, 모든 수리를 한 번에 할 수는 없습니다.</p><p>수리 견적:</p><ul>${c.R.map(r=>`<li>${r.name}: ${won(r.cost)} (${r.days}일 소요)</li>`).join('')}</ul>`; },
  steps:[
    { name:'우선순위', instr:'가장 먼저 해야 할 수리부터 순서대로 놓으세요.', hint:'카드를 끌어서 다른 카드 위에 놓으면 그 자리로 옮겨집니다. 이유는 치료사에게 말로 설명해 주세요.',
      render(body,c,d,done){ const o=orderer(shuffle(c.R.map(r=>r.name)),()=>{});
        body.append(o.el,h('div',{class:'row'},h('button',{class:'big-btn b-pri',onclick:e=>{d.prio=o.get().join(' → ');o.lock();e.target.style.display='none';done();}},'순서 정하기'))); }},
    { name:'수리 고르기', instr:'예산 안에서 이번에 할 수리를 고르세요.', hint:'금액을 직접 더해 보고 고르세요.',
      render(body,c,d,done){ const mp=multiPick(c.R.map(r=>`${r.name} ${won(r.cost)}`));
        body.append(mp.el,checker('확인',{d,key:'sel',done,lock:mp.lock,unlock:mp.unlock,evaluate(){
          const s=[...mp.get()]; if(!s.length) return {incomplete:'하나 이상 골라 주세요.'};
          const tot=s.reduce((a,i)=>a+c.R[i].cost,0); d.selIdx=s; d.selTot=tot;
          return {...critResult([crit(`합계 ${won(tot)} — 예산 ${won(c.budget)} 안`,tot<=c.budget)]),lines:[`고른 수리: ${s.map(i=>c.R[i].name).join(', ')}`,`합계 ${won(tot)}`]};
        }})); }},
    { name:'수리 기간', instr:'고른 수리를 차례로 모두 하면 며칠이 걸리나요?', hint:'',
      render(body,c,d,done){ const days=d.selIdx.reduce((a,i)=>a+c.R[i].days,0); d.dy={};
        const r=rowsAsk([{key:'q',label:'수리 기간',options:shufOpts(days,[days+1,days-1>0?days-1:days+2,days+2,6]),fmt:v=>v+'일'}],d.dy);
        body.append(r.el,checker('확인',{d,key:'dayc',done,lock:r.lock,unlock:r.unlock,evaluate(){
          if(!r.all()) return {incomplete:'답을 골라 주세요.'}; const ok=d.dy.q===days;
          return {ok,title:ok?'맞습니다.':'다시 계산해 보세요.',lines:[`${d.selIdx.map(i=>c.R[i].days+'일').join(' + ')} = <b>${days}일</b>`]};
        }})); }},
    { name:'추가 비용', instr:'', hint:'숫자를 눌러 입력하세요.',
      render(body,c,d,done,api){ const tot=d.selTot, add=Math.round(tot*1.2);
        api.setInstr(`고른 수리(${won(tot)})에 20% 추가 비용이 생기면 모두 얼마인가요?`);
        const np=numPad('원'); d.ov={};
        const r=rowsAsk([{key:'q',label:'추가 비용이 예산을 넘으면 어떻게 하겠습니까?',options:['비용이 적은 수리를 다음으로 미룬다','추가 예산을 마련할 방법을 찾는다','수리를 중간에 멈추게 한다']}],d.ov);
        body.append(np.el,r.el,checker('확인',{d,key:'extra',done,lock(){np.lock();r.lock();},unlock(){np.unlock();r.unlock();},evaluate(){
          const v=np.get(); if(!v||!r.all()) return {incomplete:'금액을 입력하고 대응 방법을 골라 주세요.'}; d.extraAns=v;
          return critResult([crit(`${won(tot)} × 1.2 = ${won(add)}`,v===add),crit(`대응 방법: ${d.ov.q}`,d.ov.q!=='수리를 중간에 멈추게 한다')],[`예산 ${won(c.budget)}을 ${add>c.budget?`${won(add-c.budget)} 넘습니다.`:'넘지 않습니다.'}`]);
        }})); }},
  ],
  questions:['우선순위를 결정할 때 어떤 요소를 고려했나요?','예산 제약 내에서 어떻게 최대한의 수리를 계획했나요?','수리 기간 동안 일상생활을 어떻게 조정하겠습니까?','수리 중 발생할 수 있는 불편함을 어떻게 최소화할 계획인가요?'],
  summarize(d,c){ return [{label:'우선순위',ok:null,detail:d.prio||'-'}].concat(sumCheck(d,'sel','예산 안에서 고르기'),
    [{label:'고른 수리 (최종)',ok:null,detail:(d.selIdx||[]).map(i=>c.R[i].name).join(', ')},{label:'수리 기간 계산 (첫 답)',ok:!!d.daycFirst?.ok,detail:d.dy?.q!=null?d.dy.q+'일':'-'}],sumCheck(d,'extra','추가 비용')); }
},
// ── 14. 지역사회 활동 참여 계획하기 ───────────
{
  id:'community', no:14, title:'지역사회 활동 참여 계획하기', tag:'시간계획', tagClass:'tag-plan',
  desc:'참여할 프로그램을 골라 주간 시간표에 넣고 준비물을 챙깁니다.',
  init(){ return {P:[{id:'ex',name:'시니어 체조',days:[0,2,4],start:600,dur:60,item:'편한 운동복과 운동화'},{id:'gd',name:'원예 치료',days:[1,3],start:840,dur:90,item:'장갑과 모자'},
    {id:'bk',name:'독서 모임',days:[2],start:900,dur:120,item:'읽을 책과 돋보기 안경'},{id:'ck',name:'요리 교실',days:[3],start:660,dur:120,item:'앞치마와 위생모'},{id:'wk',name:'산책 모임',days:[5],start:540,dur:60,item:'운동화와 물병'}]}; },
  situation(c){ const D=['월','화','수','목','금','토']; return `<p>지역 센터에서 다음과 같은 프로그램을 제공합니다.</p><ul>${c.P.map(p=>`<li>${p.days.map(x=>D[x]).join('/')} ${fmt(p.start)}: ${p.name} (${durTxt(p.dur)})</li>`).join('')}</ul>`; },
  steps:[
    { name:'프로그램 고르기', instr:'참여하고 싶은 프로그램을 2~3개 고르세요.', hint:'고른 이유는 치료사에게 말로 설명해 주세요.',
      render(body,c,d,done){ const mp=multiPick(c.P.map(p=>p.name)); const out=h('div');
        const b=h('button',{class:'big-btn b-pri',onclick:()=>{const s=[...mp.get()];out.innerHTML='';
          if(s.length<2||s.length>3){out.append(fbBox('warn',`2~3개를 골라 주세요. (지금 ${s.length}개)`,[]));return;}
          d.chosen=s; mp.lock(); b.style.display='none'; done();}},'선택 완료');
        body.append(mp.el,h('div',{class:'row'},b),out); }},
    { name:'주간 시간표', instr:'고른 프로그램을 주간 시간표에 모두 넣으세요.', hint:'프로그램을 누른 뒤 시간표 칸을 누르세요. 여러 요일에 하는 프로그램은 요일마다 넣습니다.',
      render(body,c,d,done){
        const ch=d.chosen.map(i=>c.P[i]); const items=[];
        ch.forEach(p=>p.days.forEach((_,k)=>items.push({id:p.id+k,pid:p.id,name:p.name,dur:p.dur})));
        const pl=planner({cols:['월','화','수','목','금','토'],colNames:['월요일','화요일','수요일','목요일','금요일','토요일'],start:540,end:1080,items});
        body.append(pl.el,checker('시간표 확인',{d,key:'tt',done,lock:pl.lock,unlock:pl.unlock,evaluate(){
          if(!pl.placedAll(items.map(x=>x.id))) return {incomplete:'아직 넣지 않은 프로그램이 있습니다.'};
          const D=['월','화','수','목','금','토'];
          return critResult(ch.map(p=>{const ps=items.filter(x=>x.pid===p.id).map(x=>pl.pos(x.id));

  summarize(d,c){ return [{label:'고른 프로그램',ok:null,detail:(d.chosen||[]).map(i=>c.P[i].name).join(', ')}].concat(sumCheck(d,'tt','주간 시간표'),sumCheck(d,'itc','준비물')); }

{

        }}));

    { name:'이동 방법', instr:'나의 약속마다 어떻게 갈지 고르세요.', hint:'자녀의 근무 시간과 배우자 일정을 확인하세요.',
      render(body,c,d,done){ const OPT=['배우자가 운전해 준다','자녀가 운전해 준다','택시·대중교통을 이용한다','혼자 운전한다']; d.tr={};

{

  init(){ return {A:[{id:'dr',name:'의사 진료',time:'오전 9시',dur:60,out:1},{id:'bk',name:'은행 서류 제출 (마감일)',time:'오전 11시',dur:30,out:1},{id:'sh',name:'손자 학교 발표회',time:'오후 1시',dur:120,out:1},{id:'nb',name:'이웃 주민 모임',time:'오후 4시',dur:90,out:1},{id:'dn',name:'저녁 식사 준비',time:'',dur:60,out:0}]}; },

{
  id:'balance', no:19, title:'건강 이슈와 사회적 약속 균형 맞추기', tag:'우선순위', tagClass:'tag-prior',
  desc:'피로한 한 주의 약속을 평가하고, 조정할 약속과 알리는 방법을 정합니다.',
  init(){ return {A:[{id:'th',name:`${pick(THERAPY)} (월요일 오전 9시)`,h:1},{id:'fr',name:'오랜 친구와의 만남 (화요일 오후)',h:0},{id:'dr',name:`${pick(HOSPITALS)} 정기 진료 (수요일 오전 10시)`,h:1},{id:'fm',name:'가족 식사 모임 (목요일)',h:0},{id:'vl',name:'동네 주민 봉사 활동 (금요일)',h:0}]}; },
  situation(c){ return `<p>최근 건강이 좋지 않아 피로감이 심합니다. 이번 주에 다음과 같은 약속들이 있습니다.</p><ul>${c.A.map(a=>`<li>${a.name}</li>`).join('')}</ul><p>모든 약속을 지키면 과로가 예상됩니다.</p>`; },
  steps:[
    { name:'약속 성격', instr:'각 약속이 어떤 성격인지 고르세요.', hint:'정답은 없습니다. 생각한 이유를 치료사에게 말해 주세요.',
      render(body,c,d,done){ d.kind={}; const r=rowsAsk(c.A.map(a=>({key:a.id,label:a.name,options:['건강','사회적 의무','개인 의지']})),d.kind,()=>{if(r.all())done();}); body.append(r.el); }},
    { name:'유지·조정', instr:'건강을 가장 먼저 생각해서 유지할 약속과 조정할 약속을 정하세요.', hint:'',
      render(body,c,d,done){ d.keep={}; const r=rowsAsk(c.A.map(a=>({key:a.id,label:a.name,options:['유지','조정 (미루기·줄이기·취소)']})),d.keep);
        body.append(r.el,checker('확인',{d,key:'kp',done,lock:r.lock,unlock:r.unlock,evaluate(){
          if(!r.all()) return {incomplete:'모든 약속을 정해 주세요.'};
          const adj=c.A.filter(a=>d.keep[a.id]!=='유지');
          return critResult([crit('건강 관련 약속(치료·진료) 유지',c.A.filter(a=>a.h).every(a=>d.keep[a.id]==='유지')),crit('과로를 줄이려 약속을 1개 이상 조정',adj.length>=1)]);
        }})); }},
    { name:'알리는 방법', instr:'조정한 약속의 상대방에게 어떻게 알리겠습니까?', hint:'',
      render(body,c,d,done){ const adj=c.A.filter(a=>d.keep[a.id]&&d.keep[a.id]!=='유지'); d.say={};
        if(!adj.length){body.append(h('p',{class:'hint'},'조정한 약속이 없습니다. 다음 단계로 넘어가세요.'));done();return;}
        const OPT=['건강 사정을 솔직하게 말하고 다음 약속을 정한다','다른 핑계를 대며 둘러댄다','아무 말 없이 가지 않는다'];
        const r=rowsAsk(adj.map(a=>({key:a.id,label:a.name,options:OPT})),d.say);
        body.append(r.el,checker('확인',{d,key:'sayc',done,lock:r.lock,unlock:r.unlock,evaluate(){
          if(!r.all()) return {incomplete:'모든 약속의 알리는 방법을 골라 주세요.'};
          return critResult(adj.map(a=>crit(`${a.name}: ${d.say[a.id]}`,d.say[a.id]===OPT[0])));
        }})); }},
    { name:'에너지 아끼기', instr:'남은 약속을 덜 지치게 하는 방법으로 알맞은 것을 모두 고르세요.', hint:'',
      render(body,c,d,done){ const OPT=['약속 시간을 짧게 줄인다','약속 사이에 쉬는 날을 둔다','가까운 곳에서 만나자고 한다','무리해도 끝까지 다 지킨다','잠을 줄여 시간을 낸다'], GOOD=[0,1,2];
        const mp=multiPick(OPT);
        body.append(mp.el,checker('확인',{d,key:'en',done,lock:mp.lock,unlock:mp.unlock,evaluate(){
          const s=mp.get(); if(!s.size) return {incomplete:'하나 이상 골라 주세요.'};
          return critResult(OPT.map((o,i)=>crit(`${o} → ${GOOD.includes(i)?'알맞음':'알맞지 않음'}`,s.has(i)===GOOD.includes(i))));
        }})); }},
  ],
  questions:['건강과 사회적 책임 사이에서 어떻게 균형을 잡았나요?','약속을 취소하거나 변경할 때 어떤 감정이 생길 수 있고 어떻게 관리할까요?','앞으로 비슷한 상황을 예방하기 위해 어떻게 일정을 관리할 수 있을까요?'],
  summarize(d,c){ return [{label:'약속 성격',ok:null,detail:c.A.map(a=>`${a.name} ${d.kind?.[a.id]||'-'}`).join(', ')}].concat(sumCheck(d,'kp','유지·조정'),d.sayc?sumCheck(d,'sayc','알리는 방법'):[],sumCheck(d,'en','에너지 아끼기')); }
}
);
ACTS.sort((a,b)=>a.no-b.no);

// ══ 화면 흐름 ══════════════════════════════════════════
const S={results:{}};
let RUN=null, TIMER=null;
const RATE=['적절','부분 적절','부적절'];

function go(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById('scr-'+name).classList.add('on');
  window.scrollTo(0,0);
  if(name==='home') renderHome();
}

function renderHome(){
  const box=document.getElementById('act-list'); box.innerHTML='';
  ACTS.forEach(a=>{
    const r=S.results[a.id];
    box.append(h('button',{class:'act-card'+(r?' done':''),onclick:()=>openActivity(a)},
      h('span',{class:'tag '+a.tagClass},a.tag),
      h('div',{class:'t'},`${a.no}. ${a.title}`),
      h('div',{class:'d'},a.desc),
      r?h('div',{class:'st'},`완료 · ${mmss(r.elapsed)} · 다시 하려면 누르세요`):null));
  });
  document.getElementById('btn-report').disabled=!Object.keys(S.results).length;
}

function openActivity(act){
  const ctx=act.init();
  const steps=[...act.steps,{name:'생각 나누기',instr:'아래 질문에 말로 답해 보세요.',hint:'치료사가 답변을 듣고 평가를 눌러 주세요.',render:renderQuestions,isQ:true}];
  RUN={act,ctx,steps,i:0,data:{},ratings:act.questions.map(()=>null),memo:'',t0:Date.now()};
  document.getElementById('a-title').textContent=`${act.no}. ${act.title}`;
  document.getElementById('a-situ').innerHTML='<div class="h">상황</div>'+act.situation(ctx);
  clearInterval(TIMER);
  TIMER=setInterval(()=>{document.getElementById('a-timer').textContent=mmss(Date.now()-RUN.t0);},1000);
  document.getElementById('a-timer').textContent='0:00';
  go('act'); renderStep();
}

function renderStep(){
  const {steps,i}=RUN, st=steps[i];
  const bar=document.getElementById('a-steps'); bar.innerHTML='';
  steps.forEach((s,k)=>bar.append(h('span',{class:'step-pill'+(k===i?' cur':k<i?' past':'')},`${k+1}. ${s.name}`)));
  document.getElementById('a-instr').textContent=st.instr;
  document.getElementById('a-hint').textContent=st.hint||'';
  const body=document.getElementById('a-body'); body.innerHTML='';
  const nx=document.getElementById('a-next');
  nx.disabled=true; nx.textContent=i===steps.length-1?'활동 마치기':'다음 단계';
  nx.onclick=()=>{ if(i===steps.length-1) finishActivity(); else {RUN.i++;renderStep();window.scrollTo(0,0);} };
  const api={setInstr:t=>{document.getElementById('a-instr').textContent=t;}};
  st.render(body,RUN.ctx,RUN.data,()=>{nx.disabled=false;},api);
}

function renderQuestions(body,c,d,done){
  const box=h('div');
  const draw=()=>{ box.innerHTML='';
    RUN.act.questions.forEach((q,k)=>box.append(h('div',{class:'q'},h('div',{class:'qt'},`${k+1}. ${q}`),
      (()=>{const s=h('div',{class:'seg'});RATE.forEach((r,ri)=>s.append(h('button',{class:(RUN.ratings[k]===ri?'on r'+ri:''),onclick:()=>{RUN.ratings[k]=RUN.ratings[k]===ri?null:ri;draw();}},r)));return s;})())));
  };
  draw();
  const memo=h('textarea',{placeholder:'치료사 메모 (관찰 내용, 단서 제공 등)',oninput:e=>{RUN.memo=e.target.value;}});
  memo.value=RUN.memo;
  body.append(box,h('div',{class:'lbl'},'메모'),memo);
  done();
}

function finishActivity(){
  clearInterval(TIMER);
  const {act,ctx,data,ratings,memo,t0}=RUN;
  S.results[act.id]={elapsed:Date.now()-t0,items:act.summarize(data,ctx),ratings:ratings.slice(),memo,
    questions:act.questions.slice(),ctx,at:new Date()};
  RUN=null; go('home');
}

function leaveActivity(){
  if(RUN && !confirm('지금 나가면 이 활동의 진행 내용이 저장되지 않습니다. 나갈까요?')) return;
  clearInterval(TIMER); RUN=null; go('home');
}

function showReport(){
  const b=document.getElementById('rep-body'); b.innerHTML='';
  const name=document.getElementById('pname').value.trim();
  const done=ACTS.filter(a=>S.results[a.id]);
  let pass=0,tot=0;
  done.forEach(a=>S.results[a.id].items.forEach(it=>{if(it.ok!==null){tot++;if(it.ok)pass++;}}));
  b.append(h('h2',null,'IADL 시나리오 훈련 결과'),
    h('div',{class:'meta'},`환자명: ${name||'—'}　날짜: ${todayStr()}　완료 활동: ${done.length}/${ACTS.length}　자동 판정 통과: ${pass}/${tot}`));
  done.forEach(a=>{
    const r=S.results[a.id];
    b.append(h('div',{class:'act-h'},h('b',null,`${a.no}. ${a.title} (${a.tag})`),h('span',null,`소요 ${mmss(r.elapsed)}`)));
    const t=h('table',null,h('tr',null,h('th',{style:'width:34%'},'항목'),h('th',{style:'width:12%'},'판정'),h('th',null,'내용')));
    r.items.forEach(it=>t.append(h('tr',null,h('td',null,it.label),
      h('td',{class:it.ok===null?'na':it.ok?'pass':'fail'},it.ok===null?'기록':it.ok?'통과':'확인 필요'),h('td',{html:it.detail||''}))));
    b.append(t);
    const q=h('table',null,h('tr',null,h('th',null,'질문'),h('th',{style:'width:18%'},'치료사 평가')));
    r.questions.forEach((qq,k)=>q.append(h('tr',null,h('td',null,qq),h('td',null,r.ratings[k]==null?'—':RATE[r.ratings[k]]))));
    b.append(q);
    if(r.memo) b.append(h('div',null,h('b',null,'메모: '),r.memo));
  });
  b.append(h('p',{class:'hint',style:'margin-top:12px'},'자동 판정은 화면 수행 결과 기준이며, 질문 평가는 치료사 관찰에 따릅니다. 장보기 가격은 연습용 예시입니다.'));
  go('rep');
}

function todayStr(){const d=new Date();return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;}
document.getElementById('today').textContent=todayStr();
renderHome();
