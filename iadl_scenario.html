  questions:['어떤 약속을 필수적으로 유지해야 한다고 판단했나요? 이유는?','날씨로 인한 불확실성에 대비하기 위해 어떤 전략을 사용했나요?','갑작스러운 기상 악화로 외출이 불가능해질 경우의 대비책은 무엇인가요?'],
  summarize(d,c){ return [{label:'이번 조건',ok:null,detail:`${c.W.n} · 평소 ${c.base}분 × ${c.mult}`}].concat(sumCheck(d,'keepc','약속 나누기'),d.altc?sumCheck(d,'altc','대안 정하기'):[],
    [{label:'출발 시각 (첫 답)',ok:!!d.goFirst?.ok,detail:d.goAns!=null?`${fmt(d.goAns)} / 기준 ${fmt(c.tgt.start-c.base*c.mult)}`:'-'}],sumCheck(d,'prep','궂은 날 대비')); }
},
// ── 12. 가족 생일 모임 계획하기 ───────────────
{
  id:'party', no:12, title:'가족 생일 모임 계획하기', tag:'시간계획', tagClass:'tag-plan',
  desc:'준비 계획, 손님의 식이 제한을 고려한 메뉴, 당일 진행 순서를 정합니다. 손님 조건이 매번 바뀝니다.',
  levels:{1:'준비할 일 5가지 · 식이 제한 1가지 · 메뉴 4개',2:'준비할 일 7가지 · 알레르기 2가지 + 당뇨 · 메뉴 5개',3:'준비할 일 7가지 · 알레르기 3가지 + 당뇨 · 메뉴 6개'},
  init(level){
    const who=pick(['배우자','손주','큰딸','막내아들']), guests=pick([10,12,15,20]);
    const ALG=shuffle([['sea','해산물'],['nut','견과류'],['egg','달걀']]).slice(0,level===1?1:level===2?2:3);
    return {who,guests,ALG,dia:level>=2,menuN:level===1?4:level===2?5:6,nTask:level===1?5:7};
  },
  situation(c){ return `<p>다음 주 토요일은 <b>${c.who}</b>의 생일입니다.</p><p><b>${c.guests}명</b>의 가족과 친구들을 초대하여 집에서 생일 모임을 열기로 했습니다.</p>
    <p>손님 중:</p><ul>${c.ALG.map(a=>`<li>${a[1]} 알레르기가 있는 손님이 있습니다</li>`).join('')}${c.dia?'<li>당뇨가 있어 설탕을 줄여야 하는 손님이 있습니다</li>':''}</ul>`; },
  steps:[
    { name:'준비 계획', instr:'준비할 일을 생일 며칠 전에 할지 정하세요.', hint:'',
      render(body,c,d,done){
        const DAYS5=['5일 전','4일 전','3일 전','2일 전','1일 전'];
        let T=[['inv','손님에게 초대 연락하기'],['menu','메뉴 정하기'],['list','장보기 목록 만들기'],['shop','장보기'],['cook','음식 미리 만들기'],['clean','집 청소하기'],['deco','장식 준비하기']].slice(0,c.nTask);
        d.p5={}; const r=rowsAsk(shuffle(T).map(([k,l])=>({key:k,label:l,options:DAYS5})),d.p5);
        body.append(r.el,checker('계획 확인',{d,key:'p5c',done,lock:r.lock,unlock:r.unlock,evaluate(){
          if(!r.all()) return {incomplete:'모든 일의 날짜를 정해 주세요.'};
          const I=k=>DAYS5.indexOf(d.p5[k]);
          return critResult([crit('초대 연락은 4일 전까지',I('inv')<=1),crit('메뉴 → 장보기 목록 → 장보기 순서',I('menu')<=I('list')&&I('list')<=I('shop')),
            crit('장보기를 한 뒤에 음식 만들기',I('shop')<=I('cook')),crit('음식은 2일 전 이후에 만들기 (신선도)',I('cook')>=3)]);
        }}));
      }},
    { name:'메뉴 고르기', instr:'', hint:'',
      render(body,c,d,done,api){ api.setInstr(`모든 손님을 배려해서 메뉴 ${c.menuN}가지를 고르세요.`);
        const M=shuffle([['불고기',''],['잡채',''],['갈비찜',''],['나물 비빔밥',''],['새우튀김','sea'],['해물파전','sea'],['견과류 샐러드','nut'],['호두파이','nut sug'],
          ['생크림 케이크','sug egg'],['계란말이','egg'],['과일 화채',''],['무설탕 떡','dia'],['과일 모둠','dia'],['도토리묵 무침',''],['멸치볶음 (견과류 넣음)','nut sea']]);
        const mp=multiPick(M.map(m=>m[0]));
        body.append(mp.el,checker('메뉴 확인',{d,key:'menuc',done,lock:mp.lock,unlock:mp.unlock,evaluate(){
          const s=[...mp.get()]; if(s.length!==c.menuN) return {incomplete:`${c.menuN}가지를 골라 주세요. (지금 ${s.length}가지)`};
          d.menuTxt=s.map(i=>M[i][0]).join(', ');
          const bad=s.filter(i=>c.ALG.some(a=>M[i][1].indexOf(a[0])>=0));
          const lines=bad.map(i=>`<span class="badc">${M[i][0]}</span>: ${c.ALG.filter(a=>M[i][1].indexOf(a[0])>=0).map(a=>a[1]).join('·')} 알레르기 손님이 먹을 수 없습니다.`);
          const L=[crit(`알레르기(${c.ALG.map(a=>a[1]).join('·')}) 메뉴 없음`,!bad.length)];
          if(c.dia) L.push(crit('당뇨 손님이 먹을 수 있는 디저트 포함 (무설탕 떡·과일 모둠)',s.some(i=>M[i][1]==='dia')));
          return critResult(L,lines);
        }}));
      }},
    { name:'당일 진행 순서', instr:'생일 모임 당일 진행 순서를 정하세요.', hint:'카드를 끌어서 다른 카드 위에 놓으면 그 자리로 옮겨집니다.',
      render(body,c,d,done){
        const o=orderer(shuffle(['손님 맞이','함께 식사','생일 케이크와 축하','함께하는 게임·활동','손님 배웅']),()=>{});
        body.append(o.el,checker('순서 확인',{d,key:'ord',done,lock:o.lock,unlock:o.unlock,evaluate(){
          const a=o.get(); d.ordTxt=a.join(' → ');
          return critResult([crit('손님 맞이가 처음',a[0]==='손님 맞이'),crit('손님 배웅이 마지막',a[4]==='손님 배웅'),crit('식사를 한 뒤 케이크와 축하',a.indexOf('함께 식사')<a.indexOf('생일 케이크와 축하'))]);
        }}));
      }},
  ],
  questions:['필요한 물품은 무엇이며 언제 사겠습니까?','모임 중 어떤 간단한 활동이나 게임을 하겠습니까?','다양한 식이 제한을 가진 손님들을 어떻게 배려했나요?','모임 중 피로해질 경우를 대비한 계획은 무엇인가요?'],
  summarize(d,c){ return [{label:'이번 조건',ok:null,detail:`${c.who} 생일 · ${c.guests}명 · 알레르기 ${c.ALG.map(a=>a[1]).join('·')}${c.dia?' · 당뇨':''}`}]
    .concat(sumCheck(d,'p5c','준비 계획'),sumCheck(d,'menuc','메뉴'),[{label:'고른 메뉴 (최종)',ok:null,detail:d.menuTxt||'-'}],sumCheck(d,'ord','당일 진행 순서'),[{label:'진행 순서 (최종)',ok:null,detail:d.ordTxt||'-'}]); }
},
// ── 13. 주택 수리 계획 및 예산 관리 ───────────
{
  id:'repair', no:13, title:'주택 수리 계획 및 예산 관리', tag:'예산관리', tagClass:'tag-budget',
  desc:'수리 우선순위를 정하고 예산 안에서 고른 뒤 기간과 추가 비용을 계산합니다. 견적과 예산이 매번 바뀝니다.',
  levels:{1:'수리 3가지 · 추가 비용 10%',2:'수리 4가지 · 추가 비용 20%',3:'수리 5가지 · 추가 비용 15% 또는 25%'},
  init(level){
    const POOL=[['부엌 싱크대',12,18,2,3],['화장실 샤워 부스',10,15,2,2],['현관 계단 안전 난간',6,9,1,1],['보일러 교체',15,25,1,2],['창문 단열',8,14,1,3],['화장실 안전 손잡이',3,6,1,1],['방 도배',5,9,1,2]];
    const n=level===1?3:level===2?4:5;
    const R=shuffle(POOL).slice(0,n).map((p,i)=>({id:'r'+i,name:p[0],cost:(p[1]+Math.floor(Math.random()*(p[2]-p[1]+1)))*100000,days:p[3]+Math.floor(Math.random()*(p[4]-p[3]+1))}));
    const tot=R.reduce((a,r)=>a+r.cost,0);
    const budget=Math.round(tot*rnd(.5,.7)/100000)*100000;
    const extra=level===1?10:level===2?20:pick([15,25]);
    return {R,budget,extra};
  },
  situation(c){ return `<p>집의 여러 부분에 수리가 필요합니다.</p><p>수리 예산으로 <b>${won(c.budget)}</b>이 있으며, 모든 수리를 한 번에 할 수는 없습니다.</p><p>수리 견적:</p><ul>${c.R.map(r=>`<li>${r.name}: ${won(r.cost)} (${r.days}일 소요)</li>`).join('')}</ul>`; },
  steps:[
    { name:'우선순위', instr:'가장 먼저 해야 할 수리부터 순서대로 놓으세요.', hint:'카드를 끌어서 다른 카드 위에 놓으면 그 자리로 옮겨집니다. 안전과 관련된 수리를 먼저 생각해 보세요. 이유는 치료사에게 말로 설명해 주세요.',
      render(body,c,d,done){ const o=orderer(shuffle(c.R.map(r=>r.name)),()=>{});
        body.append(o.el,h('div',{class:'row'},h('button',{class:'big-btn b-pri',onclick:e=>{d.prio=o.get().join(' → ');o.lock();e.target.style.display='none';done();}},'순서 정하기'))); }},
    { name:'수리 고르기', instr:'예산 안에서 이번에 할 수리를 고르세요.', hint:'금액을 직접 더해 보고 고르세요.',
      render(body,c,d,done){ const mp=multiPick(c.R.map(r=>`${r.name} ${won(r.cost)}`));
        body.append(mp.el,checker('확인',{d,key:'sel',done,lock:mp.lock,unlock:mp.unlock,evaluate(){
          const s=[...mp.get()]; if(!s.length) return {incomplete:'하나 이상 골라 주세요.'};
          const tot=s.reduce((a,i)=>a+c.R[i].cost,0); d.selIdx=s; d.selTot=tot;
          return {...critResult([crit(`합계 ${won(tot)} — 예산 ${won(c.budget)} 안`,tot<=c.budget)]),lines:[`고른 수리: ${s.map(i=>c.R[i].name).join(', ')}`,`합계 ${won(tot)}`]};
        }})); }},
    { name:'수리 기간', instr:'고른 수리를 차례로 모두 하면 며칠이 걸리나요?', hint:'',
      render(body,c,d,done){ const days=d.selIdx.reduce((a,i)=>a+c.R[i].days,0); d.dy={};
        const r=rowsAsk([{key:'q',label:'수리 기간',options:shufOpts(days,[days+1,days-1>0?days-1:days+2,days+2,days+3]),fmt:v=>v+'일'}],d.dy);
        body.append(r.el,checker('확인',{d,key:'dayc',done,lock:r.lock,unlock:r.unlock,evaluate(){
          if(!r.all()) return {incomplete:'답을 골라 주세요.'}; const ok=d.dy.q===days;
          return {ok,title:ok?'맞습니다.':'다시 계산해 보세요.',lines:[`${d.selIdx.map(i=>c.R[i].days+'일').join(' + ')} = <b>${days}일</b>`]};
        }})); }},
    { name:'추가 비용', instr:'', hint:'숫자를 눌러 입력하세요.',
      render(body,c,d,done,api){ const tot=d.selTot, add=Math.round(tot*(100+c.extra)/100);
        api.setInstr(`고른 수리(${won(tot)})에 ${c.extra}% 추가 비용이 생기면 모두 얼마인가요?`);
        const np=numPad('원'); d.ov={};
        const r=rowsAsk([{key:'q',label:'추가 비용이 예산을 넘으면 어떻게 하겠습니까?',options:['비용이 적은 수리를 다음으로 미룬다','추가 예산을 마련할 방법을 찾는다','수리를 중간에 멈추게 한다']}],d.ov);
        body.append(np.el,r.el,checker('확인',{d,key:'extra',done,lock(){np.lock();r.lock();},unlock(){np.unlock();r.unlock();},evaluate(){
          const v=np.get(); if(!v||!r.all()) return {incomplete:'금액을 입력하고 대응 방법을 골라 주세요.'}; d.extraAns=v;
          return critResult([crit(`${won(tot)} + ${c.extra}% = ${won(add)}`,v===add),crit(`대응 방법: ${d.ov.q}`,d.ov.q!=='수리를 중간에 멈추게 한다')],[`예산 ${won(c.budget)}을 ${add>c.budget?`${won(add-c.budget)} 넘습니다.`:'넘지 않습니다.'}`]);
        }})); }},
  ],
  questions:['우선순위를 결정할 때 어떤 요소를 고려했나요?','예산 제약 내에서 어떻게 최대한의 수리를 계획했나요?','수리 기간 동안 일상생활을 어떻게 조정하겠습니까?'],
  summarize(d,c){ return [{label:'우선순위',ok:null,detail:d.prio||'-'}].concat(sumCheck(d,'sel','예산 안에서 고르기'),
    [{label:'고른 수리 (최종)',ok:null,detail:(d.selIdx||[]).map(i=>c.R[i].name).join(', ')},{label:'수리 기간 계산 (첫 답)',ok:!!d.daycFirst?.ok,detail:d.dy?.q!=null?d.dy.q+'일':'-'}],sumCheck(d,'extra','추가 비용')); }
},
// ── 14. 지역사회 활동 참여 계획하기 ───────────
{
  id:'community', no:14, title:'지역사회 활동 참여 계획하기', tag:'시간계획', tagClass:'tag-plan',
  desc:'참여할 프로그램을 골라 주간 시간표에 넣고 준비물을 챙깁니다. 프로그램 시간이 매번 바뀝니다.',
  levels:{1:'프로그램 4개 중 2개',2:'프로그램 5개 중 2~3개',3:'프로그램 6개 중 2~3개 · 시간이 겹치는 프로그램이 있음'},
  init(level){
    const POOL=[['시니어 체조',60,'편한 운동복과 운동화'],['원예 치료',90,'장갑과 모자'],['독서 모임',120,'읽을 책과 돋보기 안경'],['요리 교실',120,'앞치마와 위생모'],
      ['산책 모임',60,'운동화와 물병'],['노래 교실',90,'가사집과 물'],['스마트폰 교실',60,'휴대폰과 충전기'],['서예 교실',90,'붓과 먹물']];
    const n=level===1?4:level===2?5:6;
    for(let t=0;t<200;t++){
      const P=shuffle(POOL).slice(0,n).map((p,i)=>{const k=pick([1,1,2,3]);return {id:'g'+i,name:p[0],dur:p[1],item:p[2],days:shuffle([0,1,2,3,4,5]).slice(0,k).sort(),start:pick([540,600,660,840,900])};});
      const clash=(a,b)=>a.days.some(x=>b.days.indexOf(x)>=0)&&a.start<b.start+b.dur&&b.start<a.start+a.dur;
      let nc=0; for(let i=0;i<n;i++)for(let j=i+1;j<n;j++) if(clash(P[i],P[j])) nc++;
      if(level<3&&nc>0) continue; if(level===3&&(nc<1||nc>2)) continue;
      if(P.some(p=>p.start+p.dur>1080)) continue;
      return {P};
    }
  },
  situation(c){ const D=['월','화','수','목','금','토']; return `<p>지역 센터에서 다음과 같은 프로그램을 제공합니다.</p><ul>${c.P.map(p=>`<li>${p.days.map(x=>D[x]).join('/')} ${fmt(p.start)}: ${p.name} (${durTxt(p.dur)})</li>`).join('')}</ul>`+
    (c.level===3?'<p>같은 시간에 하는 프로그램은 함께 참여할 수 없습니다.</p>':''); },
  steps:[
    { name:'프로그램 고르기', instr:'', hint:'고른 이유는 치료사에게 말로 설명해 주세요.',
      render(body,c,d,done,api){ const mn=2, mx=c.level===1?2:3; api.setInstr(`참여하고 싶은 프로그램을 ${mn===mx?mn:mn+'~'+mx}개 고르세요.`);
        const mp=multiPick(c.P.map(p=>p.name));
        body.append(mp.el,checker('선택 확인',{d,key:'pick',done,lock:mp.lock,unlock:mp.unlock,evaluate(){
          const s=[...mp.get()]; if(s.length<mn||s.length>mx) return {incomplete:`${mn===mx?mn:mn+'~'+mx}개를 골라 주세요. (지금 ${s.length}개)`};
          d.chosen=s; const ch=s.map(i=>c.P[i]); const D=['월','화','수','목','금','토'];
          const bad=[]; for(let i=0;i<ch.length;i++)for(let j=i+1;j<ch.length;j++){const a=ch[i],b=ch[j];
            if(a.days.some(x=>b.days.indexOf(x)>=0)&&a.start<b.start+b.dur&&b.start<a.start+a.dur) bad.push(`${a.name}·${b.name}`);}
          return critResult([crit('시간이 겹치지 않는 프로그램끼리 고름'+(bad.length?` (겹침: ${bad.join(', ')})`:''),!bad.length)]);
        }})); }},
    { name:'주간 시간표', instr:'고른 프로그램을 주간 시간표에 모두 넣으세요.', hint:'프로그램을 누른 뒤 시간표 칸을 누르세요. 여러 요일에 하는 프로그램은 요일마다 넣습니다.',
      render(body,c,d,done){
        const ch=d.chosen.map(i=>c.P[i]); const items=[];
        ch.forEach(p=>p.days.forEach((_,k)=>items.push({id:p.id+'_'+k,pid:p.id,name:p.name,dur:p.dur})));
        const pl=planner({cols:['월','화','수','목','금','토'],colNames:['월요일','화요일','수요일','목요일','금요일','토요일'],start:540,end:1080,items,allowOverlap:true});
        body.append(pl.el,checker('시간표 확인',{d,key:'tt',done,lock:pl.lock,unlock:pl.unlock,evaluate(){
          if(!pl.placedAll(items.map(x=>x.id))) return {incomplete:'아직 넣지 않은 프로그램이 있습니다.'};
          const D=['월','화','수','목','금','토'];
          return critResult(ch.map(p=>{const ps=items.filter(x=>x.pid===p.id).map(x=>pl.pos(x.id));
            const ok=ps.every(q=>q.start===p.start)&&p.days.every(dd=>ps.some(q=>q.day===dd));
            return crit(`${p.name}: ${p.days.map(x=>D[x]).join('/')} ${fmt(p.start)}`,ok);}));
        }}));
      }},
    { name:'준비물', instr:'각 프로그램에 필요한 준비물을 고르세요.', hint:'',
      render(body,c,d,done){ const ch=d.chosen.map(i=>c.P[i]); const all=c.P.map(p=>p.item); d.it={};
        const r=rowsAsk(ch.map(p=>({key:p.id,label:p.name,options:shufOpts2(p.item,all)})),d.it);
        body.append(r.el,checker('확인',{d,key:'itc',done,lock:r.lock,unlock:r.unlock,evaluate(){
          if(!r.all()) return {incomplete:'모든 프로그램의 준비물을 골라 주세요.'};
          return critResult(ch.map(p=>crit(`${p.name}: ${p.item}`,d.it[p.id]===p.item)));
        }})); }},
  ],
  questions:['활동 장소까지 어떻게 이동할 계획인가요?','몸이 좋지 않은 날에는 참여를 어떻게 조정하겠습니까?','이 활동들이 재활과 사회적 연결에 어떻게 도움이 될 것 같나요?'],
  summarize(d,c){ return [{label:'고른 프로그램',ok:null,detail:(d.chosen||[]).map(i=>c.P[i].name).join(', ')}].concat(sumCheck(d,'pick','프로그램 고르기'),sumCheck(d,'tt','주간 시간표'),sumCheck(d,'itc','준비물')); }
},
// ── 15. 여러 가족 구성원의 약속 조율 ──────────
{
  id:'family', no:15, title:'여러 가족 구성원의 약속 조율', tag:'일정충돌', tagClass:'tag-conflict',
  desc:'가족 모두의 약속을 한 달력에 모으고, 차량 1대로 내 약속에 어떻게 갈지 정합니다. 약속이 매번 바뀝니다.',
  levels:{1:'나 2개 + 배우자 2개',2:'나 3개 + 배우자 2개',3:'나 3개 + 배우자 2개 + 자녀 2개 (저녁 약속 포함)'},
  init(level){ return familyGen(level); },
  situation(c){ const L=w=>c.A.filter(a=>a.who===w).map(a=>`<li>${DAYN[a.day]} ${fmt(a.start)}: ${a.name} (${durTxt(a.dur)})</li>`).join('');
    return `<p>가족의 일정 관리를 맡고 있습니다. 혼자 운전하기 어려우며, 가족은 차량 1대를 함께 씁니다.</p>
    <p>나의 일정:</p><ul>${L('나')}</ul><p>배우자 일정 (배우자가 차를 쓰고 직접 운전해 갑니다):</p><ul>${L('배우자')}</ul>`+
    (c.level===3?`<p>성인 자녀 일정:</p><ul>${L('자녀')}</ul>`:'')+`<p>성인 자녀는 월~금 <b>오전 9시~오후 6시</b>에 직장에 있습니다.</p>`; },
  steps:[
    { name:'가족 달력', instr:'가족의 일정을 한 주간 달력에 모두 넣으세요.', hint:'일정을 누른 뒤 달력 칸을 누르세요. 청록색은 나, 주황색은 배우자, 초록색은 자녀 일정입니다.',
      render(body,c,d,done){
        const cls={나:'new',배우자:'p2',자녀:'p3'};
        const pl=planner({start:480,end:c.level===3?1200:1080,items:c.A.map(a=>({id:a.id,name:`${a.who}: ${a.name}`,dur:a.dur,cls:cls[a.who]})),allowOverlap:true});
        body.append(pl.el,checker('달력 확인',{d,key:'fc',done,lock:pl.lock,unlock:pl.unlock,evaluate(){
          if(!pl.placedAll(c.A.map(a=>a.id))) return {incomplete:'아직 넣지 않은 일정이 있습니다.'};
          return critResult(c.A.map(a=>{const p=pl.pos(a.id);return crit(`${a.who}: ${a.name} ${DAYN[a.day]} ${fmt(a.start)}`,p.day===a.day&&p.start===a.start);}));
        }}));
      }},
    { name:'이동 방법', instr:'나의 약속마다 어떻게 갈지 고르세요.', hint:'그 시간에 배우자는 차를 쓰는지, 자녀는 직장에 있는지 달력을 보고 확인하세요.',
      render(body,c,d,done){ const OPT=['배우자가 운전해 준다','자녀가 운전해 준다','택시·대중교통을 이용한다','혼자 운전한다']; d.tr={};
        const mine=c.A.filter(a=>a.who==='나');
        body.append(calendar({start:480,end:c.level===3?1200:1080,blocks:c.A.map(a=>({...a,name:`${a.who}: ${a.name}`,cls:{나:'new',배우자:'p2',자녀:'p3'}[a.who]}))}));
        const r=rowsAsk(mine.map(a=>({key:a.id,label:`${DAYN[a.day]} ${fmt(a.start)} ${a.name}`,options:OPT})),d.tr);
        body.append(r.el,checker('확인',{d,key:'trc',done,lock:r.lock,unlock:r.unlock,evaluate(){
          if(!r.all()) return {incomplete:'모든 약속의 이동 방법을 골라 주세요.'};
          const lines=[];
          const list=mine.map(a=>{const v=d.tr[a.id], av=familyAvail(c,a); let ok=true;
            if(v===OPT[3]){ok=false;lines.push(`${a.name}: 혼자 운전하기 어렵습니다.`);}
            if(v===OPT[0]&&!av.sp){ok=false;lines.push(`${a.name}: 그 시간에 배우자가 차를 쓰고 있습니다.`);}
            if(v===OPT[1]&&!av.ch){ok=false;lines.push(`${a.name}: 그 시간에 자녀는 직장이나 다른 일정이 있습니다.`);}
            return crit(`${a.name}: ${v}`,ok);});
          return critResult(list,lines);
        }})); }},
    { name:'비상 대비', instr:'약속 날 차가 고장 나면 어떻게 하는 것이 가장 알맞을까요?', hint:'',
      render(body,c,d,done){ const OPT=['택시·콜택시 번호를 미리 알아 둔다','그날 약속은 연락 없이 빠진다','자녀에게 회사를 쉬라고 한다','고장 나면 그때 생각한다']; d.em={};
        const r=rowsAsk([{key:'q',label:'',options:shuffle(OPT)}],d.em);
        body.append(r.el,checker('확인',{d,key:'emc',done,lock:r.lock,unlock:r.unlock,evaluate(){
          if(!r.all()) return {incomplete:'하나를 골라 주세요.'}; const ok=d.em.q===OPT[0];
          return {ok,title:ok?'알맞은 대비입니다.':'다시 생각해 보세요.',lines:['다른 이동 방법을 미리 알아 두면 갑작스러운 상황에도 약속을 지킬 수 있습니다.']};
        }})); }},
  ],
  questions:['약속 장소가 서로 다른 방향에 있다면 어떻게 하겠습니까?','가장 복잡한 일정 충돌은 무엇이었으며 어떻게 해결했나요?','가족 구성원들과 일정 조율을 위해 어떤 의사소통이 필요할까요?'],
  summarize(d){ return sumCheck(d,'fc','가족 달력').concat(sumCheck(d,'trc','이동 방법'),[{label:'비상 대비 (첫 답)',ok:!!d.emcFirst?.ok,detail:d.em?.q||'-'}]); }
},
// ── 16. 제한된 에너지로 우선순위 결정 ─────────
{
  id:'energy', no:16, title:'제한된 에너지로 우선순위 결정', tag:'우선순위', tagClass:'tag-prior',
  desc:'하루 활동 제한 시간 안에서 참석할 활동을 고르고 못 가는 활동에 대처합니다. 활동과 제한 시간이 매번 바뀝니다.',
  levels:{1:'활동 4개 · 하루 4시간',2:'활동 5개 · 하루 4시간',3:'활동 6개 · 하루 3시간'},
  init(level){
    const lim=level===3?180:240;
    for(let t=0;t<300;t++){
      const must=[{id:'h',name:pick(['의사 진료','물리치료','정기 검진']),dur:pick([30,60]),out:1,kind:'h'},
        {id:'dl',name:pick(['은행 서류 제출 (오늘 마감)','주민센터 신청서 제출 (오늘 마감)','보험 서류 제출 (오늘 마감)']),dur:30,out:1,kind:'dl'}];
      const soc=shuffle([['손자 학교 발표회',120],['이웃 주민 모임',90],['친구 생일 점심',90],['교회 모임',60],['동창 모임',120],['노래 교실',60]]).slice(0,level===1?1:level===2?2:3)
        .map((s,i)=>({id:'s'+i,name:s[0],dur:s[1],out:1,kind:'s'}));
      const home={id:'dn',name:'저녁 식사 준비',dur:60,out:0,kind:'home'};
      const A=must.concat(soc);
      const base=must.reduce((a,x)=>a+x.dur,0)+(must.length+1)*30;
      if(base>lim-30) continue;
      let tm=pick([540,570,600]); shuffle(A).forEach(a=>{a.time=tm;tm+=a.dur+pick([60,90]);});
      const all=A.sort((x,y)=>x.time-y.time).concat([home]);
      return {A:all,lim};
    }
  },
  situation(c){ return `<p>의사는 하루에 <b>${durTxt(c.lim)}</b> 넘게 활동하지 말고 충분히 쉬라고 했습니다.</p><p>다음 주 화요일 일정:</p><ul>${c.A.map(a=>`<li>${a.time?fmt(a.time)+': ':''}${a.name} (${durTxt(a.dur)})</li>`).join('')}</ul>
    <p>집과 각 장소 사이, 장소와 장소 사이 이동은 <b>30분</b>씩 걸립니다.</p>`; },
  steps:[
    { name:'중요도 평가', instr:'각 활동의 중요도를 평가하세요.', hint:'정답은 없습니다. 건강과 관련된 일인지, 마감이 있는 일인지 생각해 보세요.',
      render(body,c,d,done){ d.imp={}; const r=rowsAsk(c.A.map(a=>({key:a.id,label:a.name,options:['높음','보통','낮음']})),d.imp,()=>{if(r.all())done();}); body.append(r.el); }},
    { name:'참석할 활동', instr:'', hint:'이동 시간도 활동 시간에 포함됩니다. 외출 활동은 집에서 나가고 돌아오는 이동까지 계산합니다.',
      render(body,c,d,done,api){ api.setInstr(`${durTxt(c.lim)} 제한 안에서 참석할 활동을 고르세요.`); const tot=h('div',{class:'total'});
        const calc=s=>{const sel=[...s].map(i=>c.A[i]);const n=sel.filter(a=>a.out).length;return sel.reduce((a,x)=>a+x.dur,0)+(n?(n+1)*30:0);};
        const mp=multiPick(c.A.map(a=>`${a.name} (${durTxt(a.dur)})`),s=>{tot.textContent=`이동 포함 활동 시간: ${durTxt(calc(s))} / ${durTxt(c.lim)}`;});
        tot.textContent=`이동 포함 활동 시간: 0분 / ${durTxt(c.lim)}`;
        body.append(mp.el,tot,checker('확인',{d,key:'att',done,lock:mp.lock,unlock:mp.unlock,evaluate(){
          const s=mp.get(); if(!s.size) return {incomplete:'하나 이상 골라 주세요.'};
          const t=calc(s); d.attIdx=[...s]; d.attTot=t;
          const iH=c.A.findIndex(a=>a.kind==='h'), iD=c.A.findIndex(a=>a.kind==='dl');
          return critResult([crit(`이동 포함 ${durTxt(t)} — ${durTxt(c.lim)} 이내`,t<=c.lim),crit(`${c.A[iH].name} 참석 (건강)`,s.has(iH)),crit(`${c.A[iD].name.replace(' (오늘 마감)','')} 참석 (마감)`,s.has(iD))]);
        }}));
      }},
    { name:'못 가는 활동', instr:'참석하지 않는 활동을 각각 어떻게 할지 고르세요.', hint:'',
      render(body,c,d,done){ const skip=c.A.filter((a,i)=>!d.attIdx.includes(i)); d.sk={};
        if(!skip.length){body.append(h('p',{class:'hint'},'모든 활동에 참석합니다. 다음 단계로 넘어가세요.'));done();return;}
        const OPT_OUT=['미리 연락해 양해를 구한다','다른 날로 미룬다','영상·사진으로 대신 함께한다','연락 없이 빠진다'], OPT_DN=['간단한 음식이나 반찬을 산다','가족에게 부탁한다','저녁을 거른다'];
        const r=rowsAsk(skip.map(a=>({key:a.id,label:a.name,options:a.out?OPT_OUT:OPT_DN})),d.sk);
        body.append(r.el,checker('확인',{d,key:'skc',done,lock:r.lock,unlock:r.unlock,evaluate(){
          if(!r.all()) return {incomplete:'모든 활동의 대처를 골라 주세요.'};
          return critResult(skip.map(a=>crit(`${a.name}: ${d.sk[a.id]}`,!['연락 없이 빠진다','저녁을 거른다'].includes(d.sk[a.id]))));
        }})); }},
  ],
  questions:['선택한 활동들의 하루 시간 계획을 말해 보세요 (이동·휴식 포함).','활동 우선순위를 어떤 기준으로 결정했나요?','비슷한 상황이 반복된다면 어떻게 미리 계획을 조정할 수 있을까요?'],
  summarize(d,c){ return [{label:'이번 조건',ok:null,detail:`제한 ${durTxt(c.lim)} · `+c.A.map(a=>`${a.name} ${d.imp?.[a.id]||'-'}`).join(', ')}].concat(sumCheck(d,'att','참석할 활동'),
    [{label:'참석 활동 (최종)',ok:null,detail:(d.attIdx||[]).map(i=>c.A[i].name).join(', ')+(d.attTot!=null?` / ${durTxt(d.attTot)}`:'')}],d.skc?sumCheck(d,'skc','못 가는 활동 대처'):[]); }
},

function go(name){
  SCREEN=name;
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById('scr-'+name).classList.add('on');
  document.getElementById('list-btn').style.display=name==='home'?'none':'inline-block';
  window.scrollTo(0,0);
  if(name==='home') renderHome();
}
function listBtn(){ if(SCREEN==='act') leaveActivity(); else go('home'); }

function renderHome(){
  const box=document.getElementById('act-list'); box.innerHTML='';
  ACTS.forEach(a=>{
    const r=S.results[a.id];
    box.append(h('button',{class:'act-card'+(r?' done':''),onclick:()=>openActivity(a)},
      h('div',null,h('span',{class:'tag '+a.tagClass},a.tag),a.levels?h('span',{class:'lvtag'},'난이도 3단계'):null),
      h('div',{class:'t'},`${a.no}. ${a.title}`),
      h('div',{class:'d'},a.desc),
      r?h('div',{class:'st'},`완료${r.level?' ('+LV_NAME[r.level]+')':''} · ${mmss(r.elapsed)} · 다시 하려면 누르세요`):null));
  });
  document.getElementById('btn-report').disabled=!Object.keys(S.results).length;
}

function openActivity(act){

    const list=h('div',{class:'lv-list'});
    [1,2,3].forEach(lv=>list.append(h('button',{class:'lv-btn lv'+lv,onclick:()=>startActivity(act,lv)},
      h('span',{class:'lvn'},LV_NAME[lv]),h('span',{class:'lvd'},act.levels[lv]))));
    body.append(list);
    document.getElementById('a-next').disabled=true;
    go('act'); return;
  }
  startActivity(act,null);
}

function startActivity(act,level){
  const ctx=act.init(level||2); ctx.level=level;
  const steps=[...act.steps.filter(st=>!st.when||st.when(ctx)),{name:'되돌아보기',instr:'환자와 함께 되돌아보고, 치료사가 관찰한 내용을 기록하세요.',hint:'모든 칸은 선택 사항입니다. 기록한 내용은 결과 리포트에 들어갑니다.',render:renderReflect,isQ:true}];
  RUN={act,ctx,level,steps,i:0,data:{},refl:{self:null,assist:null,errs:new Set(),memo:''},t0:Date.now()};
  document.getElementById('a-title').textContent=`${act.no}. ${act.title}`+(level?` · ${LV_NAME[level]}`:'');
  const situ=document.getElementById('a-situ'); situ.style.display='';
  situ.innerHTML='<div class="h">상황</div>'+act.situation(ctx);
  clearInterval(TIMER);
  TIMER=setInterval(()=>{document.getElementById('a-timer').textContent=mmss(Date.now()-RUN.t0);},1000);
  document.getElementById('a-timer').textContent='0:00';
  go('act'); renderStep();
}

function renderStep(){
  const {steps,i}=RUN, st=steps[i];
  const bar=document.getElementById('a-steps'); bar.innerHTML='';
  steps.forEach((s,k)=>bar.append(h('span',{class:'step-pill'+(k===i?' cur':k<i?' past':'')},`${k+1}. ${s.name}`)));
  document.getElementById('a-instr').textContent=st.instr;
  document.getElementById('a-hint').textContent=st.hint||'';
  const body=document.getElementById('a-body'); body.innerHTML='';
  const nx=document.getElementById('a-next');
  nx.disabled=true; nx.textContent=i===steps.length-1?'활동 마치기':'다음 단계';
  nx.onclick=()=>{ if(i===steps.length-1) finishActivity(); else {RUN.i++;renderStep();window.scrollTo(0,0);} };
  const api={setInstr:t=>{document.getElementById('a-instr').textContent=t;}};
  st.render(body,RUN.ctx,RUN.data,()=>{nx.disabled=false;},api);
}

// 자동 판정 항목(첫 시도 기준) 통과율
function scoreOf(items){
  const j=items.filter(x=>x.ok!==null&&x.ok!==undefined);
  const n=j.filter(x=>x.ok).length;
  return {n,t:j.length,pct:j.length?Math.round(n/j.length*100):null};
}
// 자기평가와 실제 결과 비교
function selfCompare(self,sc){
  if(self==null||sc.pct==null) return null;
  const actual=sc.pct>=80?0:sc.pct>=50?1:2;
  if(actual===self) return {k:'일치',t:'자기평가와 실제 결과가 비슷합니다.'};
  return self<actual?{k:'과대평가',t:'실제 결과보다 높게 평가했습니다.'}:{k:'과소평가',t:'실제 결과보다 낮게 평가했습니다.'};
}

function renderReflect(body,c,d,done){
  const R=RUN.refl, sc=scoreOf(RUN.act.summarize(d,c));
  const box=h('div',{style:'display:flex;flex-direction:column;gap:14px'});
  function draw(){
    box.innerHTML='';
    // 1. 환자 자기평가
    const s1=h('div',{class:'rf-sec'},h('div',{class:'lbl'},'1. 환자 자기평가 — “오늘 이 활동을 얼마나 잘했다고 생각하세요?”'),
      seg(SELF,v=>{R.self=SELF.indexOf(v)===R.self?null:SELF.indexOf(v);draw();},R.self==null?null:SELF[R.self]));
    const cmp=selfCompare(R.self,sc);
    s1.append(h('div',{class:'rf-cmp'},
      sc.t?`실제 결과: 자동 판정 ${sc.t}개 중 ${sc.n}개 통과 (${sc.pct}%, 첫 시도 기준)`:'이 활동은 자동 판정 항목이 없습니다.',
      cmp?h('div',{class:cmp.k==='일치'?'okc':'badc'},`→ ${cmp.k}: ${cmp.t}`):null));
    // 2. 도움 수준
    const s2=h('div',{class:'rf-sec'},h('div',{class:'lbl'},'2. 도움 수준 (치료사)'),
      seg(ASSIST,v=>{const k=ASSIST.indexOf(v);R.assist=R.assist===k?null:k;draw();},R.assist==null?null:ASSIST[R.assist]));
    // 3. 관찰된 어려움
    const pal=h('div',{class:'palette'});
    ERRS.forEach(e=>pal.append(h('button',{class:'chip'+(R.errs.has(e)?' sel':''),onclick:()=>{R.errs.has(e)?R.errs.delete(e):R.errs.add(e);draw();}},e)));
    const s3=h('div',{class:'rf-sec'},h('div',{class:'lbl'},'3. 관찰된 어려움 (해당하는 것 모두)'),pal);
    // 4. 이야기 나눌 질문
    const s4=h('div',{class:'rf-sec'},h('div',{class:'lbl'},'4. 이야기 나눌 질문 (필요할 때 활용)'),
      h('ol',{class:'rf-q'},RUN.act.questions.map(q=>h('li',null,q))));
    // 5. 메모
    const memo=h('textarea',{placeholder:'관찰 내용, 준 단서, 다음 회기 계획 등',oninput:e=>{R.memo=e.target.value;}});
    memo.value=R.memo;
    box.append(s1,s2,s3,s4,h('div',{class:'rf-sec'},h('div',{class:'lbl'},'5. 메모'),memo));
  }
  draw(); body.append(box); done();
}

function finishActivity(){
  clearInterval(TIMER);
  const {act,ctx,data,refl,t0,level}=RUN;
  const items=act.summarize(data,ctx);
  S.results[act.id]={elapsed:Date.now()-t0,items,level,score:scoreOf(items),
    self:refl.self,assist:refl.assist,errs:[...refl.errs],memo:refl.memo,ctx,at:new Date()};
  RUN=null; go('home');
}

function leaveActivity(){
  if(RUN && !confirm('지금 나가면 이 활동의 진행 내용이 저장되지 않습니다. 나갈까요?')) return;
  clearInterval(TIMER); RUN=null; go('home');
}

function showReport(){
  const b=document.getElementById('rep-body'); b.innerHTML='';
  const name=document.getElementById('pname').value.trim();
  const done=ACTS.filter(a=>S.results[a.id]);
  let pass=0,tot=0;
  done.forEach(a=>{const sc=S.results[a.id].score;pass+=sc.n;tot+=sc.t;});
  b.append(h('h2',null,'IADL 시나리오 훈련 결과'),
    h('div',{class:'meta'},`환자명: ${name||'—'}　날짜: ${todayStr()}　완료 활동: ${done.length}/${ACTS.length}　자동 판정 통과: ${pass}/${tot}`));
  // 요약표
  const sum=h('table',null,h('tr',null,h('th',null,'활동'),h('th',null,'난이도'),h('th',null,'통과'),h('th',null,'자기평가'),h('th',null,'도움 수준'),h('th',null,'소요')));
  done.forEach(a=>{const r=S.results[a.id],cmp=selfCompare(r.self,r.score);
    sum.append(h('tr',null,h('td',null,`${a.no}. ${a.title}`),h('td',null,r.level?LV_NAME[r.level]:'—'),
      h('td',null,r.score.t?`${r.score.n}/${r.score.t} (${r.score.pct}%)`:'—'),
      h('td',null,r.self==null?'—':SELF[r.self]+(cmp?` (${cmp.k})`:'')),
      h('td',null,r.assist==null?'—':ASSIST[r.assist]),h('td',null,mmss(r.elapsed))));});
  b.append(sum);
  done.forEach(a=>{
    const r=S.results[a.id];
    b.append(h('div',{class:'act-h'},h('b',null,`${a.no}. ${a.title} (${a.tag}${r.level?' · '+LV_NAME[r.level]:''})`),h('span',null,`소요 ${mmss(r.elapsed)}`)));
    const t=h('table',null,h('tr',null,h('th',{style:'width:34%'},'항목'),h('th',{style:'width:12%'},'판정'),h('th',null,'내용')));
    r.items.forEach(it=>t.append(h('tr',null,h('td',null,it.label),
      h('td',{class:it.ok===null?'na':it.ok?'pass':'fail'},it.ok===null?'기록':it.ok?'통과':'확인 필요'),h('td',{html:it.detail||''}))));
    if(r.errs.length) t.append(h('tr',null,h('td',null,'관찰된 어려움'),h('td',{class:'na'},'관찰'),h('td',null,r.errs.join(', '))));
    if(r.memo) t.append(h('tr',null,h('td',null,'메모'),h('td',{class:'na'},'관찰'),h('td',null,r.memo)));
    b.append(t);
  });
  b.append(h('p',{class:'hint',style:'margin-top:12px'},'자동 판정은 화면 수행의 첫 시도 기준입니다. 자기평가 비교: 통과율 80% 이상 ‘잘했다’, 50~79% ‘보통이다’, 50% 미만 ‘어려웠다’와 견줍니다. 장보기 가격은 연습용 예시입니다.'));
  go('rep');
}

function todayStr(){const d=new Date();return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;}
document.getElementById('today').textContent=todayStr();
renderHome();
</script>
