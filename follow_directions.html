<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>지시 따르기 훈련 - 광주365재활병원</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: rgba(0,0,0,0.06); touch-action: manipulation; }
  body {
    margin: 0; padding: 70px 14px 70px;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
    background: #f4f6fb; color: #1f2433;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
  }
  button { font: inherit; cursor: pointer; min-height: 48px; }
  button:disabled { cursor: not-allowed; opacity: .45; }
  button:focus-visible { outline: 3px solid #ffb300; outline-offset: 2px; }
  .screen { display: none; width: 100%; max-width: 900px; flex-direction: column; align-items: center; gap: 14px; }
  .screen.on { display: flex; }

  #home-btn { position: absolute; top: 16px; left: 16px; padding: 8px 16px; border-radius: 999px; border: 1px solid #bbb; background: #fff; font-size: 14px; }
  h1 { margin: 0; font-size: 2rem; font-weight: 800; color: #1a237e; }
  .lead { margin: 0; color: #555; text-align: center; line-height: 1.6; }

  /* 설정 */
  .panel { width: 100%; background: #fff; border: 1px solid #dfe3ec; border-radius: 16px; padding: 14px 18px; }
  .set-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid #eef1f5; }
  .set-row:last-child { border-bottom: none; }
  .set-label { width: 92px; font-weight: 800; color: #555; font-size: .95rem; }
  .opt { padding: 8px 14px; border-radius: 12px; border: 2px solid #d5dbe6; background: #fff; font-weight: 700; font-size: .95rem; text-align: left; }
  .opt small { display: block; font-weight: 500; font-size: .78rem; color: #666; }
  .opt.on { border-color: #1976d2; background: #e3f0fd; }
  .set-row input[type=text] { font: inherit; padding: 9px 12px; border: 2px solid #d5dbe6; border-radius: 10px; min-width: 180px; }
  .lv-table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  .lv-table th, .lv-table td { padding: 7px 8px; border-bottom: 1px solid #eef1f5; text-align: left; vertical-align: top; }
  .lv-table th { color: #555; font-size: .85rem; }
  .lv-table td:first-child { white-space: nowrap; font-weight: 800; color: #1976d2; }

  .big-btn { padding: 14px 28px; border-radius: 14px; border: none; font-size: 1.15rem; font-weight: 800; min-height: 56px; }
  .b-pri { background: #1976d2; color: #fff; }
  .b-sec { background: #fff; color: #1f2433; border: 2px solid #d5dbe6; }
  .b-ok { background: #2e7d32; color: #fff; }

  /* 훈련 상단 */
  .top { width: 100%; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: #1a237e; color: #fff; border-radius: 14px; padding: 10px 14px; }
  .top .lv { font-weight: 800; font-size: 1.05rem; }
  .top .pg { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 700; }
  .top .stop { background: rgba(255,255,255,.18); color: #fff; border: none; border-radius: 10px; padding: 6px 12px; min-height: 40px; font-weight: 700; }
  .instr-box { width: 100%; background: #fff; border: 2px solid #c5cae9; border-radius: 16px; padding: 14px 18px; min-height: 86px; display: flex; align-items: center; gap: 12px; }
  #instr-text { flex: 1; font-size: 1.45rem; font-weight: 800; line-height: 1.45; }
  #instr-text.dim { color: #9aa2b2; font-size: 1.12rem; font-weight: 700; }
  #replay-btn { flex: none; padding: 8px 14px; border-radius: 12px; border: 2px solid #1976d2; background: #fff; color: #1976d2; font-weight: 800; }

  #stage { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  #stage.veiled { visibility: hidden; }
  #stage.locked { pointer-events: none; }
  .hint-line { color: #555; font-size: .95rem; text-align: center; min-height: 1.3rem; }

  /* 물건 */
  .obj {
    position: relative; width: 112px; height: 112px; border-radius: 16px; border: 3px solid transparent;
    background: #fff; padding: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.08);
  }
  .obj svg { width: 100%; height: 100%; display: block; }
  .obj.picked { border-color: #1f2433; background: #eef1f8; }
  .obj.holding { border-color: #1976d2; background: #e3f0fd; transform: translateY(-4px); }
  .obj.ans { border-color: #2e7d32; background: #e8f5e9; }
  .obj.wrongpick { border-color: #c62828; background: #fdecea; }
  .num { position: absolute; top: -10px; right: -10px; width: 34px; height: 34px; border-radius: 50%;
    background: #1f2433; color: #fff; font-weight: 800; display: grid; place-items: center; font-size: 1.05rem; }
  .obj.ans .num { background: #2e7d32; }
  .table-top { display: grid; gap: 12px; justify-content: center; padding: 18px; border-radius: 18px;
    background: #e9d8bf; border: 4px solid #b98d5b; box-shadow: inset 0 -6px 0 rgba(0,0,0,.06); }

  /* 집안 정리 */
  .zones, .switches { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; width: 100%; }
  .zone, .switch {
    border-radius: 16px; border: 3px solid #d5dbe6; background: #fff; padding: 8px 6px 6px;
    display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 150px;
  }
  .zone .ic, .switch .ic { width: 78px; height: 78px; }
  .zone .nm, .switch .nm { font-weight: 800; font-size: 1rem; }
  .switch .st { font-size: .85rem; font-weight: 800; padding: 1px 10px; border-radius: 999px; background: #eceff4; color: #444; }
  .switch.on .st { background: #1f2433; color: #fff; }
  .zone.ready { border-color: #1976d2; background: #f2f8fe; }
  .zone .inbox { display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; min-height: 30px; }
  .zone .inbox svg { width: 30px; height: 30px; }
  .zone.ans, .switch.ans { border-color: #2e7d32; background: #e8f5e9; }
  .counter { width: 100%; min-height: 150px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center;
    padding: 14px; border-radius: 18px; background: #e9d8bf; border: 4px solid #b98d5b; }
  .counter-title { font-weight: 800; color: #6d4c2a; }
  .counter .obj { width: 96px; height: 96px; }
  .history { width: 100%; font-size: .95rem; color: #333; background: #fff; border: 1px dashed #c5cae9; border-radius: 12px; padding: 8px 12px; min-height: 40px; }

  /* 기기 */
  .device { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
  .screen-box { width: 300px; height: 190px; border-radius: 14px; background: #111; border: 10px solid #333;
    display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; gap: 6px; }
  .screen-box.off { background: #050505; color: #555; }
  .screen-box .big { font-size: 2.2rem; font-weight: 900; font-variant-numeric: tabular-nums; }
  .screen-box .small { font-size: 1.1rem; font-weight: 700; }
  .remote { width: 230px; background: #2b2f38; border-radius: 28px; padding: 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .remote button, .mw button, .pad button {
    border: none; border-radius: 12px; background: #4a5060; color: #fff; font-weight: 800; font-size: 1.15rem; min-height: 50px;
  }
  .remote .pw { background: #c62828; grid-column: span 3; }
  .remote .lbl { color: #cfd3dc; font-size: .8rem; text-align: center; align-self: center; font-weight: 700; }
  .mw-body { display: flex; gap: 0; border-radius: 16px; overflow: hidden; border: 4px solid #8a8f99; background: #d9dde3; }
  .mw-door { width: 260px; height: 190px; background: #2d3037; border-right: 4px solid #8a8f99; display: flex; align-items: center; justify-content: center; }
  .mw-door .glass { width: 210px; height: 140px; border-radius: 10px; background: #1b1d22; display: flex; align-items: center; justify-content: center; color: #555; font-weight: 800; }
  .mw-door .glass.run { background: #4a3a14; color: #ffd54f; }
  .mw { width: 170px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .mw .disp { background: #0d1a0d; color: #69f0ae; border-radius: 8px; font-size: 1.8rem; font-weight: 900; text-align: center; padding: 6px; font-variant-numeric: tabular-nums; }
  .mw .start { background: #2e7d32; } .mw .cancel { background: #c62828; }
  .phone { width: 280px; background: #1f2128; border-radius: 30px; padding: 18px 16px 22px; display: flex; flex-direction: column; gap: 10px; }
  .phone .disp { background: #fff; border-radius: 12px; min-height: 76px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px; }
  .phone .disp .n { font-size: 1.6rem; font-weight: 900; letter-spacing: 1px; font-variant-numeric: tabular-nums; min-height: 2rem; }
  .phone .disp .s { font-size: .9rem; color: #2e7d32; font-weight: 800; min-height: 1.1rem; }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .pad .call { background: #2e7d32; } .pad .end { background: #c62828; } .pad .del { background: #6b7280; font-size: .95rem; }

  .act-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  #fb { width: 100%; min-height: 1.6rem; text-align: center; font-size: 1.15rem; font-weight: 800; }
  #fb.ok { color: #2e7d32; } #fb.bad { color: #c62828; }
  #fb small { display: block; font-size: .95rem; font-weight: 600; color: #444; margin-top: 4px; line-height: 1.5; }

  /* 결과 */
  .rep h2 { margin: 0 0 4px; }
  .rep .meta { color: #555; margin-bottom: 10px; }
  .rep table { width: 100%; border-collapse: collapse; margin: 6px 0 14px; font-size: .93rem; background: #fff; }
  .rep th, .rep td { border: 1px solid #dfe3ec; padding: 6px 8px; text-align: center; }
  .rep th { background: #f0f2f8; }
  .rep .l { text-align: left; }
  .rep .note { font-size: .85rem; color: #666; }
  .okc { color: #2e7d32; font-weight: 800; } .badc { color: #c62828; font-weight: 800; }

  #hospital-logo { position: fixed; bottom: 10px; right: 10px; font-size: 12px; color: #666; padding: 5px 10px; background: rgba(255,255,255,.9); border-radius: 4px; font-weight: 500; }

  @media (max-width: 640px) {
    .obj { width: 76px; height: 76px; padding: 4px; }
    .counter .obj { width: 70px; height: 70px; }
    .table-top { gap: 8px; padding: 10px; }
    .zones, .switches { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    #instr-text { font-size: 1.18rem; }
    .set-label { width: 100%; }
    .mw-door { width: 150px; } .mw-door .glass { width: 120px; }
    #hospital-logo { display: none; }
  }
  @media print {
    body { background: #fff; padding: 0; }
    #home-btn, #hospital-logo, .no-print { display: none !important; }
    .panel { border: none; padding: 0; }
  }
</style>
</head>
<body>
<button id="home-btn" onclick="location.href='index.html'">← 메인으로</button>

<!-- 설정 -->
<div class="screen on" id="scr-set">
  <h1>지시 따르기 훈련</h1>
  <p class="lead">생활 속 지시를 듣거나 읽고, 그대로 해 보세요.</p>
  <div class="panel">
    <div class="set-row"><span class="set-label">환자명</span><input type="text" id="pname" placeholder="선택 입력"/></div>
    <div class="set-row" id="row-theme"><span class="set-label">과제</span></div>
    <div class="set-row" id="row-level"><span class="set-label">시작 단계</span></div>
    <div class="set-row" id="row-prog"><span class="set-label">진행 방식</span></div>
    <div class="set-row" id="row-pres"><span class="set-label">지시 제시</span></div>
    <div class="set-row" id="row-mem"><span class="set-label">수행 방식</span></div>
    <div class="set-row" id="row-count"><span class="set-label">문제 수</span></div>
  </div>
  <div class="panel">
    <b>단계 안내</b>
    <table class="lv-table" id="lv-table"></table>
  </div>
  <p class="lead" id="voice-note"></p>
  <button class="big-btn b-pri" onclick="startSession()">시작하기</button>
</div>

<!-- 훈련 -->
<div class="screen" id="scr-run">
  <div class="top">
    <span class="lv" id="r-level"></span>
    <span class="pg" id="r-prog"></span>
    <button class="stop" onclick="if(confirm('훈련을 끝내고 결과를 볼까요?')) finish()">끝내기</button>
  </div>
  <div class="instr-box">
    <div id="instr-text"></div>
    <button id="replay-btn" onclick="replay()">다시 듣기</button>
  </div>
  <div id="stage"></div>
  <div id="fb"></div>
  <div class="act-row" id="act-row"></div>
</div>

<!-- 결과 -->
<div class="screen" id="scr-rep">
  <div class="panel rep" id="rep"></div>
  <div class="act-row no-print">
    <button class="big-btn b-sec" onclick="go('set')">설정으로</button>
    <button class="big-btn b-pri" onclick="window.print()">인쇄하기</button>
  </div>
</div>

<div id="hospital-logo">광주365재활병원_인지연하팀</div>

<script>
// ══════════════════════════════════════════════════════════════
// 공통 도구
// ══════════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);
const pick = a => a[Math.floor(Math.random() * a.length)];
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function batchim(w) { const c = w.charCodeAt(w.length - 1); if (c >= 0xAC00 && c <= 0xD7A3) return (c - 0xAC00) % 28 !== 0; return /[0-9]$/.test(w) ? /[013678]$/.test(w) : false; }
const eul = w => w + (batchim(w) ? '을' : '를');
const iga = w => w + (batchim(w) ? '이' : '가');
const euro = w => { const last = w[w.length - 1]; if (/[0-9]/.test(last)) return w + (/[036]/.test(last) ? '으로' : '로'); const c = w.charCodeAt(w.length - 1); const b = c >= 0xAC00 && c <= 0xD7A3 ? (c - 0xAC00) % 28 : 0; return w + (b === 0 || b === 8 ? '로' : '으로'); };
const h = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const mmss = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
const tlabel = s => (s >= 60 ? Math.floor(s / 60) + '분' : '') + (s % 60 ? (s >= 60 ? ' ' : '') + (s % 60) + '초' : '');

// ══════════════════════════════════════════════════════════════
// 그림 (SVG)
// ══════════════════════════════════════════════════════════════
const CCSS = { red: '#e53935', blue: '#1e63d6', yellow: '#fbc02d', green: '#2e9a3e' };
const CADJ = { red: '빨간', blue: '파란', yellow: '노란', green: '초록' };
const O = 'stroke="#333" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"';
const ICONS = {
  cup: c => `<path d="M24 30h44v40a10 10 0 0 1-10 10H34a10 10 0 0 1-10-10z" fill="${c}" ${O}/><path d="M68 40h6a10 10 0 0 1 0 20h-6" fill="none" ${O}/><path d="M34 18c0 4 6 4 6 8M48 16c0 4 6 4 6 8" fill="none" stroke="#999" stroke-width="3" stroke-linecap="round"/>`,
  spoon: () => `<ellipse cx="34" cy="30" rx="15" ry="20" transform="rotate(-35 34 30)" fill="#cfd5dd" ${O}/><path d="M44 42L80 84" stroke="#333" stroke-width="10" stroke-linecap="round"/><path d="M44 42L80 84" stroke="#cfd5dd" stroke-width="5" stroke-linecap="round"/>`,
  chopsticks: () => `<path d="M30 12L46 90M44 10L56 90" stroke="#333" stroke-width="9" stroke-linecap="round"/><path d="M30 12L46 90M44 10L56 90" stroke="#a1764a" stroke-width="5" stroke-linecap="round"/>`,
  pills: () => `<rect x="28" y="18" width="44" height="14" rx="3" fill="#fff" ${O}/><rect x="30" y="32" width="40" height="52" rx="6" fill="#f39c3a" ${O}/><rect x="34" y="46" width="32" height="22" rx="3" fill="#fff" ${O}/><path d="M42 57h16M50 51v12" stroke="#e53935" stroke-width="3" stroke-linecap="round"/>`,
  glasses: () => `<circle cx="30" cy="54" r="16" fill="#e3f2fd" ${O}/><circle cx="70" cy="54" r="16" fill="#e3f2fd" ${O}/><path d="M46 52q4-6 8 0M14 50L6 40M86 50L94 40" fill="none" ${O}/>`,
  phone: () => `<rect x="30" y="10" width="40" height="80" rx="8" fill="#333" ${O}/><rect x="35" y="18" width="30" height="58" rx="3" fill="#7ab8f5"/><circle cx="50" cy="83" r="3" fill="#ddd"/>`,
  key: () => `<circle cx="32" cy="34" r="16" fill="#f2c94c" ${O}/><circle cx="32" cy="34" r="6" fill="#fff" ${O}/><path d="M44 46L80 82M64 66l8-8M72 74l8-8" fill="none" stroke="#333" stroke-width="9" stroke-linecap="round"/><path d="M44 46L80 82M64 66l8-8M72 74l8-8" fill="none" stroke="#f2c94c" stroke-width="4" stroke-linecap="round"/>`,
  wallet: () => `<rect x="14" y="28" width="72" height="50" rx="8" fill="#8d5a34" ${O}/><path d="M14 40h72" stroke="#333" stroke-width="3"/><rect x="58" y="48" width="28" height="16" rx="4" fill="#a8703f" ${O}/><circle cx="68" cy="56" r="3" fill="#f2c94c"/>`,
  towel: c => `<path d="M10 22h80" stroke="#8d6e63" stroke-width="7" stroke-linecap="round"/><path d="M24 22h52v56H24z" fill="${c}" ${O}/><path d="M24 22h52v20q-26 8-52 0z" fill="${c}" ${O}/><path d="M24 58h52M24 66h52" stroke="#fff" stroke-width="4"/><path d="M28 78v8M36 78v8M44 78v8M52 78v8M60 78v8M68 78v8M72 78v8" stroke="#333" stroke-width="3" stroke-linecap="round"/>`,
  toothbrush: c => `<path d="M16 88L58 40" stroke="#333" stroke-width="13" stroke-linecap="round"/><path d="M16 88L58 40" stroke="${c}" stroke-width="8" stroke-linecap="round"/><g transform="rotate(41 68 28)"><rect x="52" y="20" width="34" height="16" rx="4" fill="#fff" ${O}/><path d="M57 20v-12M63 20v-12M69 20v-12M75 20v-12M81 20v-12" stroke="#42a5f5" stroke-width="4" stroke-linecap="round"/></g>`,
  watch: () => `<rect x="38" y="8" width="24" height="84" rx="6" fill="#555" ${O}/><circle cx="50" cy="50" r="20" fill="#fff" ${O}/><path d="M50 50V38M50 50l8 5" stroke="#333" stroke-width="3" stroke-linecap="round"/>`,
  remote: () => `<rect x="32" y="8" width="36" height="84" rx="10" fill="#444" ${O}/><circle cx="50" cy="22" r="5" fill="#e53935"/><circle cx="42" cy="42" r="4" fill="#ddd"/><circle cx="58" cy="42" r="4" fill="#ddd"/><circle cx="42" cy="56" r="4" fill="#ddd"/><circle cx="58" cy="56" r="4" fill="#ddd"/><circle cx="42" cy="70" r="4" fill="#ddd"/><circle cx="58" cy="70" r="4" fill="#ddd"/>`,
  milk: () => `<path d="M30 30l8-14h24l8 14v58H30z" fill="#fff" ${O}/><path d="M30 30h40" stroke="#333" stroke-width="3"/><rect x="30" y="46" width="40" height="22" fill="#5c9ded"/><path d="M38 16l4-6h16l4 6" fill="#fff" ${O}/>`,
  apple: () => `<path d="M50 30c-8-8-30-6-30 18 0 20 14 36 22 36 4 0 6-2 8-2s4 2 8 2c8 0 22-16 22-36 0-24-22-26-30-18z" fill="#e53935" ${O}/><path d="M50 30c0-8 2-14 6-18" fill="none" ${O}/><path d="M54 22c6-8 16-8 18-4-4 6-12 8-18 4z" fill="#43a047" ${O}/>`,
  banana: () => `<path d="M18 30c6 34 34 54 66 46 4-1 4-6 0-6-26 2-46-14-54-40-2-6-14-6-12 0z" fill="#fdd835" ${O}/><path d="M14 30l-4-8" ${O}/>`,
  tissue: () => `<path d="M24 46l10-22 18 8 16-10 10 20-6 18 6 16-20 8-14-8-18 6-6-16z" fill="#eceff1" ${O}/><path d="M38 40l12 10M52 56l14-6M34 62l10-4" stroke="#90a4ae" stroke-width="3" stroke-linecap="round"/>`,
  can: () => `<rect x="30" y="20" width="40" height="64" rx="6" fill="#b0bec5" ${O}/><ellipse cx="50" cy="20" rx="20" ry="6" fill="#cfd8dc" ${O}/><rect x="30" y="40" width="40" height="22" fill="#e53935"/><path d="M40 52l20-6" stroke="#fff" stroke-width="3"/>`,

      for (const it of shuffle(pool)) {

function houseRender(T, stage) {
  const S = T.S, st = T.state;
  stage.appendChild(h('div', 'hint-line', T.holding ? `옮길 곳을 누르세요. (다시 누르면 내려놓기)` : '물건을 누른 뒤 옮길 곳을 누르세요. 스위치는 누르면 바뀝니다.'));

    const b = h('button', 'zone' + (T.holding ? ' ready' : ''), `<div class="ic">${svg(z.id)}</div><div class="nm">${z.name}</div><div class="inbox"></div>`);
    b.dataset.zone = z.id;
    S.objs.filter(o => st.where[o.id] === z.id).forEach(o => b.querySelector('.inbox').insertAdjacentHTML('beforeend', svg(o.icon, o.color ? CCSS[o.color] : undefined)));
    b.onclick = () => {

  stage.appendChild(zones);
  const sws = h('div', 'switches');

    b.dataset.sw = s.id;

function fmtPhone(n) {

  if (n.length === 10) return `${n.slice(0, 3)}-${n.slice(3, 6)}-${n.slice(6)}`;

  if (n.length === 8) return `${n.slice(0, 4)}-${n.slice(4)}`;
  return n;
}
const sayNum = n => fmtPhone(n);  // 화면 글과 소리 모두 하이픈 형식

function deviceTrial(lv) {
  const dev = pick(['tv', 'mw', 'phone']);
  let init, target, text, kind;
  if (dev === 'tv') {
    const ch = rnd(1, 9), vol = rnd(6, 14);
    const other = c => pick([1, 2, 3, 4, 5, 6, 7, 8, 9].filter(x => x !== c));
    if (lv === 1) { const on = Math.random() < 0.5; init = { power: on, ch, vol }; target = { ...init, power: !on }; text = on ? 'TV를 끄세요.' : 'TV를 켜세요.'; kind = '전원'; }
    else if (lv === 2) {
      init = { power: true, ch, vol };
      const w = pick(['num', 'up', 'down', 'chup']);
      if (w === 'num') { const n = other(ch); target = { ...init, ch: n }; text = `채널 ${n}번을 누르세요.`; }
      else if (w === 'up') { target = { ...init, vol: vol + 1 }; text = '음량을 한 번 올리세요.'; }
      else if (w === 'down') { target = { ...init, vol: vol - 1 }; text = '음량을 한 번 내리세요.'; }
      else { target = { ...init, ch: ch % 9 + 1 }; text = '채널을 한 번 올리세요.'; }
      kind = '버튼 하나';
    }
    else if (lv === 3) { const n = other(ch); init = { power: false, ch, vol }; target = { power: true, ch: n, vol }; text = `TV를 켜고, 채널 ${n}번으로 바꾸세요.`; kind = '두 단계'; }
    else if (lv === 4) { const n = other(ch), d = pick([2, 3]), up = Math.random() < 0.5; init = { power: false, ch, vol }; target = { power: true, ch: n, vol: vol + (up ? d : -d) };
      text = `TV를 켜고, 채널 ${n}번으로 바꾼 다음, 음량을 ${d === 2 ? '두' : '세'} 번 ${up ? '올리세요' : '내리세요'}.`; kind = '세 단계'; }
    else { const on = Math.random() < 0.5, n = other(ch); init = { power: on, ch, vol };
      target = on ? { ...init, ch: n } : { ...init, power: true, vol: vol + 1 };
      text = `TV가 켜져 있으면 채널 ${n}번으로 바꾸고, 꺼져 있으면 TV를 켠 다음 음량을 한 번 올리세요.`; kind = '조건'; }
  } else if (dev === 'mw') {
    if (lv === 1) { if (Math.random() < 0.5) { init = { time: 30, running: false }; target = { time: 30, running: true }; text = '시작 버튼을 누르세요.'; }
                    else { init = { time: 0, running: false }; target = { time: 60, running: false }; text = '1분 버튼을 누르세요.'; } kind = '버튼 하나'; }
    else if (lv === 2) { const t = pick([20, 30, 40, 120]); init = { time: 0, running: false }; target = { time: t, running: false }; text = `${tlabel(t)}를 맞추세요.`.replace('분를', '분을'); kind = '시간 맞추기'; }
    else if (lv === 3) { const t = pick([20, 30, 40, 50, 60, 120]); init = { time: 0, running: false }; target = { time: t, running: true }; text = `${eul(tlabel(t))} 맞추고, 시작을 누르세요.`; kind = '두 단계'; }
    else if (lv === 4) { const t = pick([70, 80, 90, 130, 150]); init = { time: 0, running: false }; target = { time: t, running: true }; text = `${eul(tlabel(t))} 맞추고, 시작을 누르세요.`; kind = '세 단계 이상'; }
    else {
      if (Math.random() < 0.5) { const wrong = pick([150, 180, 240]), t = pick([50, 80, 90]); init = { time: wrong, running: false }; target = { time: t, running: true };
        text = `시간이 잘못 맞춰져 있어요. 취소를 누르고 ${eul(tlabel(t))} 다시 맞춘 뒤 시작하세요.`; kind = '고쳐서 하기'; }
      else { const cur = pick([30, 40, 90, 120]); init = { time: cur, running: false };
        target = cur > 60 ? { time: 30, running: true } : { time: cur, running: true };
        text = '맞춰진 시간이 1분보다 길면 취소하고 30초를 맞춰서 시작하고, 1분보다 짧으면 그대로 시작하세요.'; kind = '조건'; }
    }
  } else {
    const r4 = () => String(rnd(1000, 9999)), r3 = () => String(rnd(200, 899));
    if (lv === 1) { const n = '010' + r4() + r4(); init = { num: n, calling: false }; target = { num: n, calling: true }; text = '통화 버튼을 누르세요.'; kind = '버튼 하나'; }
    else if (lv === 2) { const n = pick(['119', '112', '114', '120']); init = { num: '', calling: false }; target = { num: n, calling: false }; text = `${eul(n)} 누르세요.`; kind = '번호 누르기'; }
    else if (lv === 3) { const n = pick(['119', '112', '1330', '1577']); init = { num: '', calling: false }; target = { num: n, calling: true }; text = `${euro(n)} 전화를 거세요.`; kind = '두 단계'; }
    else if (lv === 4) { const n = r3() + r4(); init = { num: '', calling: false }; target = { num: n, calling: true }; text = `${euro(sayNum(n))} 전화를 거세요.`; kind = '긴 번호'; }
    else {
      if (Math.random() < 0.5) { const n = '010' + r4() + r4(); init = { num: '', calling: false }; target = { num: n, calling: true }; text = `${euro(sayNum(n))} 전화를 거세요.`; kind = '긴 번호'; }
      else { const wrong = String(rnd(10, 99)) + String(rnd(10, 99)), n = pick(['119', '112']); init = { num: wrong, calling: false }; target = { num: n, calling: true };
        text = `번호가 잘못 눌려 있어요. 모두 지운 뒤 ${euro(n)} 전화를 거세요.`; kind = '고쳐서 하기'; }
    }
  }
  return { dev, init, target, text, kind, ordered: true };
}

function deviceRender(T, stage) {

    btn('시작', 'start', () => { if (s.time > 0) s.running = true; });

    btn('', '', () => {}); pad.lastChild.style.visibility = 'hidden';
    btn('통화', 'call', () => { if (s.num.length >= 3) s.calling = true; });
    btn('', '', () => {}); pad.lastChild.style.visibility = 'hidden';

let koVoice = null;
const canSpeak = 'speechSynthesis' in window;
function loadVoice() { if (!canSpeak) return; koVoice = speechSynthesis.getVoices().find(v => /ko/i.test(v.lang)) || null; renderVoiceNote(); }
if (canSpeak) { loadVoice(); speechSynthesis.onvoiceschanged = loadVoice; }
function spoken(text) {  // 전화번호는 숫자를 하나씩 읽도록
  return text.replace(/[0-9][0-9-]{2,}[0-9]/g, m => m.split('').map(c => c === '-' ? ', ' : '공일이삼사오육칠팔구'[+c]).join(' '));
}
function speak(text, onEnd) {
  if (!canSpeak || S.cfg.pres === 'text') { onEnd && onEnd(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(spoken(text));
  u.lang = 'ko-KR'; if (koVoice) u.voice = koVoice; u.rate = 0.85;
  let ended = false; const done = () => { if (!ended) { ended = true; onEnd && onEnd(); } };
  u.onend = done; u.onerror = done;
  setTimeout(done, 1500 + text.length * 280);
  speechSynthesis.speak(u);
}
function renderVoiceNote() {
  const el = $('voice-note'); if (!el) return;
  el.textContent = !canSpeak || !koVoice ? '이 기기에서는 한국어 음성을 찾지 못했습니다. 소리가 나오지 않으면 "글만"으로 하거나 치료사가 지시를 읽어 주세요.' : '';
}

let S = null, T = null;

function go(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  $('scr-' + name).classList.add('on');
  window.scrollTo(0, 0);
  if (name === 'set') renderSettings();
}

function startSession() {
  if (cfg.pres !== 'text' && (!canSpeak || !koVoice) && !confirm('한국어 음성을 찾지 못했습니다. 소리가 나오지 않을 수 있어요. 계속할까요?')) return;
  S = { cfg: { ...cfg }, name: $('pname').value.trim(), level: cfg.level, log: [], ok: 0, bad: 0, path: [cfg.level], t0: Date.now(), mixIdx: rnd(0, 2) };
  go('run'); nextTrial();
}

function makeTrial(theme, lv) {
  if (theme === 'pick') { const t = pickTrial(lv); return { ...t, theme, lv, taps: [], log: [] }; }
  if (theme === 'house') { const t = houseTrial(lv); return { ...t, theme, lv, log: [], hist: [], holding: null, state: { where: {}, sw: { ...t.S.sw } } }; }
  const t = deviceTrial(lv); return { ...t, theme, lv, presses: [], state: JSON.parse(JSON.stringify(t.init)) };
}

function nextTrial() {
  if (S.log.length >= S.cfg.count) { finish(); return; }
  const theme = S.cfg.theme === 'mix' ? ['pick', 'house', 'device'][(S.mixIdx + S.log.length) % 3] : S.cfg.theme;
  T = makeTrial(theme, S.level);
  T.replays = 0; T.shownAt = 0; T.done = false;
  $('r-level').textContent = `${THEMES[theme].short} · ${T.lv}단계 ${LV_TITLE[T.lv]}`;
  $('r-prog').textContent = `${S.log.length + 1} / ${S.cfg.count}`;
  $('fb').innerHTML = ''; $('fb').className = '';
  renderStage();
  const it = $('instr-text');
  const showText = S.cfg.pres !== 'audio';
  it.className = showText ? '' : 'dim';
  it.textContent = showText ? T.text : '잘 들어 보세요.';
  $('replay-btn').style.display = S.cfg.pres === 'text' ? 'none' : '';
  if (S.cfg.mem === 'memory') {
    $('stage').classList.add('veiled'); $('replay-btn').disabled = true; setActions([]);
    const reveal = () => setActions([{ t: '준비됐어요', cls: 'b-pri', fn: () => {
      it.className = 'dim'; it.textContent = '기억한 대로 해 보세요.'; $('replay-btn').disabled = false; begin();
    } }]);
    if (S.cfg.pres === 'text') reveal(); else speak(T.text, reveal);
  } else { $('replay-btn').disabled = false; begin(); speak(T.text); }
}

function begin() {
  $('stage').classList.remove('veiled', 'locked');
  T.shownAt = performance.now();
  const single = T.theme === 'pick' && T.expect.length === 1 && T.ordered;
  const acts = [];
  if (!single) {
    acts.push({ t: '처음부터', cls: 'b-sec', fn: resetTrial });
    acts.push({ t: '다 했어요', cls: 'b-ok', fn: submit });
  }
  setActions(acts);
}

function resetTrial() {
  if (T.done) return;
  if (T.theme === 'pick') { T.taps = []; T.log = []; }
  else if (T.theme === 'house') { T.log = []; T.hist = []; T.holding = null; T.state = { where: {}, sw: { ...T.S.sw } }; }
  else { T.presses = []; T.state = JSON.parse(JSON.stringify(T.init)); }
  T.resets = (T.resets || 0) + 1;
  renderStage();
}

function renderStage() {
  const st = $('stage'); st.innerHTML = '';
  if (T.theme === 'pick') pickRender(T, st);
  else if (T.theme === 'house') houseRender(T, st);
  else deviceRender(T, st);
}

function replay() {
  if (!T || T.done) return;
  T.replays++;
  speak(T.text);
}

function evalList(log, exp, ordered) {
  const extra = log.filter(x => !exp.includes(x)), missing = exp.filter(x => !log.includes(x));
  const okSteps = ordered ? exp.filter((x, i) => log[i] === x).length : exp.filter(x => log.includes(x)).length;
  const correct = ordered ? (log.length === exp.length && log.every((x, i) => x === exp[i])) : (!extra.length && !missing.length && log.length === exp.length);
  let err = null;
  if (!correct) {
    if (extra.length && !missing.length) err = 'extra';
    else if (extra.length) err = 'item';
    else if (missing.length) err = 'omit';
    else if (log.length > exp.length) err = 'extra';
    else err = 'order';
  }
  return { correct, err, okSteps, steps: exp.length };
}

function submit() {
  if (T.done) return;
  const empty = T.theme === 'device' ? !T.presses.length : !T.log.length;
  if (empty) { $('fb').className = 'bad'; $('fb').textContent = '아직 아무것도 하지 않았어요.'; return; }
  T.done = true;
  if (canSpeak) speechSynthesis.cancel();
  const rt = performance.now() - T.shownAt;
  let r, mine, right;
  if (T.theme === 'device') {
    const D = DEVICES[T.dev], ok = D.same(T.state, T.target);
    r = { correct: ok, err: ok ? null : 'state', okSteps: ok ? 1 : 0, steps: 1 };
    mine = `${D.describe(T.state)} (누른 버튼: ${T.presses.join(', ')})`;
    right = D.describe(T.target);
  } else {
    r = evalList(T.log, T.expect, T.ordered);
    const desc = T.theme === 'pick' ? k => pickDesc(T, k) : k => houseDesc(T, k);
    mine = T.log.map(desc).join(' → ');
    right = T.expect.map(desc).join(T.ordered ? ' → ' : ', ');
  }
  S.log.push({ theme: T.theme, lv: T.lv, kind: T.kind, text: T.text, ...r, rt, replays: T.replays, resets: T.resets || 0 });

  $('stage').classList.add('locked');
  if (T.theme === 'pick') pickReveal(T);
  if (T.theme === 'house') houseReveal(T);
  $('instr-text').className = ''; $('instr-text').textContent = T.text;
  const fb = $('fb');
  fb.className = r.correct ? 'ok' : 'bad';
  fb.innerHTML = r.correct ? '정답입니다!'
    : `아쉬워요. (${ERR_NAME[r.err]})<small>한 것: ${mine}<br>정답: ${right}</small>`;

  if (S.cfg.prog === 'auto') {
    let move = '';
    if (r.correct) { S.ok++; S.bad = 0; } else { S.bad++; S.ok = 0; }
    if (S.ok >= 3 && S.level < 5) { S.level++; S.ok = 0; move = `잘하셨어요! ${S.level}단계로 올라갑니다.`; }
    else if (S.bad >= 2 && S.level > 1) { S.level--; S.bad = 0; move = `${S.level}단계로 돌아가 연습해요.`; }
    if (move) { S.path.push(S.level); fb.innerHTML += `<small>${move}</small>`; }
  }
  setActions([{ t: S.log.length >= S.cfg.count ? '결과 보기' : '다음 문제', cls: 'b-pri', fn: nextTrial }]);
}

function setActions(list) {
  const row = $('act-row'); row.innerHTML = '';
  list.forEach(a => { const b = h('button', 'big-btn ' + a.cls, a.t); b.onclick = a.fn; row.appendChild(b); });
}

// ══════════════════════════════════════════════════════════════
// 결과
// ══════════════════════════════════════════════════════════════
function finish() {
  if (canSpeak) speechSynthesis.cancel();
  const log = S.log, c = S.cfg;
  const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '-';
  const sec = a => a.length ? (a.reduce((x, y) => x + y, 0) / a.length / 1000).toFixed(1) + '초' : '-';
  const ok = log.filter(r => r.correct).length;
  const ms = log.filter(r => r.theme !== 'device'), sOk = ms.reduce((s, r) => s + r.okSteps, 0), sAll = ms.reduce((s, r) => s + r.steps, 0);
  const highest = log.filter(r => r.correct).reduce((m, r) => Math.max(m, r.lv), 0);

  let rows = '';
  ['pick', 'house', 'device'].forEach(th => [1, 2, 3, 4, 5].forEach(lv => {
    const g = log.filter(r => r.theme === th && r.lv === lv); if (!g.length) return;
    const gk = g.filter(r => r.correct);
    rows += `<tr><td class="l">${THEMES[th].short}</td><td>${lv}단계</td><td>${g.length}</td><td>${gk.length}</td><td>${pct(gk.length, g.length)}</td><td>${sec(gk.map(r => r.rt))}</td><td>${g.reduce((s, r) => s + r.replays, 0)}회</td></tr>`;
  }));
  const errs = Object.keys(ERR_NAME).map(k => [k, log.filter(r => r.err === k).length]).filter(x => x[1] || x[0] !== 'state')
    .map(([k, n]) => `<tr><td class="l">${ERR_NAME[k]}</td><td>${n}회</td></tr>`).join('');

  $('rep').innerHTML = `
    <h2>지시 따르기 훈련 결과</h2>
    <div class="meta">환자명: ${S.name || '—'} · ${new Date().toLocaleDateString('ko-KR')} ·
      ${OPTS.theme.find(o => o.v === c.theme).t} · ${OPTS.prog.find(o => o.v === c.prog).t} · ${OPTS.pres.find(o => o.v === c.pres).t} ·
      ${OPTS.mem.find(o => o.v === c.mem).t} · 총 ${Math.round((Date.now() - S.t0) / 1000)}초</div>
    <table>
      <tr><th>문제 수</th><th>정답</th><th>정확도</th><th>지시 단위 정확도</th><th>정답한 최고 단계</th></tr>
      <tr><td>${log.length}</td><td>${ok}</td><td>${pct(ok, log.length)}</td><td>${sAll ? `${sOk}/${sAll} (${pct(sOk, sAll)})` : '-'}</td><td>${highest ? highest + '단계' : '-'}</td></tr>
    </table>
    ${c.prog === 'auto' ? `<p><b>단계 변화:</b> ${S.path.map(n => n + '단계').join(' → ')}</p>` : ''}
    <table><tr><th class="l">과제</th><th>단계</th><th>문제 수</th><th>정답</th><th>정확도</th><th>평균 수행시간</th><th>다시 듣기</th></tr>${rows}</table>
    <table><tr><th class="l">오류 유형</th><th>횟수</th></tr>${errs}</table>
    <table><tr><th>번호</th><th>과제</th><th>단계</th><th class="l">지시</th><th>결과</th></tr>
      ${log.map((r, i) => `<tr><td>${i + 1}</td><td>${THEMES[r.theme].short}</td><td>${r.lv}</td><td class="l">${r.text}</td><td>${r.correct ? '<span class="okc">정답</span>' : `<span class="badc">${ERR_NAME[r.err]}</span>`}</td></tr>`).join('')}
    </table>
    <p class="note">평균 수행시간은 정답 문제에서 화면이 보인 뒤 “다 했어요”까지의 시간입니다. 지시 단위 정확도는 물건 고르기·집안 정리에서 여러 단계 지시 중 맞게 한 단계의 비율입니다. 기기 조작은 마지막 결과(켜짐·채널·시간·번호 등)로 채점합니다.</p>`;
  go('rep');
}

renderSettings();
</script>
</body>
</html>
