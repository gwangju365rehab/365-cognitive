<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>잠깐 멈춤 훈련 - 광주365재활병원</title>
<style>
:root{
  --ink:#1f2433; --sub:#5b6375; --line:#d5dbe6; --bg:#eef1f6; --card:#fff;
  --pri:#283593; --pri-2:#3f51b5; --pri-soft:#e8eaf6;
  --ok:#2e7d32; --ok-soft:#e8f5e9; --bad:#c62828; --bad-soft:#fdecea;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  background:var(--bg);color:var(--ink);font-size:18px;line-height:1.5;padding:16px 14px 90px}
button{font:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
button:focus-visible{outline:3px solid #ffb300;outline-offset:2px}
.wrap{max-width:840px;margin:0 auto;display:flex;flex-direction:column}
.wrap>*+*{margin-top:14px}
.screen{display:none}
.screen.on{display:flex}

#home-btn,#back-btn{position:fixed;top:12px;left:12px;z-index:50;padding:10px 18px;border-radius:999px;border:none;min-height:44px;
  background:#fff;color:#333;font-weight:700;font-size:15px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
#back-btn{left:112px;background:var(--pri);color:#fff;display:none}
h1{margin:30px 0 0;text-align:center;font-size:1.8rem;color:#1a237e;font-weight:800}
.lead{text-align:center;color:var(--sub);font-size:1rem;margin:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.row{display:flex;align-items:center;flex-wrap:wrap}
.row>*{margin:4px}
.lbl{font-size:.92rem;font-weight:800;color:var(--sub);margin:4px 0 6px}

/* 탭·난이도 */
.tabs{display:flex;justify-content:center;flex-wrap:wrap}
.tab{margin:4px;padding:12px 20px;border-radius:999px;border:2px solid var(--line);background:#fff;font-weight:800;color:var(--sub);min-height:50px}
.tab.on{background:var(--pri);border-color:var(--pri);color:#fff}
.task-head{display:flex;align-items:center}
.task-head svg{flex:none;margin-right:14px}
.task-head .t{font-size:1.25rem;font-weight:800}
.task-head .k{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--pri-soft);color:var(--pri);font-size:.82rem;font-weight:800;margin-left:6px;vertical-align:middle}
.task-head .d{color:var(--sub);font-size:.98rem}
.lv-btn{display:flex;align-items:center;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 16px;min-height:66px;margin-bottom:10px}
.lv-btn.on{border-color:var(--pri-2);background:var(--pri-soft)}
.lv-btn .lvn{flex:none;min-width:84px;text-align:center;padding:8px 0;border-radius:10px;font-weight:800;color:#fff;margin-right:14px}
.lv1 .lvn{background:#43a047}.lv2 .lvn{background:#1e88e5}.lv3 .lvn{background:#e53935}
.seg{display:flex;flex-wrap:wrap}
.seg button{margin:3px;min-width:72px;min-height:48px;padding:10px 14px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:700}
.seg button.on{border-color:var(--pri-2);background:var(--pri-2);color:#fff}
.set-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:8px 0;border-top:1px solid #eceff4}
.set-row .nm{font-weight:700}
.big-btn{padding:16px 26px;border-radius:14px;border:none;font-size:1.15rem;font-weight:800;min-height:60px}
.b-pri{background:var(--pri);color:#fff}
.b-sec{background:#fff;color:var(--ink);border:2px solid var(--line)}
.foot{display:flex;justify-content:flex-end;flex-wrap:wrap}
.foot>*{margin-left:10px;margin-top:6px}

/* 전략 카드 */
.strat{display:flex;flex-wrap:wrap;justify-content:center}
.strat .st{flex:1 1 180px;margin:5px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.strat .st b{display:block;font-size:1.4rem;color:var(--pri);margin-bottom:4px}
.strat .no{display:inline-block;width:32px;height:32px;line-height:32px;border-radius:50%;background:var(--pri);color:#fff;font-weight:800;margin-bottom:6px}

/* 예측·결과 */
.q{padding:10px 0;border-top:1px solid #eceff4}
.q:first-child{border-top:none}
.q .qt{font-weight:800;margin-bottom:8px}
.cmp{margin-top:8px;padding:10px 14px;border-radius:12px;background:#f6f7fb;font-weight:700}
.okc{color:var(--ok);font-weight:800}.badc{color:var(--bad);font-weight:800}.subc{color:var(--sub);font-weight:700}
.tiles{display:flex;flex-wrap:wrap;margin:-5px}
.tile{flex:1 1 150px;margin:5px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.tile .v{font-size:1.5rem;font-weight:900;font-variant-numeric:tabular-nums}
.tile .k{font-size:.85rem;color:var(--sub);font-weight:700}
.chipq{display:inline-block;padding:4px 12px;border-radius:999px;background:var(--pri-soft);color:var(--pri);font-weight:800;font-size:.9rem}

/* 과제 화면 */
.tbar{margin-top:46px;display:flex;align-items:center;flex-wrap:wrap;background:var(--pri);color:#fff;border-radius:16px;padding:12px 16px}
.tbar .ttl{flex:1;font-size:1.15rem;font-weight:800}
.tbar .pg{font-variant-numeric:tabular-nums;font-weight:700;background:rgba(0,0,0,.2);padding:6px 12px;border-radius:10px;margin-left:8px}
.tbar .quit{background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:10px;padding:8px 14px;font-weight:700;min-height:40px;margin-left:8px}
.cue{text-align:center}
.stage{background:#fff;border:2px solid var(--line);border-radius:18px;height:340px;position:relative;overflow:hidden;user-select:none;-webkit-user-select:none}
.fbline{min-height:2.2rem;text-align:center;font-size:1.25rem;font-weight:800}
.resp{display:flex;justify-content:center}
.resp button{flex:1;max-width:380px;margin:0 7px;min-height:96px;border-radius:18px;border:none;font-size:1.5rem;font-weight:900;color:#fff;background:var(--pri-2);box-shadow:0 4px 0 #1a237e;
  display:flex;align-items:center;justify-content:center}
.resp button svg{margin:0 8px}
.resp button:active{transform:translateY(3px);box-shadow:0 1px 0 #1a237e}
.resp button.go{background:#2e7d32;box-shadow:0 4px 0 #1b5e20}
.pause{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);display:flex;align-items:center;justify-content:center;z-index:9}

/* 장보기: 장바구니 목록 */
.cartbox{background:#fffdf5;border:2px solid #ead9a6;border-radius:14px;padding:10px 14px}
.cartbox .h{font-weight:800;color:#8a6d1a;font-size:.95rem;text-align:center}
.cartbox .items{display:flex;flex-wrap:wrap;justify-content:center;margin-top:4px}
.ci{display:flex;align-items:center;margin:4px 6px;background:#fff;border:2px solid #ead9a6;border-radius:12px;padding:5px 12px;font-weight:800;font-size:1.1rem}
.ci.full{border-color:#81c784;background:#f1f8e9}
.ci .q{border:none;padding:0;margin-left:8px;font-size:.95rem;color:var(--sub);font-weight:800}
.pip{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid #9aa2b2;margin-left:4px;vertical-align:middle}
.pip.on{background:#43a047;border-color:#43a047}
/* 장보기: 진열대 */
.shelf{background:linear-gradient(#f7f3ea 0,#f7f3ea 72%,#a1887f 72%,#8d6e63 76%,#efebe9 76%)}
.shelf .tag{position:absolute;left:16px;top:12px;background:#fff;border:2px solid #d7ccc8;border-radius:10px;padding:2px 10px;font-weight:800;color:#6d4c41;font-size:.9rem}
.pk{position:absolute;bottom:26%;left:100%;width:210px;height:200px;border-radius:18px;border:3px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.12);cursor:pointer;will-change:transform}
.pk .nm{font-size:1.75rem;font-weight:900;line-height:1.2;margin-top:6px;padding:0 8px;word-break:keep-all}
.pk .ct{font-size:.85rem;font-weight:800;opacity:.75}
.pk .sale{white-space:pre-line;position:absolute;top:-14px;right:-14px;width:74px;height:74px;border-radius:50%;background:#e53935;color:#fff;font-weight:900;font-size:1.15rem;
  display:flex;align-items:center;justify-content:center;transform:rotate(12deg);box-shadow:0 3px 0 #b71c1c;line-height:1.05;text-align:center}
.pk.bad{animation:shake .3s}
@keyframes shake{25%{margin-left:-8px}75%{margin-left:8px}}

/* 횡단보도 */
.road svg{width:100%;height:100%;display:block}
#rd-person,#rd-car{transition:transform .8s ease-out}
.blink{animation:blink .45s steps(1) infinite}
@keyframes blink{50%{opacity:.08}}
.danger{position:absolute;left:0;right:0;top:0;bottom:0;background:rgba(229,57,53,.25);pointer-events:none}

/* 병원 길 찾기 */
.dest{text-align:center}
.dest span{display:inline-block;background:#fdd835;color:#212121;font-weight:900;font-size:1.6rem;border-radius:12px;padding:8px 24px;box-shadow:0 3px 0 #c6a700;min-width:300px}
.dest span.wait{background:#eceff1;color:#90a4ae;box-shadow:none}
.wayboard{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#0d47a1;border:6px solid #e3f2fd;outline:3px solid #0d47a1;border-radius:14px;padding:8px;min-width:440px}
.wrow{display:flex;align-items:center;justify-content:space-between;background:#1565c0;color:#fff;border-radius:8px;padding:2px 14px;margin:5px 0;font-size:1.35rem;font-weight:800;min-height:48px}
.wrow svg{width:36px;height:36px}
.wrow .tx{flex:1;padding:0 12px}
.wrow.al-r .tx{text-align:right}
.wrow.hit{background:#2e7d32}.wrow.miss{background:#c62828}

/* 리포트 */
.rep h2{margin:0 0 4px;font-size:1.4rem}
.rep .meta{color:var(--sub);margin-bottom:10px}
.rep table{width:100%;border-collapse:collapse;font-size:.92rem;margin:6px 0 12px;background:#fff}
.rep th,.rep td{border:1px solid var(--line);padding:6px 8px;text-align:center;vertical-align:middle}
.rep th{background:#f3f5fa}
.rep td.l{text-align:left}
#scr-rep{margin-top:50px}
textarea{font:inherit;width:100%;min-height:80px;padding:10px;border:2px solid var(--line);border-radius:10px}
.note{font-size:.85rem;color:var(--sub)}
#err-box{display:none;position:fixed;left:10px;right:10px;bottom:40px;z-index:99;background:#fdecea;color:#c62828;border:2px solid #ef9a9a;border-radius:12px;padding:10px 14px;font-size:.9rem;font-weight:700}
#hospital-logo{position:fixed;bottom:10px;right:14px;font-size:.8rem;color:#9aa2b2;font-weight:700}
@media(max-width:600px){.wayboard{min-width:300px}.wrow{font-size:1.1rem}.pk{width:170px;height:170px}.pk .nm{font-size:1.35rem}}
@media print{
  body{background:#fff;padding:0;font-size:12px}
  #home-btn,#back-btn,#hospital-logo,#err-box,.no-print{display:none!important}
  .panel{border:none;padding:0}
  #scr-rep{margin-top:0}
}
</style>
</head>

<button id="home-btn" onclick="location.href='index.html'">홈으로</button>
<button id="back-btn" onclick="backBtn()">처음으로</button>

<!-- 시작 화면 -->
<div class="wrap screen on" id="scr-home">
  <h1>잠깐 멈춤 훈련</h1>

  <div class="tabs" id="tabs"></div>
  <div class="panel" id="task-info"></div>
  <div class="panel">
    <div class="lbl">난이도</div>
    <div id="lv-list"></div>
    <div class="set-row"><span class="nm">블록 수</span><span id="set-blocks"></span></div>
    <div class="set-row"><span class="nm">블록당 문제 수</span><span id="set-trials"></span></div>

<div class="wrap screen" id="scr-strat">

    <div class="lbl">이렇게 해 보세요</div>
    <div class="strat">
      <div class="st"><div class="no">1</div><b>잠깐</b>바로 누르지 말고 멈춥니다</div>

      <div class="st"><div class="no">3</div><b>누르기</b><span id="s-do"></span></div>

  <div class="foot"><button class="big-btn b-sec" onclick="startBlock(null,true)">연습해 보기 (5문제)</button><button class="big-btn b-pri" onclick="toPredict()">시작하기</button></div>
</div>

<!-- 예측 -->
<div class="wrap screen" id="scr-pred">
  <div class="tbar"><div class="ttl" id="p-title"></div></div>
  <div class="panel" id="p-body"></div>
  <div class="foot"><button class="big-btn b-pri" id="p-go" disabled>블록 시작</button></div>
</div>

<!-- 과제 -->
<div class="wrap screen" id="scr-task">
  <div class="tbar"><div class="ttl" id="t-title"></div><div class="pg" id="t-pg"></div><button class="quit" onclick="quitBlock()">그만하기</button></div>
  <div class="cue" id="t-cue"></div>
  <div id="t-top"></div>
  <div class="stage" id="stage"></div>
  <div class="fbline" id="fb"></div>
  <div class="resp" id="resp"></div>
</div>

<!-- 블록 결과 -->
<div class="wrap screen" id="scr-rev">
  <div class="tbar"><div class="ttl" id="r-title"></div></div>
  <div class="panel" id="r-body"></div>
  <div class="foot"><button class="big-btn b-pri" id="r-next" disabled></button></div>
</div>

<!-- 최종 리포트 -->
<div class="wrap screen" id="scr-rep">
  <div class="panel rep" id="rep-body"></div>
  <div class="row no-print" style="justify-content:center">
    <button class="big-btn b-sec" onclick="go('home')">처음으로</button>
    <button class="big-btn b-pri" onclick="window.print()">인쇄하기</button>
  </div>
</div>

<div id="err-box"></div>
<div id="hospital-logo">광주365재활병원_인지연하팀</div>

<script>
// 오류가 나면 화면 아래에 표시 (구형 브라우저 진단용)
window.onerror=function(msg,src,line){var b=document.getElementById('err-box');if(b){b.style.display='block';b.textContent='오류: '+msg+' (줄 '+line+') — 이 화면을 사진으로 보내 주세요.';}};
</script>
<script>
"use strict";
// ══ 도구 ══════════════════════════════════════════════
function flatten(a){const out=[];(function f(x){x.forEach(y=>Array.isArray(y)?f(y):out.push(y));})(a);return out;}
function h(tag, props, ...kids){
  const e=document.createElement(tag);
  if(props) for(const k in props){
    const v=props[k];
    if(v==null||v===false) continue;
    if(k==='class') e.className=v;
    else if(k==='html') e.innerHTML=v;
    else if(k.indexOf('on')===0) e.addEventListener(k.slice(2),v);
    else if(k==='style') e.style.cssText=v;
    else if(k==='disabled') e.disabled=!!v;
    else e.setAttribute(k,v);
  }
  flatten(kids).forEach(c=>{ if(c==null||c===false) return; e.appendChild(c.nodeType?c:document.createTextNode(String(c))); });
  return e;
}
// 누르기: 포인터 이벤트가 없는 구형 브라우저는 터치·마우스로 받음 (0.35초 안의 중복은 무시)
let LASTPRESS=0;
function bindPress(el,fn){
  const fire=e=>{ if(e&&e.cancelable) e.preventDefault(); const t=Date.now(); if(t-LASTPRESS<350) return; LASTPRESS=t; fn(); };
  if(window.PointerEvent) el.addEventListener('pointerdown',fire);
  else { el.addEventListener('touchstart',fire,{passive:false}); el.addEventListener('mousedown',fire); }
  el.addEventListener('click',()=>{ if(Date.now()-LASTPRESS>350){ LASTPRESS=Date.now(); fn(); } });
  return el;
}
const $=id=>document.getElementById(id);
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
const rnd=(a,b)=>a+Math.random()*(b-a);
const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
const sec=ms=>ms==null?'-':(ms/1000).toFixed(2)+'초';
const pct=(n,d)=>d?Math.round(n/d*100)+'%':'-';
const now=()=>performance.now();
function seg(options,onPick,cur,fmtFn){
  const s=h('div',{class:'seg'});
  options.forEach(o=>s.appendChild(h('button',{class:o===cur?'on':'',onclick:()=>onPick(o)},fmtFn?fmtFn(o):o)));
  return s;
}
function pad2(n){return (n<10?'0':'')+n;}
function todayStr(){const d=new Date();return d.getFullYear()+'.'+pad2(d.getMonth()+1)+'.'+pad2(d.getDate());}
function noRepeat(a,key){
  for(let k=0;k<80;k++){ const t=shuffle(a); let ok=true; for(let i=1;i<t.length;i++) if(key(t[i])===key(t[i-1])){ok=false;break;} if(ok) return t; }
  return shuffle(a);
}
let PAUSED=false;

// ══ 소리 (경적) ══════════════════════════════════════════
let AC=null;
function initAudio(){ try{ if(!AC){const C=window.AudioContext||window.webkitAudioContext; if(C) AC=new C();} if(AC&&AC.state!=='running') AC.resume(); }catch(e){} }
function horn(){
  if(!SET.sound||!AC) return;
  try{ const t=AC.currentTime;
    [0,0.22].forEach(d=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type='square'; o.frequency.value=420;
      o.connect(g); g.connect(AC.destination); g.gain.setValueAtTime(0.12,t+d); g.gain.exponentialRampToValueAtTime(0.001,t+d+0.18); o.start(t+d); o.stop(t+d+0.2); });
  }catch(e){}
}

// ══ 그림 ══════════════════════════════════════════════
const ICON={
  cart:'<svg width="56" height="56" viewBox="0 0 56 56"><rect width="56" height="56" rx="14" fill="#e8f5e9"/><path d="M12 16h5l5 20h18l4-14H20" fill="none" stroke="#2e7d32" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="42" r="3.2" fill="#2e7d32"/><circle cx="38" cy="42" r="3.2" fill="#2e7d32"/></svg>',
  walk:'<svg width="56" height="56" viewBox="0 0 56 56"><rect width="56" height="56" rx="14" fill="#fdecea"/><rect x="6" y="20" width="44" height="18" fill="#546e7a"/><path d="M12 24h6M22 24h6M32 24h6M12 34h6M22 34h6M32 34h6" stroke="#fff" stroke-width="3"/><rect x="40" y="6" width="10" height="16" rx="2" fill="#263238"/><circle cx="45" cy="11" r="2.6" fill="#ef5350"/><circle cx="45" cy="17" r="2.6" fill="#66bb6a"/></svg>',
  way:'<svg width="56" height="56" viewBox="0 0 56 56"><rect width="56" height="56" rx="14" fill="#e3f2fd"/><rect x="8" y="12" width="40" height="13" rx="3" fill="#1565c0"/><rect x="8" y="30" width="40" height="13" rx="3" fill="#1565c0"/><path d="M14 18.5h14m-4-4 4 4-4 4M42 36.5H28m4-4-4 4 4 4" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
};
// 상품 분류별 색과 그림
const CAT={

}

function toPredict(){
  const t=TASKS[SES.task], b=SES.list.length+1;
  $('p-title').textContent=`${t.name} · 블록 ${b}/${SES.blocks} 시작 전`;
  const body=$('p-body'); let pred=null;
  const draw=()=>{
    body.innerHTML='';
    if(b===1&&SES.practice) body.appendChild(h('div',{class:'q'},h('div',{class:'qt'},'연습 결과'),h('div',null,`${SES.practice.n}문제 중 실수 ${SES.practice.errors}번`)));
    if(b>1){const L=SES.list[b-2].stats; body.appendChild(h('div',{class:'q'},h('div',{class:'qt'},'지난 블록'),
      h('div',null,`실수 ${L.errors}번 (${t.errWords.com} ${L.com}번, ${t.errWords.om} ${L.om}번)`)));}
    if(SES.strategy) body.appendChild(h('div',{class:'q'},h('div',{class:'qt'},'이번 블록에서 쓸 전략'),h('span',{class:'chipq'},SES.strategy)));
    body.appendChild(h('div',{class:'q'},h('div',{class:'qt'},b===1?'시작하기 전에 예상해 보세요. 이번 블록에서 몇 번 실수할 것 같나요?':'이번 블록에서는 몇 번 실수할 것 같나요?'),
      seg(PRED,v=>{pred=v;draw();},pred)));
    $('p-go').disabled=pred==null;
  };
  draw();
  $('p-go').onclick=()=>startBlock(PRED.indexOf(pred),false);
  go('pred');
}

// ══ 블록 진행 ══════════════════════════════════════════
function startBlock(predIdx,practice){
  initAudio();
  const t=TASKS[SES.task], cfg=t.cfg[SES.level];
  const n=practice?5:SES.trials;
  const tr=makeTrials(SES.task,cfg,n,practice);
  CUR={pred:predIdx,strategy:SES.strategy,trials:tr,i:0,rec:[],timers:[],accept:false,onPress:null,ssd:cfg.ssd,stopped:false,practice:!!practice,
       list:tr.list||null,taken:{}};
  $('t-title').textContent=practice?t.name+' · 연습':`${t.name} · 블록 ${SES.list.length+1}/${SES.blocks}`;
  $('t-cue').innerHTML=SES.strategy&&!practice?`<span class="chipq">전략: ${SES.strategy}</span>`:'';
  $('t-top').innerHTML='';
  if(SES.task==='shop') drawCart();
  const resp=$('resp'); resp.innerHTML='';
  if(SES.task==='cross') resp.appendChild(bindPress(h('button',{class:'go'},'건너기'),()=>press('go')));
  if(SES.task==='way') { resp.appendChild(bindPress(h('button',{html:arrowSVG('L',40)+'왼쪽'}),()=>press('L')));
                         resp.appendChild(bindPress(h('button',{html:'오른쪽'+arrowSVG('R',40)}),()=>press('R'))); }
  const st=$('stage'); st.className='stage'; st.innerHTML='';
  if(SES.task==='shop'){ st.className='stage shelf'; st.appendChild(h('div',{class:'tag'},'진열대')); }
  if(SES.task==='cross'){ st.className='stage road'; st.innerHTML=roadSVG(); }
  $('fb').textContent='';
  go('task');
  later(nextTrial,900);
}
function later(fn,ms){const id=setTimeout(fn,ms);CUR.timers.push(id);return id;}
function clearTimers(){if(!CUR)return;CUR.timers.forEach(clearTimeout);CUR.timers=[];}
function stopBlock(){ if(CUR){clearTimers();CUR.stopped=true;CUR=null;} }
function quitBlock(){
  if(CUR&&CUR.practice){ stopBlock(); toPredict(); return; }
  if(!confirm('이번 블록을 그만할까요? 지금까지 푼 문제로 결과를 봅니다.')) return;
  const c=CUR; clearTimers(); c.stopped=true;
  if(!c.rec.length){ CUR=null; toPredict(); return; }
  endBlock(true);
}
function press(v){ if(CUR&&CUR.onPress) CUR.onPress(v); }

function makeTrials(task,cfg,n,practice){
  if(task==='shop'){
    const k=practice?2:cfg.k;
    const items=shuffle(SHOP_POOL).slice(0,k);
    const list=items.map(x=>({n:x.n,c:x.c,qty:pick(cfg.qty)}));
    const names=list.map(x=>x.n);
    const arr=[];
    list.forEach(x=>{ for(let i=0;i<x.qty+(practice?0:cfg.extra);i++) arr.push({n:x.n,c:x.c,kind:'list',sale:false}); });
    const nD=Math.max(n-arr.length,Math.round(arr.length*0.7));
    const lures=[]; items.forEach(x=>x.lure.forEach(l=>{ if(names.indexOf(l[0])<0) lures.push(l); }));
    for(let i=0;i<nD;i++){
      const useLure=lures.length&&Math.random()<cfg.lure, src=useLure?pick(lures):pick(SHOP_OTHER);
      arr.push({n:src[0],c:src[1],kind:useLure?'lure':'other',sale:Math.random()<cfg.sale});
    }
    // 목록 물건에도 가끔 할인 표시 (어려움): 할인이라서 담는 것이 아니라 목록이라서 담는 것을 구분
    if(cfg.sale>.5) arr.forEach(x=>{ if(x.kind==='list'&&Math.random()<.25) x.sale=true; });
    const t=noRepeat(arr,x=>x.n); t.list=list; return t;
  }
  if(task==='cross'){
    const nStop=Math.round(n*cfg.stop), nBlink=Math.round(n*cfg.blink), arr=[];
    for(let i=0;i<n;i++) arr.push({type:i<nStop?'stop':i<nStop+nBlink?'blink':'go'});
    let t, g=0; do{ t=shuffle(arr); g++; }while(g<200&&(t[0].type!=='go'||t[1].type!=='go'||runOf(t,x=>x.type!=='go')>2));
    return t;
  }
  // 병원 길 찾기
  const arr=[];
  for(let i=0;i<n;i++){
    const dir=Math.random()<.5?'L':'R', conf=Math.random()<cfg.conf, simon=Math.random()<cfg.simon;
    let dest, others=[];
    if(cfg.similar&&Math.random()<.7){ const g=pick(WAY_GROUPS); dest=pick(g); others=g.filter(x=>x!==dest).slice(0,1); }
    else dest=pick(WAY_ALL);
    const pool=shuffle(WAY_ALL.filter(x=>x!==dest&&others.indexOf(x)<0));
    while(others.length<cfg.rows-1) others.push(pool.pop());
    const rows=shuffle([{tx:dest,dir,target:true}].concat(others.map(o=>({tx:o,dir:conf?(dir==='L'?'R':'L'):dir,target:false}))));
    // 화살표 위치: 보통은 가리키는 쪽에 붙음. 위치 불일치(simon)면 반대편에 붙음
    rows.forEach(r=>{ r.side=r.target&&simon?(r.dir==='L'?'R':'L'):r.dir; });
    arr.push({dest,dir,conf,simon,rows});
  }
  return arr;
}
function runOf(a,f){let m=0,c=0;a.forEach(x=>{c=f(x)?c+1:0;if(c>m)m=c;});return m;}

function nextTrial(){
  if(!CUR||CUR.stopped) return;
  if(PAUSED){ later(nextTrial,300); return; }
  if(CUR.i>=CUR.trials.length){ endBlock(false); return; }
  $('t-pg').textContent=(CUR.i+1)+' / '+CUR.trials.length;
  $('fb').textContent='';
  const tr=CUR.trials[CUR.i];
  ({shop:runShop,cross:runCross,way:runWay})[SES.task](tr,rec=>{
    CUR.accept=false; CUR.onPress=null; clearTimers();
    CUR.rec.push(rec); CUR.i++;
    showFb(rec);
    later(nextTrial,SES.level===1?1300:1000);
  });
}
const stage=()=>$('stage');

function drawCart(){
  const cfg=TASKS.shop.cfg[SES.level], hide=cfg.hide&&!CUR.practice, top=$('t-top'); top.innerHTML='';
  const items=h('div',{class:'items'});
  CUR.list.forEach(x=>{
    const got=CUR.taken[x.n]||0, full=got>=x.qty;
    const pips=[]; for(let i=0;i<x.qty;i++) pips.push(h('span',{class:'pip'+(i<got?' on':'')}));
    items.appendChild(h('div',{class:'ci'+(full&&!hide?' full':'')},x.n,h('span',{class:'q'},x.qty+'개'),hide?null:pips));
  });
  top.appendChild(h('div',{class:'cartbox'},h('div',{class:'h'},hide?'장보기 목록 (담은 개수는 스스로 기억하세요)':'장보기 목록 · 담은 개수'),items));
}
function runShop(tr,done){
  const cfg=TASKS.shop.cfg[SES.level], st=stage();
  const old=st.querySelectorAll('.pk'); for(let i=0;i<old.length;i++) old[i].parentNode.removeChild(old[i]);
  const card=h('div',{class:'pk',style:`background:${CAT[tr.c].bg};border-color:${CAT[tr.c].fg};color:${CAT[tr.c].fg}`,html:catIcon(tr.c,64,tr.n)},
    h('div',{class:'nm'},tr.n),h('div',{class:'ct'},CAT[tr.c].nm),tr.sale?h('div',{class:'sale'},pick(SALES)):null);
  st.appendChild(card);
  const W=st.getBoundingClientRect().width, cw=card.getBoundingClientRect().width;
  const item=CUR.list.filter(x=>x.n===tr.n)[0];
  const needNow=()=>item?item.qty-(CUR.taken[tr.n]||0):0;
  let t0=0, ended=false;
  const fin=r=>{ if(ended) return; ended=true; done(r); };
  const base={n:tr.n,kind:tr.kind,sale:tr.sale};
  later(()=>{
    card.style.transition=`transform ${cfg.time}ms linear`;
    card.style.transform=`translateX(${-(W+cw+20)}px)`;
    t0=now(); CUR.accept=true;
    bindPress(card,()=>press('take'));
    CUR.onPress=()=>{
      if(!CUR.accept) return;
      const rt=now()-t0, need=needNow();
      freeze(card);
      if(need>0){
        CUR.taken[tr.n]=(CUR.taken[tr.n]||0)+1; drawCart();
        later(()=>{card.style.transition='transform .45s ease-in, opacity .45s';card.style.transform+=' translateY(-260px) scale(.5)';card.style.opacity='0';},20);
        fin(Object.assign(base,{go:true,resp:true,rt,correct:true,err:null}));
      }else{
        card.classList.add('bad');
        fin(Object.assign(base,{go:false,over:!!item,resp:true,rt,correct:false,err:'com'}));
      }
    };
    later(()=>{ const need=needNow(); card.remove();
      fin(Object.assign(base,{go:need>0,over:false,resp:false,rt:null,correct:need<=0,err:need>0?'om':null})); },cfg.time);
  },40);
}
function freeze(el){ const m=getComputedStyle(el).transform; el.style.transition='none'; el.style.transform=(m&&m!=='none')?m:''; }

function setSignal(s){
  const r=document.getElementById('sig-red'), g=document.getElementById('sig-green'); if(!r||!g) return;
  r.setAttribute('fill',s==='red'?'#ef5350':'#4e342e');
  g.setAttribute('fill',s==='red'?'#2e3b2d':'#43a047');
  if(s==='blink') g.classList.add('blink'); else g.classList.remove('blink');
}
function moveEl(id,tf,dur){ const e=document.getElementById(id); if(!e) return; e.style.transition='transform '+(dur||800)+'ms ease-out'; e.style.transform=tf; }
function dangerFlash(){ const d=h('div',{class:'danger'}); stage().appendChild(d); setTimeout(()=>{ if(d.parentNode) d.parentNode.removeChild(d); },700); }
function resetRoad(){
  const st=stage(); if(!document.getElementById('rd-person')) st.innerHTML=roadSVG();
  moveEl('rd-person','translateY(0px)',1); moveEl('rd-car','translateX(-340px)',1); setSignal('red');
}
function runCross(tr,done){
  const cfg=TASKS.cross.cfg[SES.level];
  resetRoad();
  let phase='wait', t0=0, ssd=null, ended=false;
  const fin=r=>{ if(ended) return; ended=true; done(r); };
  const stair=ok=>{ if(cfg.adapt) CUR.ssd=Math.max(80,Math.min(cfg.win-400,CUR.ssd+(ok?50:-50))); };
  later(()=>{   // 화면을 다시 그린 직후 누름은 받지 않음
    CUR.accept=true;
    CUR.onPress=()=>{
      if(!CUR.accept) return;
      if(phase==='wait'){ dangerFlash(); moveEl('rd-person','translateY(-30px)',300); fin({type:tr.type,early:true,resp:true,rt:null,correct:false,err:'com'}); return; }
      const rt=now()-t0;
      if(tr.type==='go'){ moveEl('rd-person','translateY(-250px)',900); fin({type:'go',resp:true,rt,correct:true,err:null}); }
      else { dangerFlash(); moveEl('rd-person','translateY(-50px)',300); if(tr.type==='stop') stair(false);
             fin({type:tr.type,resp:true,rt,correct:false,err:'com',ssd}); }
    };
    later(()=>{
      phase='go'; t0=now(); setSignal(tr.type==='blink'?'blink':'green');
      if(tr.type==='stop'){ ssd=CUR.ssd; later(()=>{ moveEl('rd-car','translateX(20px)',500); horn(); },ssd); }
      later(()=>{
        if(tr.type==='go') fin({type:'go',resp:false,rt:null,correct:false,err:'om'});
        else { if(tr.type==='stop'){ stair(true); moveEl('rd-car','translateX(900px)',900); } else setSignal('red');
               fin({type:tr.type,resp:false,rt:null,correct:true,err:null,ssd}); }
      },cfg.win);
    },rnd(900,1700));
  },150);
}

  const cfg=TASKS.way.cfg[SES.level], st=stage();
  st.innerHTML='';
  $('t-top').innerHTML=''; $('t-top').appendChild(h('div',{class:'dest'},h('span',{class:'wait'},'다음 안내판을 기다리세요')));
  later(()=>{
    const board=h('div',{class:'wayboard'});
    tr.rows.forEach(r=>{
      const ar=h('span',{html:arrowSVG(r.dir,40)}), tx=h('span',{class:'tx'},r.tx);
      const row=h('div',{class:'wrow'+(r.side==='R'?' al-r':'')});
      if(r.side==='L'){ row.appendChild(ar); row.appendChild(tx); } else { row.appendChild(tx); row.appendChild(ar); }
      r.el=row; board.appendChild(row);
    });
    st.innerHTML=''; st.appendChild(board);
    $('t-top').innerHTML=''; $('t-top').appendChild(h('div',{class:'dest'},h('span',null,'가야 할 곳: '+tr.dest)));
    const t0=now(); CUR.accept=true;
    const tgt=tr.rows.filter(r=>r.target)[0];
    CUR.onPress=v=>{ if(!CUR.accept) return; const rt=now()-t0, ok=v===tr.dir;
      tgt.el.classList.add(ok?'hit':'miss');
      done({conf:tr.conf,simon:tr.simon,dir:tr.dir,resp:v,rt,correct:ok,err:ok?null:'com'}); };
    later(()=>{ tgt.el.classList.add('miss'); done({conf:tr.conf,simon:tr.simon,dir:tr.dir,resp:null,rt:null,correct:false,err:'om'}); },cfg.win);
  },rnd(500,800));
}

function showFb(rec){
  const fb=$('fb'), lv1=SES.level===1, task=SES.task;
  let txt, ok=rec.correct;
  if(task==='shop'){
    if(ok) txt=rec.resp?'담았어요':'잘 지나보냈어요';
    else if(rec.err==='om') txt=lv1?`‘${rec.n}’은(는) 목록에 있는 물건이에요`:'놓쳤어요';
    else if(rec.over) txt=`‘${rec.n}’은(는) 이미 필요한 만큼 담았어요`;
    else if(rec.sale) txt='할인이어도 목록에 없는 물건이에요';
    else txt=lv1||rec.kind==='lure'?`‘${rec.n}’은(는) 목록에 없어요`:'목록에 없는 물건이에요';
  }else if(task==='cross'){
    if(ok) txt=rec.resp?'안전하게 건넜어요':rec.type==='blink'?'깜빡일 때 잘 기다렸어요':'차를 보고 잘 멈췄어요';
    else if(rec.early) txt='빨간불이에요. 초록불을 기다려요';
    else if(rec.err==='om') txt='초록불이었어요. 건너도 돼요';
    else txt=rec.type==='blink'?'깜빡이는 초록불에는 건너지 않아요':'위험해요! 차가 오고 있었어요';
  }else{
    if(ok) txt='맞게 찾았어요';
    else if(rec.err==='om') txt='시간이 지났어요';
    else txt=lv1?'찾은 줄의 화살표 방향을 다시 보세요':'반대쪽이에요';
  }
  fb.textContent=txt; fb.style.color=ok?'var(--ok)':'var(--bad)';
}

// ══ 블록 결과 ══════════════════════════════════════════
function blockStats(task,rec){
  const n=rec.length, ok=rec.filter(r=>r.correct).length;
  const com=rec.filter(r=>r.err==='com').length, om=rec.filter(r=>r.err==='om').length;
  const s={n,ok,com,om,errors:com+om,rt:avg(rec.filter(r=>r.correct&&r.rt!=null).map(r=>r.rt))};
  if(task==='shop'){
    s.saleCom=rec.filter(r=>r.err==='com'&&r.sale&&!r.over).length;
    s.overCom=rec.filter(r=>r.err==='com'&&r.over).length;
    s.lureCom=rec.filter(r=>r.err==='com'&&!r.over&&!r.sale&&r.kind==='lure').length;
    s.otherCom=s.com-s.saleCom-s.overCom-s.lureCom;
    if(CUR&&CUR.list){ s.listN=CUR.list.length; s.listDone=CUR.list.filter(x=>(CUR.taken[x.n]||0)>=x.qty).length; }
  }
  if(task==='cross'){
    const st=rec.filter(r=>r.type==='stop'), bl=rec.filter(r=>r.type==='blink');
    s.stops=st.length; s.stopOk=st.filter(r=>r.correct).length; s.blinks=bl.length; s.blinkOk=bl.filter(r=>r.correct).length;
    s.early=rec.filter(r=>r.early).length; s.ssd=avg(st.filter(r=>r.ssd!=null).map(r=>r.ssd));
  }
  if(task==='way'){
    const C=rec.filter(r=>!r.conf), I=rec.filter(r=>r.conf), S=rec.filter(r=>r.simon);
    const acc=a=>a.length?a.filter(r=>r.correct).length/a.length:null;
    s.cAcc=acc(C); s.iAcc=acc(I); s.sAcc=acc(S); s.sN=S.length;
    s.cRT=avg(C.filter(r=>r.correct).map(r=>r.rt)); s.iRT=avg(I.filter(r=>r.correct).map(r=>r.rt));
  }
  return s;
}
function actualType(s){ if(s.errors<=1) return 2; return s.com>=s.om?0:1; }
function tile(v,k){ return h('div',{class:'tile'},h('div',{class:'v'},v),h('div',{class:'k'},k)); }

function endBlock(partial){
  const c=CUR; c.accept=false; c.onPress=null; clearTimers(); c.stopped=true;
  const t=TASKS[SES.task], s=blockStats(SES.task,c.rec);
  if(c.practice){ SES.practice={n:s.n,errors:s.errors}; CUR=null; setTimeout(toPredict,600); return; }
  const blk={pred:c.pred,strategy:c.strategy,stats:s,partial,self:null,next:null};
  SES.list.push(blk); CUR=null;
  const last=SES.list.length>=SES.blocks;
  $('r-title').textContent=`${t.name} · 블록 ${SES.list.length}/${SES.blocks} 결과`;
  const body=$('r-body');
  const draw=()=>{
    body.innerHTML='';
    const ab=bucket(s.errors);
    const extra=SES.task==='shop'?tile(`${s.listDone}/${s.listN}`,'목록 다 채움'):SES.task==='cross'?tile(`${s.stopOk+s.blinkOk}/${s.stops+s.blinks}`,'멈춰야 할 때 멈춤'):tile(s.iAcc==null?'-':Math.round(s.iAcc*100)+'%','다른 줄이 반대일 때 정답률');
    body.appendChild(h('div',{class:'tiles'},tile(`${s.ok}/${s.n}`,'맞힘'),tile(s.errors+'번','실수'),tile(sec(s.rt),'평균 반응시간'),extra));
    const detail=SES.task==='shop'&&s.com?` (할인에 끌림 ${s.saleCom}, 더 담음 ${s.overCom}, 비슷한 이름 ${s.lureCom}, 그 밖 ${s.otherCom})`:
      SES.task==='cross'&&s.early?` (빨간불에 누름 ${s.early}번 포함)`:'';
    body.appendChild(h('div',{class:'cmp'},
      `예측: ${blk.pred==null?'-':PRED[blk.pred]} → 실제: ${s.errors}번`,h('br'),
      h('span',{class:ab===blk.pred?'okc':'badc'},blk.pred==null?'':ab===blk.pred?'예측과 같아요':ab>blk.pred?'예측보다 실수가 많았어요':'예측보다 실수가 적었어요'),
      h('div',{class:'subc',style:'margin-top:4px'},`${t.errWords.com} ${s.com}번${detail} · ${t.errWords.om} ${s.om}번`+(partial?' · 중간에 그만둠':''))));
    const q1=h('div',{class:'q'},h('div',{class:'qt'},'가장 많이 한 실수는 무엇이었나요?'),
      seg(t.selfOpts,v=>{blk.self=t.selfOpts.indexOf(v);draw();},blk.self==null?null:t.selfOpts[blk.self]));
    if(blk.self!=null&&blk.self!==3){ const at=actualType(s);
      q1.appendChild(h('div',{class:'cmp'},blk.self===at?h('span',{class:'okc'},'실제 결과와 같아요.'):h('span',{class:'badc'},`실제로는 ‘${t.selfOpts[at]}’에 가까워요.`))); }
    body.appendChild(q1);
    if(!last) body.appendChild(h('div',{class:'q'},h('div',{class:'qt'},'다음 블록에서 쓸 전략을 골라 보세요.'),seg(t.strategies,v=>{blk.next=v;draw();},blk.next)));
    $('r-next').disabled=!(blk.self!=null&&(last||blk.next!=null));
  };
  draw();
  $('r-next').textContent=last?'전체 결과 보기':'다음 블록';
  $('r-next').onclick=()=>{ if(last) showReport(); else { if(blk.next!=='지금처럼 하기') SES.strategy=blk.next; toPredict(); } };
  go('rev');
}

// ══ 전체 리포트 ══════════════════════════════════════════
function showReport(){
  SES.done=true;
  const t=TASKS[SES.task], b=$('rep-body'); b.innerHTML='';
  const L=SES.list, f=L[0].stats, l=L[L.length-1].stats;
  const predOk=L.filter(x=>x.pred!=null&&x.pred===bucket(x.stats.errors)).length;
  const selfJ=L.filter(x=>x.self!=null&&x.self!==3), selfOk=selfJ.filter(x=>x.self===actualType(x.stats)).length;
  b.appendChild(h('h2',null,'잠깐 멈춤 훈련 결과'));
  b.appendChild(h('div',{class:'meta'},`날짜: ${todayStr()}　과제: ${t.name} (${t.kind})　난이도: ${LV_NAME[SES.level]}　${L.length}블록　총 소요 ${Math.max(1,Math.round((Date.now()-SES.t0)/60000))}분`));
  b.appendChild(h('div',{class:'tiles',style:'margin-bottom:10px'},
    tile(`${f.errors} → ${l.errors}`,'실수 (첫 블록 → 마지막)'),tile(`${sec(f.rt)} → ${sec(l.rt)}`,'평균 반응시간'),
    tile(`${predOk}/${L.length}`,'실수 예측이 맞은 블록'),tile(selfJ.length?`${selfOk}/${selfJ.length}`:'-','실수 유형을 바르게 앎')));
  const tb=h('table');
  tb.appendChild(h('tr',null,['블록','문제 수','예측','실제 실수',t.errWords.com,t.errWords.om,'정답률','평균 반응시간','스스로 판단한 실수','사용한 전략'].map(x=>h('th',null,x))));
  L.forEach((x,i)=>{const s=x.stats, at=actualType(s);
    tb.appendChild(h('tr',null,h('td',null,(i+1)+(x.partial?' (중단)':'')),h('td',null,s.n),h('td',null,x.pred==null?'-':PRED[x.pred]),h('td',null,s.errors),
      h('td',null,s.com),h('td',null,s.om),h('td',null,pct(s.ok,s.n)),h('td',null,sec(s.rt)),
      h('td',{class:'l'},x.self==null?'-':t.selfOpts[x.self]+(x.self===3?'':x.self===at?' (일치)':' (불일치)')),h('td',{class:'l'},x.strategy||'-')));});
  b.appendChild(tb);
  const d=h('table');
  if(SES.task==='shop'){
    d.appendChild(h('tr',null,['블록','목록 다 채움','할인에 끌려 담음','이미 다 담았는데 더 담음','비슷한 이름을 담음','그 밖의 물건을 담음','필요한 물건을 놓침'].map(x=>h('th',null,x))));
    L.forEach((x,i)=>{const s=x.stats;d.appendChild(h('tr',null,h('td',null,i+1),h('td',null,`${s.listDone}/${s.listN}`),h('td',null,s.saleCom),h('td',null,s.overCom),h('td',null,s.lureCom),h('td',null,s.otherCom),h('td',null,s.om)));});
  }else if(SES.task==='cross'){
    d.appendChild(h('tr',null,['블록','차가 올 때 멈춤','깜빡일 때 기다림','빨간불에 누름','차가 나타난 시점 (초록불 뒤 평균)'].map(x=>h('th',null,x))));
    L.forEach((x,i)=>{const s=x.stats;d.appendChild(h('tr',null,h('td',null,i+1),h('td',null,`${s.stopOk}/${s.stops}`),h('td',null,s.blinks?`${s.blinkOk}/${s.blinks}`:'-'),h('td',null,s.early),h('td',null,s.ssd==null?'-':sec(s.ssd))));});
  }else{
    d.appendChild(h('tr',null,['블록','다른 줄이 같은 방향: 정답률','반응시간','다른 줄이 반대 방향: 정답률','반응시간','화살표 위치가 반대: 정답률'].map(x=>h('th',null,x))));
    const P=v=>v==null?'-':Math.round(v*100)+'%';
    L.forEach((x,i)=>{const s=x.stats;d.appendChild(h('tr',null,h('td',null,i+1),h('td',null,P(s.cAcc)),h('td',null,sec(s.cRT)),h('td',null,P(s.iAcc)),h('td',null,sec(s.iRT)),h('td',null,s.sN?P(s.sAcc):'-')));});
  }
  b.appendChild(h('div',{class:'lbl'},'과제별 세부'));
  b.appendChild(d);
  const as=h('div'); const drawAs=()=>{as.innerHTML='';as.appendChild(seg(ASSIST,v=>{SES.assist=SES.assist===v?null:v;drawAs();},SES.assist));}; drawAs();
  const memoPrint=h('div',{style:'white-space:pre-wrap'});
  const memo=h('textarea',{placeholder:'관찰 내용, 준 단서, 다음 회기 계획 등',oninput:e=>{SES.memo=e.target.value;memoPrint.textContent=e.target.value;}});
  memo.value=SES.memo;
  b.appendChild(h('div',{class:'lbl'},'도움 수준 (치료사)')); b.appendChild(as);
  b.appendChild(h('div',{class:'lbl',style:'margin-top:10px'},'메모')); b.appendChild(h('div',{class:'no-print'},memo)); b.appendChild(memoPrint);
  if(SES.task==='cross'&&SES.level>=2) b.appendChild(h('p',{class:'note'},'보통·어려움에서는 잘 멈추면 차가 조금 더 늦게, 못 멈추면 조금 더 일찍 나타납니다. 차가 나타난 시점이 늦을수록 더 어려운 조건에서 멈춘 것입니다.'));
  b.appendChild(h('p',{class:'note'},'구성 근거: 억제 과제에 실수 예측·자기 모니터링·피드백·전략 선택을 결합한 메타인지 전략 훈련 방식 (Cicerone et al., 2019; Jeffay et al., 2023).'));
  go('rep');
}

// ══ 키보드 (스페이스=건너기, ←→=방향, 장보기는 스페이스=담기) ══
document.addEventListener('keydown',e=>{
  if(!CUR||!$('scr-task').classList.contains('on')) return;
  if((e.key===' '||e.key==='Enter')&&SES.task!=='way'){ e.preventDefault(); press(SES.task==='shop'?'take':'go'); }
  else if(e.key==='ArrowLeft'&&SES.task==='way'){ e.preventDefault(); press('L'); }
  else if(e.key==='ArrowRight'&&SES.task==='way'){ e.preventDefault(); press('R'); }
});
// ══ 화면이 가려지면 잠시 멈춤 ══════════════════════════════
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&CUR&&!CUR.stopped){
    PAUSED=true; clearTimers(); CUR.accept=false; CUR.onPress=null;
    const p=h('div',{class:'pause'},h('div',{style:'text-align:center'},h('div',{style:'font-weight:800;font-size:1.2rem;margin-bottom:10px'},'잠시 멈췄습니다'),
      h('button',{class:'big-btn b-pri',onclick:()=>{ if(p.parentNode) p.parentNode.removeChild(p); PAUSED=false; }},'계속하기')));
    stage().appendChild(p); CUR.timers.push(setTimeout(nextTrial,300));
  }
});

renderHome();
</script>
