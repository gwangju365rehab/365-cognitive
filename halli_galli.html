<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>할리갈리 억제훈련 - 광주365재활병원</title>
<style>
:root{
  --ink:#1f2433; --sub:#5b6375; --line:#d5dbe6; --bg:#eef1f6; --card:#fff;
  --pri:#283593; --pri-2:#3f51b5; --pri-soft:#e8eaf6;
  --ok:#2e7d32; --ok-soft:#e8f5e9; --bad:#c62828; --bad-soft:#fdecea;
  --felt:#1b6b45;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  background:var(--bg);color:var(--ink);font-size:18px;line-height:1.5;padding:16px 14px 90px}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #ffb300;outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column}
.wrap>*+*{margin-top:14px}
.screen{display:none}
.screen.on{display:flex}

#home-btn,#back-btn{position:fixed;top:12px;left:12px;z-index:50;padding:10px 18px;border-radius:999px;border:none;min-height:44px;
  background:#fff;color:#333;font-weight:700;font-size:15px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
#back-btn{left:112px;background:var(--pri);color:#fff;display:none}
h1{margin:30px 0 0;text-align:center;font-size:1.8rem;color:#1a237e;font-weight:800}
.lead{text-align:center;color:var(--sub);font-size:1rem;margin:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.lbl{font-size:.95rem;font-weight:800;color:var(--sub);margin:0 0 8px}

/* 규칙 예시 */
.ex-row{display:flex;flex-wrap:wrap;justify-content:center}
.ex{flex:1 1 180px;max-width:250px;margin:6px;border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center;background:#fafbfd}
.ex .mini{display:flex;justify-content:center;margin-bottom:6px}
.ex .mini .card{margin:0 4px}
.ex .ans{display:inline-block;padding:3px 14px;border-radius:999px;font-weight:900;color:#fff}
.ex .ans.go{background:var(--ok)}.ex .ans.no{background:var(--bad)}
.ex .why{font-size:.92rem;color:var(--sub);font-weight:700;margin-top:4px}

/* 난이도 */
.lv-btn{display:flex;align-items:center;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 16px;min-height:66px;margin-bottom:10px}
.lv-btn.on{border-color:var(--pri-2);background:var(--pri-soft)}
.lv-btn .lvn{flex:none;min-width:84px;text-align:center;padding:8px 0;border-radius:10px;font-weight:800;color:#fff;margin-right:14px}
.lv1 .lvn{background:#43a047}.lv2 .lvn{background:#1e88e5}.lv3 .lvn{background:#e53935}
.lv-btn .t{font-weight:800}
.lv-btn .d{color:var(--sub);font-size:.95rem}
.seg{display:flex;flex-wrap:wrap}
.seg button{margin:3px;min-width:72px;min-height:48px;padding:10px 14px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:700}
.seg button.on{border-color:var(--pri-2);background:var(--pri-2);color:#fff}
.set-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:8px 0;border-top:1px solid #eceff4}
.set-row:first-child{border-top:none}
.set-row .nm{font-weight:700}
.big-btn{padding:16px 26px;border-radius:14px;border:none;font-size:1.15rem;font-weight:800;min-height:60px}
.b-pri{background:var(--pri);color:#fff}
.b-sec{background:#fff;color:var(--ink);border:2px solid var(--line)}
.foot{display:flex;justify-content:flex-end;flex-wrap:wrap}
.foot>*{margin-left:10px;margin-top:6px}

/* 게임 화면 */
.tbar{margin-top:46px;display:flex;align-items:center;flex-wrap:wrap;background:var(--pri);color:#fff;border-radius:16px;padding:12px 16px}
.tbar .ttl{flex:1;font-size:1.15rem;font-weight:800}
.tbar .pg{font-variant-numeric:tabular-nums;font-weight:700;background:rgba(0,0,0,.2);padding:6px 12px;border-radius:10px;margin-left:8px}
.tbar .tb{background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:10px;padding:8px 14px;font-weight:700;min-height:42px;margin-left:8px}
.table{position:relative;background:var(--felt);background-image:radial-gradient(circle at 50% 40%,#23845a 0,#1b6b45 70%);border-radius:22px;padding:22px 12px;
  min-height:300px;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;box-shadow:inset 0 0 0 6px #14532f}
.pile{position:relative;margin:8px 10px;width:150px;height:210px}
.pile .back{position:absolute;left:6px;top:6px;width:150px;height:210px;border-radius:14px;background:#8e2430;border:3px solid #fff;
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.15) 0 6px,transparent 6px 12px)}
.pile .slot{position:absolute;left:0;top:0;width:150px;height:210px;border-radius:14px;border:3px dashed rgba(255,255,255,.35)}
.card{position:relative;width:150px;height:210px;border-radius:14px;background:#fff;border:3px solid #cfd6e0;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.pile .card{position:absolute;left:0;top:0}
.card .fr{position:absolute;width:50%;height:auto;transform:translate(-50%,-50%)}
.card .fr svg,.tgtbox .fr svg,.mini .fr svg{display:block;width:100%;height:auto}
.card.stop{background:#37474f;border-color:#263238}
.card.flip{animation:flip .28s ease-out}
@keyframes flip{0%{transform:scale(.6) rotateY(80deg);opacity:.3}100%{transform:none;opacity:1}}
.mini .card{width:66px;height:92px;border-width:2px;border-radius:8px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.table.win{box-shadow:inset 0 0 0 6px #14532f,0 0 0 6px #66bb6a}
.table.lose{box-shadow:inset 0 0 0 6px #14532f,0 0 0 6px #ef5350}
.tgtbox{display:none;align-items:center;justify-content:center;background:#fff;border:3px solid #ffb300;border-radius:16px;padding:8px 16px;font-weight:900;font-size:1.35rem}
.tgtbox.on{display:flex}
.tgtbox .fr{width:64px;height:64px;margin:0 12px}
.fb{min-height:2.6rem;text-align:center;font-size:1.35rem;font-weight:900}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}.fb.mid{color:#ef6c00}
.bell-wrap{display:flex;justify-content:center}
#bell{width:210px;height:150px;border-radius:24px;border:none;background:#fff8e1;box-shadow:0 6px 0 #c49000;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:900;font-size:1.25rem;color:#6d4c00;user-select:none;-webkit-user-select:none}
#bell:active,#bell.hit{transform:translateY(4px);box-shadow:0 2px 0 #c49000}
#bell svg{width:92px;height:92px}
.pause{position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(238,241,246,.95);display:none;align-items:center;justify-content:center;z-index:60;flex-direction:column}
.pause.on{display:flex}
.pause .msg{font-size:1.5rem;font-weight:900;margin-bottom:16px;text-align:center}
.count{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:5rem;font-weight:900;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.3)}

/* 결과 */
.tiles{display:flex;flex-wrap:wrap;margin:-5px}
.tile{flex:1 1 150px;margin:5px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.tile .v{font-size:1.6rem;font-weight:900;font-variant-numeric:tabular-nums}
.tile .k{font-size:.88rem;color:var(--sub);font-weight:700}
.rep h2{margin:0 0 4px;font-size:1.4rem}
.rep .meta{color:var(--sub);margin-bottom:10px}
.rep table{width:100%;border-collapse:collapse;font-size:1rem;margin:6px 0 12px;background:#fff}
.rep th,.rep td{border:1px solid var(--line);padding:8px;text-align:center;vertical-align:middle}
.rep th{background:#f3f5fa}
.rep td.l{text-align:left;font-weight:700}
.okc{color:var(--ok);font-weight:800}.badc{color:var(--bad);font-weight:800}
.note{font-size:.88rem;color:var(--sub)}
#scr-rep{margin-top:50px}
#err-box{display:none;position:fixed;left:10px;right:10px;bottom:40px;z-index:99;background:#fdecea;color:#c62828;border:2px solid #ef9a9a;border-radius:12px;padding:10px 14px;font-size:.9rem;font-weight:700}
@media(max-width:700px){
  .pile,.pile .back,.pile .slot,.table .card{width:118px;height:165px}
  #bell{width:180px;height:130px}
}
@media print{
  body{background:#fff;padding:0;font-size:12px}
  #home-btn,#back-btn,#err-box,.no-print{display:none!important}
  .panel{border:none;padding:0}
}
</style>
</head>

<div class="wrap screen on" id="scr-home">

</div>

<!-- 결과 화면 -->
<div class="wrap screen" id="scr-rep">
  <div class="panel rep" id="rep"></div>
  <div class="foot no-print">
    <button class="big-btn b-sec" onclick="window.print()">인쇄</button>
    <button class="big-btn b-sec" onclick="go('home')">처음으로</button>
    <button class="big-btn b-pri" onclick="startGame()">같은 난이도로 다시</button>
  </div>
</div>

<div class="pause" id="pause">
  <div class="msg">일시정지</div>
  <div>
    <button class="big-btn b-sec" onclick="quitGame()">그만하기</button>
    <button class="big-btn b-pri" onclick="resumeGame()">계속하기</button>
  </div>
</div>

<div id="err-box"></div>

<!-- 비밀번호 잠금 -->
<div id="lock" style="position:fixed;left:0;right:0;top:0;bottom:0;z-index:200;background:#eef1f6;display:flex;align-items:center;justify-content:center;padding:16px">
  <div class="panel" style="max-width:420px;width:100%;text-align:center">
    <div style="font-size:1.3rem;font-weight:900;color:#1a237e;margin-bottom:6px">할리갈리 억제훈련</div>
    <div class="note" style="margin-bottom:14px">준비 중인 프로그램입니다. 비밀번호를 입력하세요.</div>
    <input id="lock-pw" type="password" inputmode="numeric" autocomplete="off"
      style="font:inherit;font-size:1.4rem;text-align:center;width:100%;padding:12px;border:2px solid #d5dbe6;border-radius:12px;margin-bottom:10px"/>
    <div id="lock-msg" style="min-height:1.6rem;color:#c62828;font-weight:800"></div>
    <div class="foot" style="justify-content:center">
      <button class="big-btn b-sec" onclick="location.href='index.html'">홈으로</button>
      <button class="big-btn b-pri" onclick="unlock()">확인</button>
    </div>
  </div>
</div>
<script>
// 비밀번호: 970705 (들어올 때마다 물음)
var LOCK_PW='970705';
function unlock(){
  var v=document.getElementById('lock-pw').value.trim();
  if(v===LOCK_PW){
    document.getElementById('lock').style.display='none';
  } else {
    document.getElementById('lock-msg').textContent='비밀번호가 맞지 않아요';
    document.getElementById('lock-pw').value='';
  }
}
(function(){
  try{ sessionStorage.removeItem('hg_unlock'); }catch(e){}
  document.getElementById('lock').style.display='flex';
  document.getElementById('lock-pw').addEventListener('keydown',function(e){ if(e.key==='Enter'||e.keyCode===13) unlock(); });
})();
</script>

</script>

function cardEl(c,anim){
  const d=document.createElement('div');
  d.className='card'+(c.stop?' stop':'')+(anim?' flip':'');

  d.innerHTML=html;
  return d;
}

// ══ 소리 ══════════════════════════════════════════════
let AC=null;
function initAudio(){
  try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state!=='running') AC.resume(); }catch(e){ AC=null; }
}
function tone(freqs,dur,type,vol){
  if(!SET.sound||!AC) return;
  try{
    if(AC.state!=='running') AC.resume();
    const t=AC.currentTime;
    freqs.forEach((f,i)=>{
      const o=AC.createOscillator(), g=AC.createGain();
      o.type=type||'sine'; o.frequency.value=f;
      o.connect(g); g.connect(AC.destination);
      const s=t+i*0.09;
      g.gain.setValueAtTime(vol||.35,s); g.gain.exponentialRampToValueAtTime(.001,s+dur);
      o.start(s); o.stop(s+dur+.02);
    });
  }catch(e){}
}
const sDing=()=>tone([1318,1760],.5,'triangle',.4);
const sBuzz=()=>tone([180],.3,'square',.15);
const sFlip=()=>tone([620],.05,'triangle',.12);

// ══ 카드 만들기 ═══════════════════════════════════════════
// 지금 펼쳐진 카드들이 어떤 상황인지 판정
function evalTable(tb){
  if(G&&G.L&&G.L.mode==='pick'){ // 1단계: 과일 종류만 봄
    const c=tb.filter(x=>x)[0]; if(!c) return {cat:'neutral',tot:{}};
    const tot={}; tot[c.f]=c.n;
    return {cat:c.f===G.tf?'target':(G.oldTf&&c.f===G.oldTf?'old':'other'),f:c.f,tot:tot};
  }
  const tot={}; let stop=false, all=0, types=0, five=null, near=null;
  tb.forEach(c=>{ if(!c) return; if(c.stop){ stop=true; return; } tot[c.f]=(tot[c.f]||0)+c.n; all+=c.n; });
  for(const k in tot){ types++; if(tot[k]===5) five=k; if(tot[k]===4||tot[k]===6) near=near||k; }
  if(five&&!stop) return {cat:'target',f:five,tot:tot};
  if(five&&stop) return {cat:'stop',f:five,tot:tot};
  if(near) return {cat:'near',f:near,tot:tot};
  const ks=Object.keys(tot);
  for(let i=0;i<ks.length;i++) for(let j=i+1;j<ks.length;j++) if(tot[ks[i]]+tot[ks[j]]===5) return {cat:'mix',pair:[ks[i],ks[j]],tot:tot};
  return {cat:'neutral',tot:tot};
}
function nextCard(pileIdx){
  const L=LEVELS[SET.level];
  const r=Math.random();
  let want;
  if(r<L.pT) want='target';
  else if(r<L.pT+L.pL) want=pick(L.lures);
  else want='neutral';
  if(L.mode==='pick'){
    const n=1+Math.floor(Math.random()*5);
    if(want==='target') return {f:G.tf,n:n};
    // 규칙이 바뀐 뒤에는 바뀌기 전 과일을 자주 섞어 이전 규칙을 참는 연습
    if(G.oldTf&&Math.random()<.45) return {f:G.oldTf,n:n};
    return {f:pick(L.fruits.filter(f=>f!==G.tf)),n:n};
  }
  const cands=[];
  L.fruits.forEach(f=>{ for(let n=1;n<=5;n++) cands.push({f:f,n:n}); });
  if(L.lures.indexOf('stop')>=0 && (want==='stop' || (want==='neutral'&&Math.random()<.15))) cands.push({stop:true});
  const tryCat=cat=>{
    const ok=cands.filter(c=>{ const tb=G.table.slice(); tb[pileIdx]=c; return evalTable(tb).cat===cat; });
    return ok.length?pick(ok):null;
  };
  // 금지 카드 장면: 먼저 금지 카드를 깔고, 그 카드가 보이는 동안 5개를 만듦
  const stopOn=G.table.some((x,i)=>x&&x.stop&&i!==pileIdx);
  if(want==='stop'&&!stopOn&&!(G.table[pileIdx]&&G.table[pileIdx].stop)) return {stop:true};
  if(stopOn&&want==='target'&&Math.random()<.6) want='stop';
  let c=tryCat(want);
  if(!c){
    const order=want==='target'?['neutral','mix','near']:['near','mix','stop','neutral'].filter(x=>x!==want&&(x==='neutral'||L.lures.indexOf(x)>=0));
    for(let i=0;i<order.length&&!c;i++) c=tryCat(order[i]);
  }
  if(!c) c=pick(cands.filter(x=>!x.stop));
  return c;
}

// ══ 게임 진행 ═══════════════════════════════════════════
let G=null;
function stopTimers(){ if(G){ clearTimeout(G.timer); G.timer=null; } }
function startGame(){
  initAudio();
  if(G){ G.running=false; stopTimers(); }
  const L=LEVELS[SET.level];
  G={level:SET.level,L:L,iv:Math.round(L.iv*SET.speed),total:SET.len,dealt:0,turn:0,
     table:new Array(L.piles).fill(null),state:null,running:true,paused:false,timer:null,
     n:{target:0,near:0,mix:0,stop:0,neutral:0,other:0,old:0},fa:{target:0,near:0,mix:0,stop:0,neutral:0,other:0,old:0},tf:pick(L.fruits),oldTf:null,swapEvery:L.mode==='pick'?SET.swap:0,swaps:0,lastSwapAt:0,
     hits:0,omit:0,rts:[],log:[],t0:Date.now()};
  $('g-title').textContent='할리갈리 · '+L.name+' '+L.sub;
  const tg=$('g-target');

// 받침에 맞는 조사: jo('라임','이','가') → 라임이
function jo(w,a,b){ const c=w.charCodeAt(w.length-1)-0xAC00; return w+((c>=0&&c<11172&&c%28>0)?a:b); }
function showTarget(){ $('g-target').innerHTML='이 과일이 나오면 종<span class="fr">'+FRUITS[G.tf].svg+'</span>'+FRUITS[G.tf].nm; }
// 규칙 바꾸기: 타겟 과일을 새 과일로
function swapRule(){
  G.oldTf=G.tf; G.tf=pick(G.L.fruits.filter(f=>f!==G.tf)); G.swaps++; G.lastSwapAt=G.dealt;
  G.table=G.table.map(()=>null); drawTable(-1);
  G.state={cat:'neutral',empty:true,rung:true};
  showTarget();
  const tg=$('g-target'); tg.style.background='#fff3c4'; setTimeout(()=>{tg.style.background='';},1600);
  tone([660,880,1100],.18,'triangle',.3);
  setFb('규칙이 바뀌었어요! 이제 '+jo(FRUITS[G.tf].nm,'이','가')+' 나오면 종 ('+jo(FRUITS[G.oldTf].nm,'은','는')+' 참기)','mid');
}
function countdown(n){
  const t=$('table');
  let el=t.querySelector('.count'); if(!el){ el=document.createElement('div'); el.className='count'; t.appendChild(el); }
  el.textContent=n;
  G.timer=setTimeout(()=>{
    if(n>1) countdown(n-1);
    else { el.parentNode&&el.parentNode.removeChild(el); flip(); }
  },800);
}
function drawTable(animIdx){
  const t=$('table'); t.innerHTML='';
  G.table.forEach((c,i)=>{
    const p=document.createElement('div'); p.className='pile';
    if(c) p.appendChild(cardEl(c,i===animIdx));
    else { const s=document.createElement('div'); s.className='slot'; p.appendChild(s); }
    t.appendChild(p);
  });
  $('g-left').textContent='남은 카드 '+(G.total-G.dealt)+'장';
}
let FBAT=0;
function setFb(txt,cls){ FBAT=Date.now(); const f=$('fb'); f.textContent=txt; f.className='fb'+(cls?' '+cls:''); }
function flashTable(cls){ const t=$('table'); t.classList.remove('win','lose'); t.classList.add(cls); setTimeout(()=>t.classList.remove(cls),600); }

function describe(info){
  const tot=info.tot||{}, parts=[];
  for(const k in tot) parts.push(FRUITS[k].nm+' '+tot[k]+'개');
  return parts.join(', ');
}
// 이전 장면을 마감: 5개를 놓쳤는지, 유혹을 잘 참았는지
function closeState(){
  const s=G.state; if(!s||s.empty) return false;
  if(s.cat==='target'&&!s.rung){
    G.omit++; G.log.push({post:!!(G.state&&G.state.post),cat:'target',res:'omit'});
    setFb('놓쳤어요 — '+(G.L.mode==='pick'?jo(FRUITS[s.info.f].nm,'이었어요','였어요'):FRUITS[s.info.f].nm+' 5개였어요'),'mid');
    return true;
  }
  if(!s.rung) G.log.push({post:!!(G.state&&G.state.post),cat:s.cat,res:'ok'});
  return false;
}
function flip(){
  if(!G||!G.running||G.paused) return;
  const said=closeState();
  if(G.dealt>=G.total){ endGame(); return; }
  if(G.swapEvery&&G.dealt>0&&G.dealt%G.swapEvery===0&&G.lastSwapAt!==G.dealt){ swapRule(); G.timer=setTimeout(flip,2200); return; }
  const p=G.turn%G.L.piles; G.turn++;
  const c=nextCard(p);
  G.table[p]=c; G.dealt++;
  const info=evalTable(G.table);
  G.n[info.cat]++;
  G.state={cat:info.cat,start:performance.now(),rung:false,info:info,post:G.swaps>0&&G.dealt-G.lastSwapAt<=3};
  drawTable(p); sFlip();
  if(!said&&Date.now()-FBAT>1200) setFb('','');
  G.timer=setTimeout(flip,G.iv);
}
function ring(){
  if(!G||!G.running||G.paused) return;
  const b=$('bell'); b.classList.add('hit'); setTimeout(()=>b.classList.remove('hit'),120);
  const s=G.state; if(!s||s.rung) return;
  s.rung=true;
  if(s.cat==='target'){
    const rt=performance.now()-s.start;
    G.hits++; G.rts.push(rt); G.log.push({post:!!(G.state&&G.state.post),cat:'target',res:'hit',rt:rt});
    sDing(); flashTable('win');
    setFb('정답! '+FRUITS[s.info.f].nm+(G.L.mode==='pick'?'':' 5개')+' ('+(rt/1000).toFixed(2)+'초)','ok');
    clearTimeout(G.timer);
    G.state={cat:'neutral',empty:true,rung:true};
    G.timer=setTimeout(()=>{
      if(!G.running) return;
      G.table=G.table.map(()=>null); drawTable(-1);
      G.state={cat:'neutral',start:performance.now(),rung:false,info:{cat:'neutral',tot:{}},empty:true};
      G.timer=setTimeout(flip,Math.round(G.iv*.7));
    },800);
  } else {
    const cat=s.empty?'neutral':s.cat;
    G.fa[cat]++; G.log.push({post:!!(G.state&&G.state.post),cat:cat,res:'fa'});
    sBuzz(); flashTable('lose');
    const why={near:'같은 과일이 5개가 아니에요 ('+describe(s.info)+')',
               mix:'다른 과일끼리 합친 5개예요 ('+describe(s.info)+')',
               stop:'금지 카드가 있어요',
               other:'타겟 과일이 아니에요 ('+(s.info.f?FRUITS[s.info.f].nm:'')+')',
               old:'규칙이 바뀌었어요. 이제 '+jo(FRUITS[G.tf].nm,'이','가')+' 타겟이에요',
               neutral:G.L.mode==='pick'?'아직 카드가 없어요':'같은 과일 5개가 없어요'}[cat];
    setFb('참아야 해요 — '+why,'bad');
  }
}
bindPress($('bell'),ring);
$('bell').innerHTML=BELL_SVG+'<span>종 치기</span>';
document.addEventListener('keydown',e=>{
  if(!$('scr-game').classList.contains('on')) return;
  if(e.key===' '||e.key==='Enter'||e.keyCode===32||e.keyCode===13){ e.preventDefault(); if(!e.repeat) ring(); }
});
function pauseGame(){
  if(!G||!G.running) return;

  $('pause').classList.add('on');
}
function resumeGame(){
  $('pause').classList.remove('on');

  if(G.state&&!G.state.rung) G.state.start=performance.now();
  G.timer=setTimeout(flip,G.iv);
}
function quitGame(){ $('pause').classList.remove('on'); if(G){ G.running=false; stopTimers(); } endGame(true); }

// ══ 결과 ═══════════════════════════════════════════════
function endGame(quit){
  if(!G) return;
  G.running=false; stopTimers();
  const L=G.L, lureCats=['near','mix','stop','other'].filter(c=>L.lures.indexOf(c)>=0).concat(G.swaps?['old']:[]);
  const lg=G.log;
  const hit=lg.filter(x=>x.res==='hit').length, omit=lg.filter(x=>x.res==='omit').length;
  const fa=lg.filter(x=>x.res==='fa').length, cr=lg.filter(x=>x.res==='ok').length;
  const good=hit+cr, bad=fa+omit, all=good+bad;
  const rt=avg(G.rts);
  const d=new Date();
  const ds=d.getFullYear()+'.'+(d.getMonth()+1)+'.'+d.getDate()+' '+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes();
  const goWord=L.mode==='pick'?(G.swaps?'그때의 타겟 과일이 나왔을 때':jo(FRUITS[G.tf].nm,'이','가')+' 나왔을 때'):'같은 과일 5개일 때';
  let h='<h2>할리갈리 억제훈련 결과</h2><div class="meta">'+ds+' · '+L.name+' ('+L.sub+') · 카드 '+G.dealt+'장 · '+(G.iv/1000).toFixed(1)+'초 간격'+(quit?' · 중간에 그만둠':'')+'</div>';
  h+='<div class="tiles">'+
    '<div class="tile" style="border:2px solid #a5d6a7;background:#f1f8e9"><div class="v" style="color:#2e7d32">'+good+'<small style="font-size:.9rem">번</small></div><div class="k">정반응 (전체 '+all+'번 중 '+(all?Math.round(good/all*100):0)+'%)</div></div>'+
    '<div class="tile" style="border:2px solid #ef9a9a;background:#fdecea"><div class="v" style="color:#c62828">'+bad+'<small style="font-size:.9rem">번</small></div><div class="k">오반응 (잘못 침 '+fa+' + 놓침 '+omit+')</div></div>'+
    '<div class="tile"><div class="v">'+(rt==null?'-':(rt/1000).toFixed(2)+'<small style="font-size:.9rem">초</small>')+'</div><div class="k">종 치기까지 평균 시간</div></div>'+
  '</div>';
  h+='<h3 style="margin:14px 0 4px">정반응과 오반응</h3><table><tr><th></th><th>종을 침</th><th>종을 안 침</th></tr>'+
    '<tr><td class="l">쳐야 할 때<br><span class="note">'+goWord+'</span></td><td class="okc" style="font-size:1.2rem">정반응 '+hit+'</td><td class="badc" style="font-size:1.2rem">오반응 '+omit+'<br><span class="note">놓침</span></td></tr>'+
    '<tr><td class="l">참아야 할 때<br><span class="note">그 밖의 모든 카드</span></td><td class="badc" style="font-size:1.2rem">오반응 '+fa+'<br><span class="note">잘못 침</span></td><td class="okc" style="font-size:1.2rem">정반응 '+cr+'<br><span class="note">잘 참음</span></td></tr></table>';
  h+='<h3 style="margin:14px 0 4px">참아야 할 장면별</h3><table><tr><th>장면</th><th>나온 횟수</th><th>잘 참음</th><th>잘못 침</th></tr>';
  lureCats.forEach(c=>{ const n=lg.filter(x=>x.cat===c&&x.res!=='hit').length, f=lg.filter(x=>x.cat===c&&x.res==='fa').length;
    h+='<tr><td class="l">'+CAT[c].nm+'</td><td>'+n+'</td><td class="okc">'+(n-f)+'</td><td>'+(f?'<span class="badc">'+f+'</span>':'0')+'</td></tr>'; });
  const nn=lg.filter(x=>x.cat==='neutral').length, nf=lg.filter(x=>x.cat==='neutral'&&x.res==='fa').length;
  if(nn) h+='<tr><td class="l">'+CAT.neutral.nm+'</td><td>'+nn+'</td><td class="okc">'+(nn-nf)+'</td><td>'+(nf?'<span class="badc">'+nf+'</span>':'0')+'</td></tr>';
  h+='</table>';
  if(G.swaps){
    const pr=lg.filter(x=>x.post), rest=lg.filter(x=>!x.post), okf=x=>x.res==='hit'||x.res==='ok';
    const rate=a=>a.length?Math.round(a.filter(okf).length/a.length*100)+'%':'-';
    h+='<h3 style="margin:14px 0 4px">규칙이 바뀐 뒤 (규칙 '+G.swaps+'번 바뀜)</h3><table><tr><th></th><th>카드 수</th><th>정반응 비율</th></tr>'+
      '<tr><td class="l">바뀐 직후 3장</td><td>'+pr.length+'</td><td><b>'+rate(pr)+'</b></td></tr>'+
      '<tr><td class="l">그 밖의 카드</td><td>'+rest.length+'</td><td><b>'+rate(rest)+'</b></td></tr></table>';
  }
  h+='<div class="note">잘못 친 횟수가 많으면 충동 억제가, 놓친 횟수가 많으면 주의 유지나 처리 속도가 더 어려운 것으로 볼 수 있습니다. 다음 회기에는 넘기는 속도나 단계를 조정해 보세요.</div>';
  $('rep').innerHTML=h;
  go('rep');
}

renderHome();
</script>
<script>
// 확인 창: 일부 병원 브라우저는 confirm() 창을 막아서 항상 '취소'로 처리되므로 화면 안 창으로 대신함
function askConfirm(msg,onYes){
  var old=document.getElementById('ask-ov'); if(old) old.parentNode.removeChild(old);
  var ov=document.createElement('div'); ov.id='ask-ov';
  ov.style.cssText='position:fixed;left:0;right:0;top:0;bottom:0;z-index:300;background:rgba(30,35,50,.45);display:flex;align-items:center;justify-content:center;padding:16px';
  ov.innerHTML='<div style="background:#fff;border-radius:16px;padding:20px;max-width:420px;width:100%;text-align:center;font-family:inherit">'+
    '<div style="font-size:1.15rem;font-weight:800;margin-bottom:16px;line-height:1.5">'+msg+'</div>'+
    '<div style="display:flex;justify-content:center">'+
    '<button id="ask-no" style="flex:1;margin:0 6px;min-height:56px;border-radius:12px;border:2px solid #d5dbe6;background:#fff;font:inherit;font-weight:800">아니요</button>'+
    '<button id="ask-yes" style="flex:1;margin:0 6px;min-height:56px;border-radius:12px;border:none;background:#c62828;color:#fff;font:inherit;font-weight:800">네, 나갈게요</button></div></div>';
  document.body.appendChild(ov);
  document.getElementById('ask-no').onclick=function(){ ov.parentNode.removeChild(ov); };
  document.getElementById('ask-yes').onclick=function(){ ov.parentNode.removeChild(ov); onYes(); };
}
</script>
