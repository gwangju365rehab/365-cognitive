<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>스트룹 훈련 - 광주365재활병원</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: rgba(0,0,0,0.08); touch-action: manipulation; }
    body {
      margin: 0;
      padding: 70px 16px 60px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
      background: #ffffff;
      color: #222;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    button { font: inherit; cursor: pointer; min-height: 48px; }
    button:disabled { cursor: not-allowed; }
    button:focus-visible { outline: 3px solid #ffb300; outline-offset: 2px; }

    #home-btn {
      position: absolute; top: 16px; left: 16px;
      padding: 8px 16px; border-radius: 999px; border: 1px solid #bbb;
      background: #fafafa; font-size: 14px;
    }

    h1 { margin: 0; font-size: 2rem; font-weight: 800; }

    #description {
      max-width: 720px; font-size: 1rem; color: #444; line-height: 1.7; text-align: center;
    }
    #description b { color: #000; }

    /* ── 설정 ── */
    .setup { display: flex; flex-direction: column; gap: 10px; align-items: center; width: 100%; max-width: 760px; }
    .setup-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
    .setup-label { font-size: .9rem; font-weight: 700; color: #666; min-width: 64px; text-align: right; }
    .opt-btn {
      padding: 8px 16px; border-radius: 999px; border: none;
      font-size: .98rem; font-weight: 600; background: #eeeeee; color: #222;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    .opt-btn.active { background: #1976d2; color: #fff; }
    .opt-btn small { display: block; font-weight: 500; font-size: .78rem; opacity: .85; }
    .setup.locked .opt-btn { opacity: .5; pointer-events: none; }

    /* ── 자극 ── */
    #target-box {
      margin-top: 8px; display: flex; flex-direction: column; gap: 12px; align-items: center;
      min-height: 210px; justify-content: center;
    }
    #rule-badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 18px; border-radius: 999px;
      font-size: 1.15rem; font-weight: 800;
      background: #f1f1f1; color: #222; border: 2px solid #bbb;
      transition: transform .15s;
    }
    #rule-badge.word { background: #222; color: #fff; border-color: #222; }
    #rule-badge.flash { animation: flash .6s ease 2; }
    @keyframes flash { 50% { transform: scale(1.12); } }
    .rule-icon {
      width: 22px; height: 22px; border-radius: 50%;
      background: conic-gradient(#f44336 0 25%, #2196f3 0 50%, #4caf50 0 75%, #ffeb3b 0);
      border: 1px solid #999;
    }
    .rule-icon.word {
      background: none; border: 2px solid #fff; border-radius: 4px;
      font-size: .8rem; line-height: 18px; text-align: center; color: #fff; width: 24px;
    }

    #target-word {
      font-size: 5rem; font-weight: 900; letter-spacing: 3px;
      min-height: 7rem; min-width: 280px; text-align: center;
      display: flex; align-items: center; justify-content: center;
      padding: 4px 28px; border: 6px solid transparent; border-radius: 16px;
    }
    #target-word.framed { border-color: #222; }
    #target-word.idle { font-size: 1.4rem; font-weight: 600; color: #555; letter-spacing: 0; }

    #switch-note { min-height: 1.6rem; font-size: 1.1rem; font-weight: 800; color: #222; }

    #color-buttons { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; max-width: 760px; }
    .color-btn {
      min-width: 120px; padding: 12px 16px; border-radius: 8px; border: 1px solid #ccc;
      background: #fff; font-size: 1.35rem; font-weight: 700; color: #111;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    }
    .color-btn:disabled { opacity: .55; }
    .color-btn:not(:disabled):active { transform: translateY(1px); }

    #control-buttons { display: flex; gap: 15px; margin-top: 6px; }
    .control-btn {
      padding: 10px 22px; font-size: 1rem; font-weight: 700; border: none; border-radius: 8px;
      color: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    #start-btn { background: #43a047; }
    #reset-btn { background: #e53935; }
    .control-btn:disabled { opacity: .5; }

    #status { font-size: .98rem; color: #555; text-align: center; }
    #status span { font-weight: 700; color: #222; }

    #message { min-height: 1.6rem; font-size: 1.1rem; font-weight: 700; text-align: center; }
    #message.success { color: #2e7d32; }
    #message.error { color: #c62828; }

    /* ── 결과 ── */
    #result-box {
      display: none; width: 100%; max-width: 760px;
      padding: 16px 20px; border-radius: 12px; border: 1px solid rgba(0,0,0,0.12); background: #fafafa;
      font-size: .98rem; line-height: 1.6;
    }
    #result-box h2 { margin: 0 0 6px; font-size: 1.3rem; }
    #result-box .meta { color: #555; margin-bottom: 8px; }
    #result-box table { width: 100%; border-collapse: collapse; margin: 6px 0 12px; background: #fff; }
    #result-box th, #result-box td { border: 1px solid #ddd; padding: 7px 9px; text-align: center; }
    #result-box th { background: #f0f2f6; }
    #result-box td:first-child, #result-box th:first-child { text-align: left; }
    #result-box .note { font-size: .85rem; color: #666; }
    #result-box .actions { display: flex; gap: 10px; justify-content: center; margin-top: 8px; }
    #result-box .actions button { padding: 8px 18px; border-radius: 8px; border: 1px solid #bbb; background: #fff; font-weight: 700; }

    #hospital-logo {
      position: fixed; bottom: 10px; right: 10px; font-size: 12px; color: #666;
      padding: 5px 10px; background: rgba(255,255,255,0.9); border-radius: 4px; font-weight: 500;
    }

    @media (max-width: 480px) {
      #target-word { font-size: 3.6rem; min-width: 220px; }
      .color-btn { min-width: 96px; font-size: 1.15rem; }
      .setup-label { min-width: 0; width: 100%; text-align: center; }
    }
    @media (hover: none) { button:hover { transform: none !important; } }
    @media print {
      body { padding: 0; }
      body > *:not(#result-box) { display: none !important; }
      #result-box { display: block !important; border: none; background: #fff; }
      #result-box .actions { display: none; }
    }
  </style>
</head>
<body>
  <button id="home-btn" onclick="location.href='index.html'">← 메인으로</button>

  <h1>스트룹 훈련</h1>

  <div id="description"></div>

  <div class="setup" id="setup">
    <div class="setup-row">
      <span class="setup-label">모드</span>
      <button class="opt-btn" data-mode="basic">기본<small>글씨 색만 고르기</small></button>
      <button class="opt-btn" data-mode="fixed">규칙 전환 1<small>4문제마다 바뀜</small></button>
      <button class="opt-btn" data-mode="random">규칙 전환 2<small>예고 없이 바뀜</small></button>
    </div>
    <div class="setup-row">
      <span class="setup-label">색 개수</span>
      <button class="opt-btn" data-level="easy">쉬움 (3색)</button>
      <button class="opt-btn" data-level="normal">중간 (5색)</button>
      <button class="opt-btn" data-level="hard">어려움 (7색)</button>
    </div>
    <div class="setup-row">
      <span class="setup-label">문제 수</span>
      <button class="opt-btn" data-count="20">20문제</button>
      <button class="opt-btn" data-count="30">30문제</button>
      <button class="opt-btn" data-count="40">40문제</button>
    </div>
  </div>

  <div id="target-box">
    <div id="rule-badge"></div>
    <div id="target-word" class="idle">시작 버튼을 눌러 게임을 시작하세요</div>
    <div id="switch-note"></div>
  </div>

  <div id="color-buttons"></div>

  <div id="control-buttons">
    <button id="start-btn" class="control-btn">시작하기</button>
    <button id="reset-btn" class="control-btn">다시하기</button>
  </div>

  <div id="status">
    정답 <span id="hit-count">0</span>회 /
    오답 <span id="miss-count">0</span>회 /
    진행 <span id="progress">0</span> / <span id="total">20</span> /
    소요 시간 <span id="elapsed-time">00:00.0</span>
  </div>

  <div id="message"></div>

  <div id="result-box"></div>

  <div id="hospital-logo">광주365재활병원_인지연하팀</div>

  <script>
    // ── 색 팔레트 ──────────────────────────────
    const ALL_COLORS = [
      { id: "yellow", name: "노랑", css: "#ffeb3b" },
      { id: "red",    name: "빨강", css: "#f44336" },
      { id: "blue",   name: "파랑", css: "#2196f3" },
      { id: "green",  name: "초록", css: "#4caf50" },
      { id: "black",  name: "검정", css: "#111111" },
      { id: "purple", name: "보라", css: "#9c27b0" },
      { id: "orange", name: "주황", css: "#ff9800" }
    ];
    const LEVEL_COLOR_CONFIG = {
      easy:   ["yellow", "red", "blue"],
      normal: ["yellow", "red", "blue", "green", "black"],
      hard:   ["yellow", "red", "blue", "green", "black", "purple", "orange"]
    };
    const LEVEL_NAME = { easy: "쉬움 (3색)", normal: "중간 (5색)", hard: "어려움 (7색)" };
    const MODE_NAME  = { basic: "기본 (글씨 색)", fixed: "규칙 전환 1 (4문제마다)", random: "규칙 전환 2 (예고 없이)" };
    const RULE_NAME  = { color: "글씨 색", word: "글자 읽기" };
    const FIXED_BLOCK = 4;      // 규칙 전환 1: 몇 문제마다 바뀌는지
    const ISI_MS = 300;         // 문제 사이 빈 화면 (연속 터치 방지)

    // ── 상태 ──────────────────────────────────
    let mode = "basic", level = "normal", totalQuestions = 20;
    let colors = [];
    let trials = [];         // 미리 만든 문제 목록
    let log = [];            // 응답 기록
    let qi = -1;             // 현재 문제 번호
    let accepting = false, running = false;
    let shownAt = 0, startTime = 0, timerInterval = null, elapsedMs = 0;

    const $ = id => document.getElementById(id);
    const badgeEl = $("rule-badge"), wordEl = $("target-word"), noteEl = $("switch-note");
    const btnBox = $("color-buttons"), msgEl = $("message"), resultBox = $("result-box");
    const startBtn = $("start-btn"), resetBtn = $("reset-btn");

    const pick = a => a[Math.floor(Math.random() * a.length)];
    const avg = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
    const sec = ms => ms == null ? "-" : (ms / 1000).toFixed(2) + "초";
    const sgn = ms => ms == null ? "-" : (ms > 5 ? "+" : ms < -5 ? "−" : "") + (Math.abs(ms) / 1000).toFixed(2) + "초";
    const pct = (n, d) => d ? (n / d * 100).toFixed(0) + "%" : "-";

    function formatTime(ms) {
      const t = Math.floor(ms / 1000);
      return `${String(Math.floor(t / 60)).padStart(2, "0")}:${String(t % 60).padStart(2, "0")}.${Math.floor((ms % 1000) / 100)}`;
    }

    // ── 설명 문구 ──────────────────────────────
    function renderDescription() {
      const d = $("description");
      if (mode === "basic") {
        d.innerHTML = "<b>규칙:</b> 화면에 색 이름이 보이지만, <b>글씨 색(실제 색)</b>이 다를 수 있습니다.<br>" +
                      "항상 <b>글씨 색</b>에 해당하는 버튼을 누르세요. (글자 내용에 속지 않기!)";
      } else {
        d.innerHTML = "<b>규칙이 바뀝니다.</b> 위쪽 표시를 보고 규칙에 맞게 누르세요.<br>" +
                      "<b>[글씨 색]</b> 표시, 테두리 없음 → 글씨의 <b>색</b>을 고르기<br>" +
                      "<b>[글자 읽기]</b> 표시, 검은 테두리 → 적힌 <b>글자</b>를 고르기" +
                      (mode === "fixed" ? `<br>규칙은 ${FIXED_BLOCK}문제마다 번갈아 바뀝니다.` : "<br>규칙은 예고 없이 바뀝니다.");
      }
    }

    // ── 문제 만들기 ────────────────────────────
    function mismatchProb() { return level === "hard" ? 0.85 : 0.7; }

    function pickInk(wordColor) {
      if (Math.random() >= mismatchProb()) return wordColor;
      const others = colors.filter(c => c.id !== wordColor.id);
      if (level === "hard") {
        const notBlack = others.filter(c => c.id !== "black");
        if (notBlack.length && Math.random() < 0.8) return pick(notBlack);
      }
      return pick(others);
    }

    function buildRules(n) {
      if (mode === "basic") return Array(n).fill("color");
      if (mode === "fixed") return Array.from({ length: n }, (_, i) => (Math.floor(i / FIXED_BLOCK) % 2 ? "word" : "color"));
      // 무작위: 전환 약 40%, 같은 규칙은 최대 4번 연속, 두 규칙 비율은 반반에 가깝게
      const rules = ["color"];
      let run = 1;
      while (rules.length < n) {
        const prev = rules[rules.length - 1];
        const cnt = rules.filter(r => r === prev).length;
        let sw = Math.random() < 0.4 || run >= 4 || (cnt - (rules.length - cnt)) >= 3;
        const next = sw ? (prev === "color" ? "word" : "color") : prev;
        run = next === prev ? run + 1 : 1;
        rules.push(next);
      }
      return rules;
    }

    function buildTrials() {
      const rules = buildRules(totalQuestions);
      let prevWord = null, prevInk = null;
      return rules.map((rule, i) => {
        let w, ink, tries = 0;
        do { w = pick(colors); ink = pickInk(w); tries++; }
        while (tries < 20 && (w.id === prevWord || ink.id === prevInk)); // 같은 자극 연속 방지
        prevWord = w.id; prevInk = ink.id;
        const sw = i === 0 || mode === "basic" ? null : rule !== rules[i - 1];
        return { rule, word: w, ink, congruent: w.id === ink.id, switched: sw,
                 answer: rule === "color" ? ink.id : w.id,
                 lure: rule === "color" ? w.id : ink.id };
      });
    }

    // ── 화면 ──────────────────────────────────
    function renderBadge(rule) {
      if (!rule) { badgeEl.style.visibility = "hidden"; return; }
      badgeEl.style.visibility = "visible";
      badgeEl.className = rule === "word" ? "word" : "";
      badgeEl.innerHTML = rule === "word"
        ? '<span class="rule-icon word">가</span>글자 읽기'
        : '<span class="rule-icon"></span>글씨 색';
    }

    function buildColorButtons() {
      btnBox.innerHTML = "";
      colors.forEach(c => {
        const b = document.createElement("button");
        b.className = "color-btn";
        b.textContent = c.name;
        b.disabled = true;
        b.addEventListener("click", () => answer(c.id));
        btnBox.appendChild(b);
      });
    }
    function setButtons(on) { btnBox.querySelectorAll(".color-btn").forEach(b => b.disabled = !on); }

    function setMessage(t, type) { msgEl.textContent = t; msgEl.className = type || ""; }

    function updateStatus() {
      const hits = log.filter(r => r.correct).length;
      $("hit-count").textContent = hits;
      $("miss-count").textContent = log.length - hits;
      $("progress").textContent = Math.max(0, Math.min(qi + 1, totalQuestions));
      $("total").textContent = totalQuestions;
    }

    function syncSetupButtons() {
      document.querySelectorAll("[data-mode]").forEach(b => b.classList.toggle("active", b.dataset.mode === mode));
      document.querySelectorAll("[data-level]").forEach(b => b.classList.toggle("active", b.dataset.level === level));
      document.querySelectorAll("[data-count]").forEach(b => b.classList.toggle("active", +b.dataset.count === totalQuestions));
    }

    // ── 진행 ──────────────────────────────────
    function resetGame() {
      clearInterval(timerInterval);
      running = false; accepting = false; qi = -1; log = []; trials = []; elapsedMs = 0;
      colors = ALL_COLORS.filter(c => LEVEL_COLOR_CONFIG[level].includes(c.id));
      $("elapsed-time").textContent = "00:00.0";
      resultBox.style.display = "none";
      wordEl.className = "idle";
      wordEl.style.color = "";
      wordEl.textContent = "시작 버튼을 눌러 게임을 시작하세요";
      noteEl.textContent = "";
      renderBadge(mode === "basic" ? "color" : null);
      renderDescription();
      buildColorButtons();
      setMessage(mode === "basic" ? "항상 '글씨 색' 기준으로 선택하세요." : "위쪽 규칙 표시를 확인하고 누르세요.");
      startBtn.disabled = false;
      $("setup").classList.remove("locked");
      syncSetupButtons();
      updateStatus();
    }

    function startGame() {
      if (running) return;
      resetGame();
      trials = buildTrials();
      running = true;
      startBtn.disabled = true;
      $("setup").classList.add("locked");
      startTime = performance.now();
      timerInterval = setInterval(() => {
        elapsedMs = performance.now() - startTime;
        $("elapsed-time").textContent = formatTime(elapsedMs);
      }, 100);
      nextQuestion();
    }

    function nextQuestion() {
      qi++;
      if (qi >= totalQuestions) { finish(); return; }
      const t = trials[qi];
      // 빈 화면 → 자극 제시
      accepting = false; setButtons(false);
      wordEl.textContent = ""; wordEl.className = "";
      const notice = mode === "fixed" && t.switched;
      renderBadge(t.rule);
      noteEl.textContent = notice ? "규칙이 바뀌었어요!" : "";
      if (notice) { badgeEl.classList.remove("flash"); void badgeEl.offsetWidth; badgeEl.classList.add("flash"); }
      setTimeout(() => {
        if (!running) return;
        wordEl.textContent = t.word.name;
        wordEl.style.color = t.ink.css;
        wordEl.className = t.rule === "word" ? "framed" : "";
        shownAt = performance.now();
        accepting = true; setButtons(true);
        updateStatus();
      }, notice ? ISI_MS + 500 : ISI_MS);
    }

    function answer(id) {
      if (!running || !accepting) return;
      accepting = false;
      const t = trials[qi];
      const rt = performance.now() - shownAt;
      const correct = id === t.answer;
      const errType = correct ? null : (!t.congruent && id === t.lure ? "interference" : "other");
      log.push({ ...t, chosen: id, correct, rt, errType });
      if (correct) setMessage("정답!", "success");
      else if (errType === "interference")
        setMessage(t.rule === "color" ? "오답! 글자가 아니라 글씨 색을 골라야 해요." : "오답! 색이 아니라 적힌 글자를 골라야 해요.", "error");
      else setMessage("오답!", "error");
      updateStatus();
      nextQuestion();
    }

    // ── 결과 ──────────────────────────────────
    function stats(rows) {
      const ok = rows.filter(r => r.correct);
      return { n: rows.length, ok: ok.length, acc: pct(ok.length, rows.length), rt: avg(ok.map(r => r.rt)) };
    }
    function row(label, s) {
      return `<tr><td>${label}</td><td>${s.n}</td><td>${s.ok}</td><td>${s.acc}</td><td>${sec(s.rt)}</td></tr>`;
    }

    function finish() {
      running = false; accepting = false;
      clearInterval(timerInterval);
      elapsedMs = performance.now() - startTime;
      $("elapsed-time").textContent = formatTime(elapsedMs);
      setButtons(false);
      startBtn.disabled = false;
      $("setup").classList.remove("locked");
      wordEl.className = "idle"; wordEl.style.color = ""; wordEl.textContent = "완료!";
      noteEl.textContent = ""; renderBadge(null);
      setMessage("훈련이 끝났습니다. 아래 결과를 확인하세요.");

      const all = stats(log);
      const con = stats(log.filter(r => r.congruent)), inc = stats(log.filter(r => !r.congruent));
      const interf = inc.rt != null && con.rt != null ? inc.rt - con.rt : null;
      const errI = log.filter(r => r.errType === "interference").length;
      const errO = log.filter(r => r.errType === "other").length;
      const head = "<tr><th>구분</th><th>문제 수</th><th>정답</th><th>정확도</th><th>평균 반응시간</th></tr>";

      let html = `<h2>스트룹 훈련 결과</h2>
        <div class="meta">${new Date().toLocaleDateString("ko-KR")} · ${MODE_NAME[mode]} · ${LEVEL_NAME[level]} · ${totalQuestions}문제 · 총 ${formatTime(elapsedMs)}</div>
        <table>${head}${row("전체", all)}${row("일치 (글자 = 색)", con)}${row("불일치 (글자 ≠ 색)", inc)}</table>`;

      if (mode !== "basic") {
        const rc = stats(log.filter(r => r.rule === "color")), rw = stats(log.filter(r => r.rule === "word"));
        const rep = stats(log.filter(r => r.switched === false)), swi = stats(log.filter(r => r.switched === true));
        const cost = swi.rt != null && rep.rt != null ? swi.rt - rep.rt : null;
        html += `<table>${head}${row("규칙: 글씨 색", rc)}${row("규칙: 글자 읽기", rw)}
                 ${row("규칙 유지 문제", rep)}${row("규칙 전환 직후 문제", swi)}</table>
                 <table><tr><th>지표</th><th>값</th></tr>
                 <tr><td>전환 비용 (전환 직후 − 유지, 반응시간)</td><td>${sgn(cost)}</td></tr>
                 <tr><td>전환 비용 (정확도 차이)</td><td>${rep.n && swi.n ? ((rep.ok / rep.n - swi.ok / swi.n) * 100).toFixed(0) + "%p" : "-"}</td></tr>`;
      } else {
        html += `<table><tr><th>지표</th><th>값</th></tr>`;
      }
      html += `<tr><td>간섭 효과 (불일치 − 일치, 반응시간)</td><td>${sgn(interf)}</td></tr>
               <tr><td>간섭 오류 (규칙과 반대쪽 정보를 고름)</td><td>${errI}회</td></tr>
               <tr><td>기타 오류</td><td>${errO}회</td></tr></table>
               <div class="note">평균 반응시간은 정답 문제만 계산합니다. 간섭 오류는 글씨 색 규칙에서 적힌 글자를, 글자 읽기 규칙에서 글씨 색을 고른 경우입니다.` +
               (mode !== "basic" ? " 전환 비용이 클수록 규칙을 바꿀 때 어려움이 큽니다." : "") + `</div>
               <div class="actions"><button onclick="window.print()">인쇄하기</button><button onclick="startGame()">같은 설정으로 다시</button></div>`;
      resultBox.innerHTML = html;
      resultBox.style.display = "block";
      resultBox.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    // ── 이벤트 ────────────────────────────────
    document.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => { mode = b.dataset.mode; resetGame(); }));
    document.querySelectorAll("[data-level]").forEach(b => b.addEventListener("click", () => { level = b.dataset.level; resetGame(); }));
    document.querySelectorAll("[data-count]").forEach(b => b.addEventListener("click", () => { totalQuestions = +b.dataset.count; resetGame(); }));
    startBtn.addEventListener("click", startGame);
    resetBtn.addEventListener("click", resetGame);

    resetGame();
  </script>
</body>
</html>
