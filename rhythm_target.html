<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>리듬-타겟 훈련 - 광주365재활병원</title>
<style>
:root{
  --ink:#1f2433; --sub:#5b6375; --line:#d5dbe6; --bg:#eef1f6; --card:#fff;
  --pri:#0277bd; --pri-2:#0288d1; --pri-soft:#e1f5fe;
  --ok:#2e7d32; --bad:#c62828;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  background:var(--bg);color:var(--ink);font-size:18px;line-height:1.5;padding:16px 14px 90px}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #ffb300;outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column}
.wrap>*+*{margin-top:14px}
.screen{display:none}
.screen.on{display:flex}

#home-btn,#back-btn{position:fixed;top:12px;left:12px;z-index:50;padding:10px 18px;border-radius:999px;border:none;min-height:44px;
  background:#fff;color:#333;font-weight:700;font-size:15px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
#back-btn{left:112px;background:var(--pri);color:#fff;display:none}
h1{margin:30px 0 0;text-align:center;font-size:1.8rem;color:#01579b;font-weight:800}
.lead{text-align:center;color:var(--sub);font-size:1rem;margin:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.lbl{font-size:.95rem;font-weight:800;color:var(--sub);margin:0 0 8px}

.tabs{display:flex;justify-content:center;flex-wrap:wrap}
.tab{margin:4px;padding:12px 22px;border-radius:999px;border:2px solid var(--line);background:#fff;font-weight:800;color:var(--sub);min-height:52px}
.tab.on{background:var(--pri);border-color:var(--pri);color:#fff}
.how{display:flex;align-items:center}
.how .ic{flex:none;margin-right:16px}
.how .t{font-size:1.2rem;font-weight:800}
.how .d{color:var(--sub);font-size:1rem}
.lv-btn{display:flex;align-items:center;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 16px;min-height:66px;margin-bottom:10px}
.lv-btn.on{border-color:var(--pri-2);background:var(--pri-soft)}
.lv-btn .lvn{flex:none;min-width:84px;text-align:center;padding:8px 0;border-radius:10px;font-weight:800;color:#fff;margin-right:14px}
.lv1 .lvn{background:#43a047}.lv2 .lvn{background:#1e88e5}.lv3 .lvn{background:#e53935}
.lv-btn .t{font-weight:800}
.lv-btn .d{color:var(--sub);font-size:.95rem}
.seg{display:flex;flex-wrap:wrap}
.seg button{margin:3px;min-width:66px;min-height:48px;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:700}
.seg button.on{border-color:var(--pri-2);background:var(--pri-2);color:#fff}
.set-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:8px 0;border-top:1px solid #eceff4}
.set-row:first-child{border-top:none}
.set-row .nm{font-weight:700}
.big-btn{padding:16px 26px;border-radius:14px;border:none;font-size:1.15rem;font-weight:800;min-height:60px}
.b-pri{background:var(--pri);color:#fff}
.b-sec{background:#fff;color:var(--ink);border:2px solid var(--line)}
.foot{display:flex;justify-content:flex-end;flex-wrap:wrap}
.foot>*{margin-left:10px;margin-top:6px}

/* 훈련 화면 */
.tbar{margin-top:46px;display:flex;align-items:center;flex-wrap:wrap;background:var(--pri);color:#fff;border-radius:16px;padding:12px 16px}
.tbar .ttl{flex:1;font-size:1.15rem;font-weight:800}
.tbar .pg{font-variant-numeric:tabular-nums;font-weight:700;background:rgba(0,0,0,.2);padding:6px 12px;border-radius:10px;margin-left:8px}
.tbar .tb{background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:10px;padding:8px 14px;font-weight:700;min-height:42px;margin-left:8px}
#dot{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.3);margin-left:10px;transition:background .08s}
#dot.on{background:#ffeb3b}
.tgt{display:flex;align-items:center;justify-content:center;background:#fff;border:3px solid var(--line);border-radius:16px;padding:8px 16px;transition:background .2s,border-color .2s}
.tgt .lab{font-weight:800;color:var(--sub);margin-right:14px}
.tgt .nm{font-weight:900;font-size:1.5rem;margin-left:12px}
.tgt.changed{background:#fff8e1;border-color:#ffb300}
.tgt .chg{display:none;margin-left:12px;background:#ffb300;color:#fff;border-radius:999px;padding:2px 12px;font-weight:900}
.tgt.changed .chg{display:inline-block}
.stage{position:relative;height:440px;background:#fff;border:4px solid var(--line);border-radius:20px;overflow:hidden;user-select:none;-webkit-user-select:none;transition:border-color .08s,box-shadow .08s}
.stage.pulse{border-color:#ffb300;box-shadow:0 0 0 5px rgba(255,179,0,.35)}
.it{position:absolute;transform:translate(-50%,-50%);cursor:pointer;transition:left .25s,top .25s}
.it svg{display:block;width:100%;height:100%}
.it.hit{animation:pop .3s}
.it.bad{animation:shake .3s}
@keyframes pop{50%{transform:translate(-50%,-50%) scale(1.15)}}
@keyframes shake{25%{margin-left:-8px}75%{margin-left:8px}}
.pads{position:absolute;left:0;right:0;top:0;bottom:0;display:flex}
.pad{flex:1;margin:14px;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:2.2rem;font-weight:900;
  cursor:pointer;user-select:none;-webkit-user-select:none;border:6px solid transparent;transition:opacity .15s,box-shadow .15s;touch-action:none}
.pad svg{width:96px;height:96px;margin-bottom:6px}
.pad.L{background:#1e88e5}.pad.R{background:#fb8c00}
.pad.dim{opacity:.38}
.pad.cue{border-color:#ffeb3b;box-shadow:0 0 0 6px rgba(255,235,59,.55)}
.pad.ok{animation:padok .3s}.pad.ng{animation:padng .3s}
@keyframes padok{50%{transform:scale(.95);filter:brightness(1.25)}}
@keyframes padng{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.seq{display:flex;align-items:center;flex-wrap:wrap;justify-content:center}
.seq .hd{display:inline-flex;align-items:center;justify-content:center;min-width:64px;height:48px;margin:3px;border-radius:12px;font-weight:900;font-size:1.2rem;color:#fff}
.hd.L{background:#1e88e5}.hd.R{background:#fb8c00}.hd.B{background:linear-gradient(90deg,#1e88e5 50%,#fb8c00 50%)}
.bigcue{font-size:2rem;font-weight:900;padding:0 18px;border-radius:14px;color:#fff}
.count{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:6rem;font-weight:900;color:#0277bd;background:rgba(255,255,255,.85);border-radius:30px;padding:0 40px;z-index:5;pointer-events:none}
.fb{min-height:2.4rem;text-align:center;font-size:1.3rem;font-weight:900}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}.fb.mid{color:#ef6c00}
.pause{position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(238,241,246,.95);display:none;align-items:center;justify-content:center;z-index:60;flex-direction:column}
.pause.on{display:flex}
.pause .msg{font-size:1.5rem;font-weight:900;margin-bottom:16px;text-align:center}

/* 결과 */
.tiles{display:flex;flex-wrap:wrap;margin:-5px}
.tile{flex:1 1 140px;margin:5px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.tile .v{font-size:1.6rem;font-weight:900;font-variant-numeric:tabular-nums}
.tile .k{font-size:.88rem;color:var(--sub);font-weight:700}
.rep h2{margin:0 0 4px;font-size:1.4rem}
.rep h3{margin:14px 0 4px;font-size:1.05rem}
.rep .meta{color:var(--sub);margin-bottom:10px}
.rep table{width:100%;border-collapse:collapse;font-size:1rem;margin:6px 0 12px;background:#fff}
.rep th,.rep td{border:1px solid var(--line);padding:8px;text-align:center;vertical-align:middle}
.rep th{background:#f3f5fa}
.rep td.l{text-align:left;font-weight:700}
.bar{height:14px;background:#eceff4;border-radius:7px;overflow:hidden;min-width:120px}
.bar i{display:block;height:100%;background:#29b6f6}
.note{font-size:.88rem;color:var(--sub)}
#scr-rep{margin-top:50px}
#err-box{display:none;position:fixed;left:10px;right:10px;bottom:40px;z-index:99;background:#fdecea;color:#c62828;border:2px solid #ef9a9a;border-radius:12px;padding:10px 14px;font-size:.9rem;font-weight:700}
@media(max-width:700px){ .stage{height:380px} .tgt .nm{font-size:1.2rem} }
@media print{
  body{background:#fff;padding:0;font-size:12px}
  #home-btn,#back-btn,#err-box,.no-print{display:none!important}
  .panel{border:none;padding:0}
}
</style>
</head>
<body>
<button id="home-btn" onclick="location.href='index.html'">홈으로</button>
<button id="back-btn" onclick="backBtn()">처음으로</button>

<!-- 시작 화면 -->
<div class="wrap screen on" id="scr-home">
  <h1>리듬-타겟 훈련</h1>
  <p class="lead">메트로놈 소리에 맞춰 한 박자에 한 번 타겟을 누릅니다.</p>
  <div class="tabs" id="tabs"></div>
  <div class="panel"><div class="how" id="how"></div></div>
  <div class="panel">
    <div class="lbl">난이도</div>
    <div id="levels"></div>
  </div>
  <div class="panel">
    <div class="set-row"><span class="nm">박자 속도</span><div class="seg" id="seg-bpm"></div></div>
    <div class="set-row"><span class="nm">훈련 시간</span><div class="seg" id="seg-time"></div></div>
    <div class="set-row"><span class="nm">소리</span><div class="seg" id="seg-sound"></div></div>
    <div class="set-row"><span class="nm">음량</span><div class="seg" id="seg-vol"></div></div>
  </div>
  <div class="foot"><button class="big-btn b-pri" onclick="startGame()">시작하기</button></div>
</div>

<!-- 훈련 화면 -->
<div class="wrap screen" id="scr-game">
  <div class="tbar">
    <div class="ttl" id="g-title">리듬-타겟</div>
    <div id="dot"></div>
    <div class="pg" id="g-left">0:00</div>
    <button class="tb" onclick="pauseGame()">일시정지</button>
  </div>
  <div class="tgt" id="tgt"></div>
  <div class="stage" id="stage"></div>
  <div class="fb" id="fb"></div>
</div>

<!-- 결과 화면 -->
<div class="wrap screen" id="scr-rep">
  <div class="panel rep" id="rep"></div>
  <div class="foot no-print">
    <button class="big-btn b-sec" onclick="window.print()">인쇄</button>
    <button class="big-btn b-sec" onclick="go('home')">처음으로</button>
    <button class="big-btn b-pri" onclick="startGame()">같은 설정으로 다시</button>
  </div>
</div>

<div class="pause" id="pause">
  <div class="msg" id="pause-msg">일시정지</div>
  <div>
    <button class="big-btn b-sec" onclick="quitGame()">그만하기</button>
    <button class="big-btn b-pri" onclick="resumeGame()">계속하기</button>
  </div>
</div>
<div id="err-box"></div>

<script>
window.onerror=function(msg,src,line){var b=document.getElementById('err-box');if(b){b.style.display='block';b.textContent='오류: '+msg+' (줄 '+line+') — 이 화면을 사진으로 보내 주세요.';}};
</script>
<script>
"use strict";
// ══ 도구 ══════════════════════════════════════════════
const $=id=>document.getElementById(id);
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
const pct=(a,b)=>b?Math.round(a/b*100):null;
let LASTPRESS=0;
function bindPress(el,fn){
  const fire=e=>{ if(e&&e.cancelable) e.preventDefault(); const t=Date.now(); if(t-LASTPRESS<120) return; LASTPRESS=t; fn(e); };
  if(window.PointerEvent) el.addEventListener('pointerdown',fire);
  else { el.addEventListener('touchstart',fire,{passive:false}); el.addEventListener('mousedown',fire); }
  return el;
}
(function(){ try{ if(window.parent&&window.parent!==window&&typeof window.parent.goHome==='function') $('home-btn').style.display='none'; }catch(e){} })();
const mmss=s=>{ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+':'+(s%60<10?'0':'')+(s%60); };

// ══ 도형 (SVG) ═══════════════════════════════════════════
const COLORS={red:{nm:'빨강',c:'#e53935',s:'#8e0000'},blue:{nm:'파랑',c:'#1e88e5',s:'#0d3c78'},green:{nm:'초록',c:'#43a047',s:'#1b5e20'},yellow:{nm:'노랑',c:'#fdd835',s:'#9a7d00'}};
const SHAPES={
  circle:{nm:'동그라미',p:'<circle cx="50" cy="50" r="42"/>'},
  square:{nm:'네모',p:'<rect x="10" y="10" width="80" height="80" rx="6"/>'},
  tri:{nm:'세모',p:'<polygon points="50,7 94,88 6,88"/>'},
  star:{nm:'별',p:'<polygon points="50,5 61,37 95,37 68,57 78,91 50,71 22,91 32,57 5,37 39,37"/>'},
  diamond:{nm:'마름모',p:'<polygon points="50,4 94,50 50,96 6,50"/>'}
};
const shapeSVG=(sh,co)=>'<svg viewBox="0 0 100 100"><g fill="'+COLORS[co].c+'" stroke="'+COLORS[co].s+'" stroke-width="5" stroke-linejoin="round">'+SHAPES[sh].p+'</g></svg>';
const nameOf=t=>COLORS[t.co].nm+' '+SHAPES[t.sh].nm;

// ══ 모드·난이도 ═══════════════════════════════════════════
const MODES={
  sus:{tab:'지속주의',title:'한 타겟 꾸준히 누르기',
       d:'화면의 도형 하나를 소리에 맞춰 계속 누릅니다. 끝까지 박자를 놓치지 않고 집중을 유지하는 연습입니다.',
       lv:{1:{bpm:40,sec:60,win:.35,size:210,move:0,d:'40 BPM · 1분 · 박자 허용 범위 넓게'},
           2:{bpm:60,sec:120,win:.28,size:180,move:0,d:'60 BPM · 2분 · 허용 범위 보통'},
           3:{bpm:60,sec:180,win:.22,size:150,move:8,d:'60 BPM · 3분 · 8박자마다 타겟 위치가 바뀜'}}},
  sel:{tab:'선택주의',title:'바뀌는 타겟 골라 누르기',
       d:'여러 도형 중 위에 보이는 타겟만 소리에 맞춰 누릅니다. 타겟은 중간중간 바뀌고, 도형 자리도 섞입니다.',
       lv:{1:{bpm:40,sec:60,win:.35,items:4,dist:'easy',change:12,shuf:0,d:'도형 4개 · 모양·색이 모두 다른 방해 도형 · 12박자마다 타겟 바뀜'},
           2:{bpm:45,sec:90,win:.28,items:6,dist:'mixed',change:8,shuf:4,d:'도형 6개 · 비슷한 방해 도형 섞임 · 8박자마다 타겟 바뀜 · 4박자마다 자리 섞임'},
           3:{bpm:50,sec:120,win:.22,items:8,dist:'hard',change:6,shuf:2,d:'도형 8개 · 색이나 모양이 같은 방해 도형 · 6박자마다 타겟 바뀜 · 2박자마다 자리 섞임'}}},
  bi:{tab:'양손 탭',title:'양손으로 박자 맞추기',
       d:'왼손·오른손 버튼을 정해진 차례대로 소리에 맞춰 누릅니다. 양손 협응과 리듬, 순서를 기억하는 연습입니다.',
       lv:{1:{bpm:40,sec:60,win:.35,pat:'alt',d:'왼손·오른손 번갈아 · 누를 손이 빛남 · 40 BPM · 1분'},
           2:{bpm:45,sec:90,win:.3,pat:'seq',d:'정해진 순서 반복 (예: 왼·왼·오·오) · 빛나는 안내 없이 순서 기억 · 1분 30초'},
           3:{bpm:50,sec:120,win:.25,pat:'cue',d:'박자마다 바뀌는 안내를 보고 누름 · 양손 동시 포함 · 2분'}}}
};
const HN={L:'왼손',R:'오른손',B:'양손'};
const HAND_SVG='<svg viewBox="0 0 64 64"><path d="M20 58 C12 50 8 40 10 32 C11 28 15 28 17 31 L20 36 L20 12 C20 8 26 8 26 12 L26 30 L27 8 C27 4 33 4 33 8 L33 30 L34 10 C34 6 40 6 40 10 L40 31 L41 16 C41 12 47 12 47 16 L47 40 C47 50 42 58 34 60 Z" fill="rgba(255,255,255,.9)"/></svg>';
const SET={mode:'sus',level:1,bpm:0,sec:0,sound:'soft',vol:.6};
const BPMS=[{k:0,t:'레벨 기본'},{k:40,t:'40'},{k:50,t:'50'},{k:60,t:'60'},{k:80,t:'80'}];
const TIMES=[{k:0,t:'레벨 기본'},{k:60,t:'1분'},{k:120,t:'2분'},{k:180,t:'3분'}];
const SOUNDS=[{k:'soft',t:'부드러운 톤'},{k:'click',t:'클릭'},{k:'beep',t:'비프'},{k:'off',t:'끔(화면만)'}];
const VOLS=[{k:.3,t:'작게'},{k:.6,t:'보통'},{k:1,t:'크게'}];

function seg(id,items,key){
  const box=$(id); box.innerHTML='';
  items.forEach(it=>{
    const b=document.createElement('button'); b.textContent=it.t; if(SET[key]===it.k) b.className='on';
    b.onclick=()=>{ SET[key]=it.k; seg(id,items,key); }; box.appendChild(b);
  });
}
function renderHome(){
  const tabs=$('tabs'); tabs.innerHTML='';
  ['sus','sel','bi'].forEach(m=>{
    const b=document.createElement('button'); b.className='tab'+(SET.mode===m?' on':''); b.textContent=MODES[m].tab;
    b.onclick=()=>{ SET.mode=m; SET.level=1; renderHome(); }; tabs.appendChild(b);
  });
  const M=MODES[SET.mode];
  const icon=SET.mode==='bi'
    ? '<div style="display:flex;width:110px"><div class="hd L" style="display:flex;align-items:center;justify-content:center;width:52px;height:64px;border-radius:12px;color:#fff;font-weight:900;margin-right:6px">왼</div><div class="hd R" style="display:flex;align-items:center;justify-content:center;width:52px;height:64px;border-radius:12px;color:#fff;font-weight:900">오</div></div>'
    : SET.mode==='sus'
    ? '<div style="width:70px;height:70px">'+shapeSVG('circle','blue')+'</div>'
    : '<div style="display:flex;width:110px;flex-wrap:wrap"><div style="width:52px;height:52px;margin:1px">'+shapeSVG('star','red')+'</div><div style="width:52px;height:52px;margin:1px;opacity:.45">'+shapeSVG('star','blue')+'</div><div style="width:52px;height:52px;margin:1px;opacity:.45">'+shapeSVG('tri','red')+'</div><div style="width:52px;height:52px;margin:1px;opacity:.45">'+shapeSVG('square','green')+'</div></div>';
  $('how').innerHTML='<div class="ic">'+icon+'</div><div><div class="t">'+M.title+'</div><div class="d">'+M.d+'</div></div>';
  const lv=$('levels'); lv.innerHTML='';
  [1,2,3].forEach(n=>{
    const b=document.createElement('button');
    b.className='lv-btn lv'+n+(SET.level===n?' on':'');
    b.innerHTML='<span class="lvn">LEVEL '+n+'</span><span><span class="t">'+['쉬움','중간','어려움'][n-1]+'</span><br><span class="d">'+M.lv[n].d+'</span></span>';
    b.onclick=()=>{ SET.level=n; renderHome(); }; lv.appendChild(b);
  });
  seg('seg-bpm',BPMS,'bpm'); seg('seg-time',TIMES,'sec'); seg('seg-sound',SOUNDS,'sound'); seg('seg-vol',VOLS,'vol');
}
function go(name){
  const ss=document.querySelectorAll('.screen'); for(let i=0;i<ss.length;i++) ss[i].classList.remove('on');
  $('scr-'+name).classList.add('on');
  $('back-btn').style.display=name==='home'?'none':'inline-block';
  window.scrollTo(0,0);
  if(name==='home') renderHome();
}
function backBtn(){
  const leave=()=>{ stopAll(); if(S) S.running=false; $('pause').classList.remove('on'); go('home'); };
  if(S&&S.running){ pauseGame(); askConfirm('처음 화면으로 갈까요?<br>지금 하던 내용은 저장되지 않습니다.',leave); return; }
  leave();
}

// ══ 소리 ══════════════════════════════════════════════
let AC=null, KEEP=null;
function initAudio(){
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state!=='running') AC.resume();
    if(!KEEP){ // 소리가 끊기지 않도록 들리지 않는 아주 작은 소리를 계속 흘림
      const o=AC.createOscillator(), g=AC.createGain(); o.frequency.value=30; g.gain.value=.0005;
      o.connect(g); g.connect(AC.destination); o.start(); KEEP=o;
    }
  }catch(e){}
}
document.addEventListener(window.PointerEvent?'pointerdown':'touchstart',()=>{ if(AC&&AC.state!=='running'){ try{AC.resume();}catch(e){} } },true);
// at: performance.now() 기준 시각 → 오디오 시각으로 바꿔 정확히 울림
function playAt(at,kind){
  if(!AC||SET.sound==='off') return;
  try{
    if(AC.state!=='running') AC.resume();
    const t=Math.max(AC.currentTime,AC.currentTime+(at-performance.now())/1000);
    const v=SET.vol;
    if(kind==='change'){ [880,1175].forEach((f,i)=>osc(f,'triangle',v*.6,t+i*.1,.15)); return; }
    const hi=kind==='count';
    if(SET.sound==='click'){
      const n=Math.floor(AC.sampleRate*.03), buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0);
      for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
      const src=AC.createBufferSource(), g=AC.createGain(); src.buffer=buf; g.gain.value=v*(hi?1:.8);
      src.connect(g); g.connect(AC.destination); src.start(t); return;
    }
    if(SET.sound==='beep') osc(hi?1320:880,'sine',v*.7,t,.2);
    else osc(hi?784:523,'triangle',v,t,.18);
  }catch(e){}
}
function osc(f,type,v,t,dur){
  const o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.value=f;
  o.connect(g); g.connect(AC.destination);
  g.gain.setValueAtTime(Math.max(.001,v),t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.start(t); o.stop(t+dur+.02);
}

// ══ 화면 배치 ═══════════════════════════════════════════
const SLOTS=[];
[1,3,5].forEach(r=>[1,3,5].forEach(c=>SLOTS.push([c/6*100,r/6*100])));
function randTarget(prev){
  let t; do{ t={sh:pick(Object.keys(SHAPES)),co:pick(Object.keys(COLORS))}; } while(prev&&prev.sh===t.sh&&prev.co===t.co);
  return t;
}
// 방해 도형: easy=모양·색 모두 다름, hard=모양이나 색 하나만 같음, mixed=반반
function distractor(t,kind){
  const shs=Object.keys(SHAPES), cos=Object.keys(COLORS);
  const both=()=>({sh:pick(shs.filter(s=>s!==t.sh)),co:pick(cos.filter(c=>c!==t.co))});
  const one=()=>Math.random()<.5?{sh:t.sh,co:pick(cos.filter(c=>c!==t.co))}:{sh:pick(shs.filter(s=>s!==t.sh)),co:t.co};
  if(kind==='easy') return both();
  if(kind==='hard') return one();
  return Math.random()<.5?both():one();
}
function layout(){
  const st=$('stage'); st.innerHTML='';
  const P=S.P;
  let items;
  if(S.mode==='sus') items=[{sh:S.target.sh,co:S.target.co,isT:true,size:P.size}];
  else {
    items=[{sh:S.target.sh,co:S.target.co,isT:true}];
    for(let i=1;i<P.items;i++) items.push(distractor(S.target,P.dist));
    const size=P.items<=4?140:P.items<=6?128:116;
    items.forEach(it=>it.size=size);
  }
  let slots;
  if(S.mode==='sus') slots=(P.move&&S.moved)?[pick(SLOTS.filter(s=>!(s[0]===S.lastSlot[0]&&s[1]===S.lastSlot[1])))]:[[50,50]];
  else slots=shuffle(SLOTS).slice(0,items.length);
  items.forEach((it,i)=>{
    const s=slots[i]; if(it.isT) S.lastSlot=s;
    const jx=S.mode==='sel'?(Math.random()*6-3):0, jy=S.mode==='sel'?(Math.random()*6-3):0;
    const d=document.createElement('div'); d.className='it';
    d.style.width=d.style.height=it.size+'px';
    d.style.left=(s[0]+jx)+'%'; d.style.top=(s[1]+jy)+'%';
    d.innerHTML=shapeSVG(it.sh,it.co);
    if(it.isT) d.setAttribute('data-t','1');
    bindPress(d,e=>{ if(e&&e.stopPropagation) e.stopPropagation(); tap(it.isT,d); });
    st.appendChild(d);
  });
}
function showTarget(changed){
  const t=$('tgt');
  t.innerHTML='<span class="lab">'+(S.mode==='sus'?'이 도형을 박자마다':'지금 타겟')+'</span><span style="width:56px;height:56px;display:inline-block">'+shapeSVG(S.target.sh,S.target.co)+'</span><span class="nm">'+nameOf(S.target)+'</span><span class="chg">바뀜!</span>';
  t.classList.remove('changed');
  if(changed){ void t.offsetWidth; t.classList.add('changed'); setTimeout(()=>t.classList.remove('changed'),1800); }
}
let FBAT=0;
function setFb(txt,cls){ FBAT=Date.now(); const f=$('fb'); f.textContent=txt; f.className='fb'+(cls?' '+cls:''); }

// ══ 박자 진행 ═══════════════════════════════════════════
// 박자 k의 시각 = T0 + k×간격. k<countUntil 은 준비 박자(채점 안 함)
let S=null;
function stopAll(){ if(!S) return; S.timers.forEach(clearTimeout); S.timers=[]; }
function later(fn,ms){ const id=setTimeout(fn,Math.max(0,ms)); S.timers.push(id); return id; }

function startGame(){
  initAudio();
  if(S){ stopAll(); S.running=false; }
  const M=MODES[SET.mode], base=M.lv[SET.level];
  const P=Object.assign({},base);
  if(SET.bpm) P.bpm=SET.bpm;
  if(SET.sec) P.sec=SET.sec;
  const iv=60000/P.bpm;
  S={mode:SET.mode,level:SET.level,P:P,iv:iv,W:iv*P.win,N:Math.max(8,Math.round(P.sec*P.bpm/60)),
     rec:[],off:[],extra:0,finalized:-1,running:true,paused:false,timers:[],target:randTarget(null),moved:false,lastSlot:[50,50],changes:[0]};
  $('g-title').textContent=M.tab+' · LEVEL '+SET.level+' · '+P.bpm+' BPM';
  go('game');
  if(S.mode==='bi'){ makeHands(); layoutBi(); cueFor(0); }
  else { showTarget(false); layout(); }
  setFb('소리를 듣고 박자를 느껴 보세요','mid');
  runFrom(0,4);
}
function runFrom(kStart,countIn){
  S.countUntil=kStart;
  S.T0=performance.now()+700+countIn*S.iv-kStart*S.iv;
  updateClock(kStart);
  sched(kStart-countIn);
}
function sched(k){
  const at=S.T0+k*S.iv;
  later(()=>beat(k,at),at-performance.now()-40);
}
function beat(k,at){
  if(!S.running||S.paused) return;
  const isCount=k<S.countUntil;
  playAt(at,isCount?'count':'beat');
  later(()=>{ // 화면 깜빡임은 실제 박자 시각에
    $('dot').classList.add('on'); $('stage').classList.add('pulse');
    setTimeout(()=>{ $('dot').classList.remove('on'); $('stage').classList.remove('pulse'); },130);
    const st=$('stage'); let c=st.querySelector('.count');
    if(isCount){ if(!c){ c=document.createElement('div'); c.className='count'; st.appendChild(c); } c.textContent=S.countUntil-k; }
    else if(c){ c.parentNode.removeChild(c); if(k===S.countUntil) setFb('',''); }
  },at-performance.now());
  if(!isCount) later(()=>finalize(k),at+S.W+30-performance.now());
  if(k<S.N-1) sched(k+1);
}
function updateClock(k){ $('g-left').textContent='남은 시간 '+mmss((S.N-k)*S.iv/1000); }
// 박자 k의 허용 시간이 끝남 → 안 눌렀으면 놓침, 그 다음 화면 변화
function finalize(k){
  if(!S.running) return;
  if(S.rec[k]&&S.rec[k].t==='part'){ S.rec[k].t='half'; setFb('양손을 함께 눌러야 해요','bad'); }
  if(!S.rec[k]){ S.rec[k]={t:'omit',need:S.hands?S.hands[k]:null}; if(Date.now()-FBAT>600) setFb('놓쳤어요','mid'); }
  S.finalized=k; updateClock(k+1);
  if(k>=S.N-1){ later(endGame,400); return; }
  const n=k+1, P=S.P;
  if(S.mode==='bi'){ cueFor(n); return; }
  if(S.mode==='sel'){
    if(n%P.change===0){ S.target=randTarget(S.target); S.changes.push(n); showTarget(true); layout(); playAt(performance.now(),'change'); setFb('타겟이 바뀌었어요','mid'); }
    else if(P.shuf&&n%P.shuf===0) layout();
  } else if(P.move&&n%P.move===0){ S.moved=true; layout(); }
}
function tap(isT,el){
  if(!S||!S.running||S.paused) return;
  const now=performance.now();
  const k=Math.round((now-S.T0)/S.iv), diff=now-(S.T0+k*S.iv);
  if(k<S.countUntil){ setFb('준비 소리예요. 숫자가 끝나면 시작해요','mid'); return; }
  if(k>=S.N) return;
  if(Math.abs(diff)>S.W){
    S.off.push(diff);
    setFb(diff<0?'조금 빨라요 — 소리에 맞춰요':'조금 늦어요 — 소리에 맞춰요','mid');
    return;
  }
  if(S.rec[k]){ S.extra++; setFb('한 박자에 한 번만 눌러요','mid'); return; }
  if(isT){
    S.rec[k]={t:'hit',d:diff};
    el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit');
    setFb('좋아요','ok');
  } else {
    S.rec[k]={t:'wrong'};
    el.classList.remove('bad'); void el.offsetWidth; el.classList.add('bad');
    setFb('타겟이 아니에요 — '+nameOf(S.target)+'를 누르세요','bad');
  }
}
// ── 양손 탭 ──
function makeHands(){
  const P=S.P, H=[];
  if(P.pat==='alt') for(let k=0;k<S.N;k++) H.push(k%2?'R':'L');
  else if(P.pat==='seq'){ S.pattern=pick(['LLRR','LRRL','LLR','RRL','LRLL','RLRR']); for(let k=0;k<S.N;k++) H.push(S.pattern[k%S.pattern.length]); }
  else { let prev=''; for(let k=0;k<S.N;k++){ let h; do{ h=Math.random()<.2?'B':pick(['L','R']); }while(h==='B'&&prev==='B'); H.push(h); prev=h; } }
  S.hands=H;
}
function layoutBi(){
  const st=$('stage'); st.innerHTML='';
  const box=document.createElement('div'); box.className='pads';
  ['L','R'].forEach(h=>{
    const d=document.createElement('div'); d.className='pad '+h; d.id='pad-'+h;
    d.innerHTML=(h==='R'?HAND_SVG:HAND_SVG.replace('<svg','<svg style="transform:scaleX(-1)"'))+HN[h];
    const fire=e=>{ if(e){ if(e.cancelable) e.preventDefault(); if(e.stopPropagation) e.stopPropagation(); } tapHand(h); };
    if(window.PointerEvent) d.addEventListener('pointerdown',fire);
    else { d.addEventListener('touchstart',e=>{ fire(e); },{passive:false}); d.addEventListener('mousedown',fire); }
    box.appendChild(d);
  });
  st.appendChild(box);
}
// 다음 박자(n)에 누를 손 안내
function cueFor(n){
  const P=S.P, need=S.hands[n];
  ['L','R'].forEach(h=>{ const el=$('pad-'+h); if(!el) return;
    const on=need&&(need===h||need==='B');
    el.classList.toggle('cue',P.pat!=='seq'&&!!on);
    el.classList.toggle('dim',P.pat!=='seq'&&!!need&&!on); });
  const t=$('tgt');
  if(P.pat==='seq') t.innerHTML='<span class="lab">이 순서를 반복</span><span class="seq">'+S.pattern.split('').map(h=>'<span class="hd '+h+'">'+HN[h].replace('손','')+'</span>').join('<span style="margin:0 2px;color:#9aa2b2">›</span>')+'</span>';
  else if(P.pat==='alt') t.innerHTML='<span class="lab">왼손 → 오른손 번갈아</span><span class="seq"><span class="hd L">왼</span><span class="hd R">오</span><span class="hd L">왼</span><span class="hd R">오</span></span>';
  else t.innerHTML='<span class="lab">다음 박자</span>'+(need?'<span class="bigcue hd '+need+'" style="display:inline-flex;height:56px;align-items:center">'+HN[need]+'</span>':'');
  t.classList.remove('changed');
}
function tapHand(h){
  if(!S||!S.running||S.paused) return;
  const now=performance.now();
  const k=Math.round((now-S.T0)/S.iv), diff=now-(S.T0+k*S.iv), el=$('pad-'+h);
  const flash=c=>{ el.classList.remove('ok','ng'); void el.offsetWidth; el.classList.add(c); };
  if(k<S.countUntil){ setFb('준비 소리예요. 숫자가 끝나면 시작해요','mid'); return; }
  if(k>=S.N) return;
  if(Math.abs(diff)>S.W){ S.off.push(diff); flash('ng'); setFb(diff<0?'조금 빨라요 — 소리에 맞춰요':'조금 늦어요 — 소리에 맞춰요','mid'); return; }
  const need=S.hands[k], r=S.rec[k];
  if(need==='B'){
    if(!r){ S.rec[k]={t:'part',need:'B',got:h,d:[diff]}; flash('ok'); return; }
    if(r.t==='part'&&r.got!==h){ r.t='hit'; r.d=(r.d[0]+diff)/2; r.gap=Math.abs(r.d-diff)*2; flash('ok'); setFb('좋아요 — 양손 함께','ok'); return; }
    S.extra++; return;
  }
  if(r){ S.extra++; setFb('한 박자에 한 번만 눌러요','mid'); return; }
  if(h===need){ S.rec[k]={t:'hit',need:need,d:diff,hand:h}; flash('ok'); setFb('좋아요','ok'); }
  else { S.rec[k]={t:'wrong',need:need,hand:h}; flash('ng'); setFb('반대 손이에요 — 이번은 '+HN[need],'bad'); }
}
document.addEventListener('keydown',e=>{
  if(!S||!S.running||S.mode!=='bi'||!$('scr-game').classList.contains('on')) return;
  const k=e.key; if(e.repeat) return;
  if(k==='ArrowLeft'||k==='f'||k==='F'){ e.preventDefault(); tapHand('L'); }
  if(k==='ArrowRight'||k==='j'||k==='J'){ e.preventDefault(); tapHand('R'); }
});
// 도형 밖을 누르면 안내만
bindPress($('stage'),()=>{ if(S&&S.running&&!S.paused&&S.mode!=='bi') setFb('도형을 눌러 주세요','mid'); });

function pauseGame(){
  if(!S||!S.running||S.paused) return;
  S.paused=true; stopAll();
  // 아직 허용 시간이 안 끝난 박자는 지우고, 다시 시작할 때 그 박자부터
  for(let k=S.finalized+1;k<S.rec.length;k++) S.rec[k]=undefined;
  const c=$('stage').querySelector('.count'); if(c) c.parentNode.removeChild(c);
  $('pause').classList.add('on');
}
function resumeGame(){
  $('pause').classList.remove('on');
  if(!S||!S.running) return;
  initAudio(); S.paused=false;
  if(S.mode==='bi') cueFor(Math.max(0,S.finalized+1));
  runFrom(Math.max(0,S.finalized+1),2);
}
function quitGame(){ $('pause').classList.remove('on'); if(S){ stopAll(); endGame(true); } }
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&S&&S.running&&!S.paused) pauseGame(); });

// ══ 결과 ═══════════════════════════════════════════════
function endGame(quit){
  if(!S||!S.running) return;
  S.running=false; stopAll();
  const done=S.finalized+1, R=S.rec.slice(0,done);
  const cnt=t=>R.filter(r=>r&&r.t===t).length;
  const hits=cnt('hit'), omit=cnt('omit'), wrong=cnt('wrong');
  const ds=R.filter(r=>r&&r.t==='hit').map(r=>r.d);
  const mAbs=avg(ds.map(Math.abs)), mSig=avg(ds);
  const d=new Date(), P=S.P, M=MODES[S.mode];
  const when=d.getFullYear()+'.'+(d.getMonth()+1)+'.'+d.getDate()+' '+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes();
  let h='<h2>리듬-타겟 훈련 결과 · '+M.tab+'</h2><div class="meta">'+when+' · LEVEL '+S.level+' · '+P.bpm+' BPM · '+done+'/'+S.N+'박자'+(quit?' · 중간에 그만둠':'')+'</div>';
  const tile=(v,u,k)=>'<div class="tile"><div class="v">'+(v==null?'-':v+'<small style="font-size:.9rem">'+u+'</small>')+'</div><div class="k">'+k+'</div></div>';
  let tend='-';
  if(mSig!=null) tend=Math.abs(mSig)<40?'박자에 잘 맞음':'평균 '+(Math.abs(mSig)/1000).toFixed(2)+'초 '+(mSig<0?'빠르게':'늦게');
  h+='<div class="tiles">'+tile(pct(hits,done),'%','박자 맞춰 누른 비율')+tile(omit,'번','놓친 박자')+
     (S.mode==='sel'?tile(wrong,'번','다른 도형 누름'):'')+
     (S.mode==='bi'?tile(wrong+cnt('half'),'번','반대 손·한 손만 누름'):'')+
     tile(S.off.length,'번','박자에서 벗어난 누름')+
     tile(mAbs==null?null:(mAbs/1000).toFixed(2),'초','박자와 평균 차이')+
     '<div class="tile"><div class="v" style="font-size:1.1rem;line-height:2.4rem">'+tend+'</div><div class="k">누르는 타이밍</div></div></div>';
  h+='<h3>시간 흐름에 따른 변화</h3><table><tr><th>구간</th><th>박자 맞춰 누른 비율</th><th>놓침</th>'+(S.mode==='sel'?'<th>다른 도형</th>':'')+'</tr>';
  const parts=[['처음 1/3',0,Math.round(done/3)],['중간 1/3',Math.round(done/3),Math.round(done*2/3)],['마지막 1/3',Math.round(done*2/3),done]];
  parts.forEach(p=>{
    const sg=R.slice(p[1],p[2]), n=sg.length, hh=sg.filter(r=>r&&r.t==='hit').length;
    const rate=pct(hh,n);
    h+='<tr><td class="l">'+p[0]+'</td><td><div style="display:flex;align-items:center"><div class="bar" style="flex:1;margin-right:10px"><i style="width:'+(rate||0)+'%"></i></div><b>'+(rate==null?'-':rate+'%')+'</b></div></td><td>'+sg.filter(r=>r&&r.t==='omit').length+'</td>'+
       (S.mode==='sel'?'<td>'+sg.filter(r=>r&&r.t==='wrong').length+'</td>':'')+'</tr>';
  });
  h+='</table>';
  if(S.mode==='bi'){
    h+='<h3>손별 결과</h3><table><tr><th>누를 손</th><th>박자 수</th><th>박자 맞춰 누른 비율</th><th>놓침</th><th>반대 손'+(R.some(r=>r&&r.need==='B')?' / 한 손만':'')+'</th><th>박자와 평균 차이</th></tr>';
    ['L','R','B'].forEach(hd=>{
      const g=R.filter(r=>r&&r.need===hd); if(!g.length) return;
      const hh=g.filter(r=>r.t==='hit'), md=avg(hh.map(r=>Math.abs(r.d)));
      h+='<tr><td class="l"><span class="hd '+hd+'" style="display:inline-flex;min-width:70px;height:34px;align-items:center;justify-content:center;border-radius:10px;color:#fff;font-weight:900">'+HN[hd]+'</span></td><td>'+g.length+'</td><td><b>'+pct(hh.length,g.length)+'%</b></td><td>'+g.filter(r=>r.t==='omit').length+'</td><td>'+g.filter(r=>r.t==='wrong'||r.t==='half').length+'</td><td>'+(md==null?'-':(md/1000).toFixed(2)+'초')+'</td></tr>';
    });
    h+='</table>';
    if(S.pattern) h+='<div class="note">반복 순서: '+S.pattern.split('').map(x=>HN[x]).join(' → ')+'</div>';
  }
  if(S.mode==='sel'){
    const after=[], rest=[];
    R.forEach((r,k)=>{ if(!r) return; const isAfter=S.changes.some(c=>c>0&&(k===c||k===c+1)); (isAfter?after:rest).push(r); });
    const ra=pct(after.filter(r=>r.t==='hit').length,after.length), rr=pct(rest.filter(r=>r.t==='hit').length,rest.length);
    h+='<h3>타겟이 바뀐 직후</h3><table><tr><th>박자</th><th>박자 맞춰 누른 비율</th></tr>'+
       '<tr><td class="l">타겟 바뀐 직후 2박자</td><td><b>'+(ra==null?'-':ra+'%')+'</b></td></tr>'+
       '<tr><td class="l">그 밖의 박자</td><td><b>'+(rr==null?'-':rr+'%')+'</b></td></tr></table>';
  }
  h+='<div class="note">'+(S.mode==='bi'
    ? '왼손과 오른손의 비율·박자 차이를 비교하면 한쪽 손의 어려움을 볼 수 있습니다. 반대 손을 누른 횟수가 많으면 순서 기억이나 좌우 구분을, 놓침이 많으면 속도나 주의 유지를 살펴보세요.'
    : S.mode==='sus'
    ? '마지막 구간으로 갈수록 비율이 떨어지면 집중을 오래 유지하기 어려운 것으로 볼 수 있습니다.'
    : '다른 도형을 누른 횟수는 방해 자극을 걸러내는 능력, 타겟이 바뀐 직후 비율은 새 타겟으로 주의를 옮기는 속도를 보여 줍니다.')+'</div>';
  $('rep').innerHTML=h;
  go('rep');
}

renderHome();
</script>
<script>
// 확인 창: 일부 병원 브라우저는 confirm() 창을 막아서 항상 '취소'로 처리되므로 화면 안 창으로 대신함
function askConfirm(msg,onYes){
  var old=document.getElementById('ask-ov'); if(old) old.parentNode.removeChild(old);
  var ov=document.createElement('div'); ov.id='ask-ov';
  ov.style.cssText='position:fixed;left:0;right:0;top:0;bottom:0;z-index:300;background:rgba(30,35,50,.45);display:flex;align-items:center;justify-content:center;padding:16px';
  ov.innerHTML='<div style="background:#fff;border-radius:16px;padding:20px;max-width:420px;width:100%;text-align:center;font-family:inherit">'+
    '<div style="font-size:1.15rem;font-weight:800;margin-bottom:16px;line-height:1.5">'+msg+'</div>'+
    '<div style="display:flex;justify-content:center">'+
    '<button id="ask-no" style="flex:1;margin:0 6px;min-height:56px;border-radius:12px;border:2px solid #d5dbe6;background:#fff;font:inherit;font-weight:800">아니요</button>'+
    '<button id="ask-yes" style="flex:1;margin:0 6px;min-height:56px;border-radius:12px;border:none;background:#c62828;color:#fff;font:inherit;font-weight:800">네, 나갈게요</button></div></div>';
  document.body.appendChild(ov);
  document.getElementById('ask-no').onclick=function(){ ov.parentNode.removeChild(ov); };
  document.getElementById('ask-yes').onclick=function(){ ov.parentNode.removeChild(ov); onYes(); };
}
</script>
